l cliente.", "D": "La entrega del código sin cláusulas especiales, porque el cliente paga y eso lo convierte en titular de todo lo entregado."}, "ok": "A", "porque": "Separar lo nuevo (que se cede) de lo preexistente (que se licencia) protege a ambas partes y evita pérdidas de activos que el equipo reutiliza.", "falla": {"B": "Negar siempre el código hace inviable el contrato y no responde al interés del cliente en mantener su sistema.", "C": "Ceder en silencio un activo reutilizable deja al equipo sin su propio framework.", "D": "Sin cláusulas, ni el cliente ni el equipo saben qué derechos tienen sobre cada componente."}}, {"n": 57, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El ANS de una propuesta dice «soporte rápido» y «alta disponibilidad». ¿Cómo debe corregirse?", "opts": {"A": "Sustituyéndolas por la promesa de atender «a la mayor brevedad posible» cualquier reporte que llegue del cliente.", "B": "Agregando más adjetivos, como «muy rápido» y «altísima disponibilidad», para transmitir mayor seguridad al cliente.", "C": "Definiendo métricas con valor, ventana y medición, como disponibilidad ≥ 99,5 % mensual y respuesta crítica ≤ 1 hora.", "D": "Eliminando el ANS y dejando que el área de soporte defina las condiciones de atención cuando surja el primer problema."}, "ok": "C", "porque": "Un ANS es útil si es medible: umbral, horario, forma de medición, exclusiones y consecuencias. Los adjetivos no se pueden verificar ni exigir.", "falla": {"A": "«A la mayor brevedad» es otra frase sin valor ni plazo.", "B": "Más adjetivos no agregan medición; el compromiso sigue siendo inverificable.", "D": "Sin ANS no hay compromiso exigible, y el desacuerdo estalla en el primer incidente."}}, {"n": 58, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Un ANS fija disponibilidad de 99,5 % mensual y un crédito del 5 % de la mensualidad ($4.000.000) por cada 0,5 puntos porcentuales o fracción por debajo de la meta. En el mes se midió 99,2 %. ¿Cuál es el crédito?", "opts": {"A": "$0", "B": "$400.000", "C": "$1.200.000", "D": "$200.000"}, "ok": "D", "porque": "99,5 − 99,2 = 0,3 puntos por debajo: una fracción de 0,5 puntos, es decir un tramo; 5 % de 4.000.000 = 200.000.", "falla": {"A": "Ignora que «o fracción» cuenta tramos incompletos.", "B": "Aplica dos tramos cuando solo hay uno: 0,3 puntos caben en un tramo de 0,5.", "C": "Convierte 0,3 puntos en 30 % de la mensualidad, un porcentaje que el ANS no establece."}}, {"n": 59, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El ANS exige un RPO de 1 hora. El sistema hace copias diarias a las 2:00 a. m. y falla a las 11:00 a. m. ¿Qué ocurre con el compromiso?", "opts": {"A": "El RPO se cumple si el sistema se restaura en una hora, sin importar cuántos datos se hayan perdido.", "B": "Pueden perderse hasta 9 horas de datos, lo que incumple el RPO; hay que aumentar la frecuencia de respaldo.", "C": "No hay incumplimiento, porque el RPO mide el tiempo que tarda la restauración completa del servicio.", "D": "Se pierde solo 1 hora de datos, de modo que el RPO se cumple y no hace falta hacer ningún cambio."}, "ok": "B", "porque": "El RPO es la pérdida máxima de datos tolerable (tiempo desde el último respaldo); el RTO es el tiempo máximo para restaurar. De 2:00 a 11:00 son 9 horas.", "falla": {"A": "Confunde RPO (datos) con RTO (tiempo de recuperación).", "C": "El tiempo de restauración es el RTO; el RPO mide la pérdida de datos.", "D": "La última copia fue a las 2:00 a. m.; la pérdida posible es de 9 horas, no de 1."}}, {"n": 60, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Tras presentar la propuesta, el cliente dice que «le gustó». ¿Qué evidencia produce la validación formal?", "opts": {"A": "Un acta con fecha, participantes, sugerencias clasificadas, ajustes antes y después y compromisos, aceptada por ambas partes.", "B": "Una nota interna del equipo con su impresión general sobre cómo reaccionó el cliente durante toda la presentación.", "C": "Un mensaje de agradecimiento enviado por el cliente, que el equipo guarda como prueba de que la propuesta quedó aceptada.", "D": "Una captura de pantalla de la presentación proyectada, que demuestra que la reunión se realizó en la fecha acordada."}, "ok": "A", "porque": "Validar es dejar constancia verificable de qué se pidió, qué se acordó y qué cambió. Sin acta, el acuerdo no es exigible ni auditable.", "falla": {"B": "Una impresión interna es subjetiva y no la firma la contraparte.", "C": "Un agradecimiento no precisa qué se aceptó ni con qué cambios.", "D": "La captura prueba que hubo presentación, no que el cliente validara condiciones."}}]};
const M = D.meta, Q = D.preguntas, BY = Object.fromEntries(Q.map(q => [q.n, q]));
const KEY = 'banco-3413974-' + M.id;
const $ = s => document.querySelector(s);
let S = {ans: {}, wrong: {}, sims: [], tab: 'estudio'};
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = {rap: '', nivel: '', caso: false, pend: false};
let SIM = null, timer = null;

function head() {
  $('#kicker').textContent = 'Ficha 3413974 · Análisis y Desarrollo de Software · Guía ' + M.id.slice(1);
  $('#h1').textContent = M.titulo;
  $('#sub').textContent = M.sub;
  $('#meta').innerHTML = ['Competencia ' + M.norma, 'Prueba de conocimiento: ' + M.prueba, 'Entrega de productos: ' + M.entrega, 'Aprueba con 70 o más']
    .map(t => '<span class="pill">' + esc(t) + '</span>').join('');
  $('#how').innerHTML = '<h2>Cómo usar este banco</h2><ul>' +
    '<li><b>Estudio:</b> responde, mira si acertaste y lee por qué la correcta lo es y por qué fallan las otras. Intenta cada pregunta por tu cuenta antes de ver la explicación.</li>' +
    '<li><b>Simulacro:</b> 20 preguntas al azar en 40 minutos, sin ayudas, calificadas sobre 100 como la prueba real. Aprueba con 70.</li>' +
    '<li>La prueba del <b>' + esc(M.prueba) + '</b> se presenta en Moodle (Zajuna) con nota automática: algunas preguntas salen de este banco y otras son nuevas, del mismo nivel. Memorizar letras no sirve: las opciones se barajan.</li>' +
    '<li>Tu avance se guarda solo en este navegador.</li></ul>';
  $('#foot').textContent = 'SENA · Centro de la Industria, la Empresa y los Servicios · Banco de estudio de la Guía ' + M.id.slice(1) + ' · uso académico';
}

function stats() {
  const tot = Q.length, a = Object.keys(S.ans).length;
  const ok = Object.entries(S.ans).filter(([n, l]) => BY[n].ok === l).length;
  const best = S.sims.length ? Math.max(...S.sims.map(s => s.score)) : null;
  $('#statsPanel').innerHTML = '<div class="stats">' +
    '<div class="stat"><b>' + a + ' / ' + tot + '</b><span>Respondidas</span></div>' +
    '<div class="stat"><b>' + (a ? Math.round(ok * 100 / a) + ' %' : '—') + '</b><span>Aciertos en estudio</span></div>' +
    '<div class="stat"><b>' + Object.keys(S.wrong).length + '</b><span>Por repasar</span></div>' +
    '<div class="stat"><b>' + (best === null ? '—' : best + ' / 100') + '</b><span>Mejor simulacro</span></div></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + tot + '" aria-valuenow="' + a + '"><i style="width:' + (a * 100 / tot) + '%"></i></div>' +
    '<div class="row"><button class="btn ghost" id="reset">Reiniciar mi avance</button></div>';
  $('#reset').onclick = () => { if (confirm('¿Borrar tus respuestas y tu avance en este navegador?')) { S = {ans: {}, wrong: {}, sims: [], tab: S.tab}; save(); render(); } };
}

function tabs() {
  const T = [['estudio', 'Estudio', Q.length], ['simulacro', 'Simulacro', ''], ['errores', 'Mis errores', Object.keys(S.wrong).length]];
  $('#tabs').innerHTML = T.map(([k, n, c]) => '<button class="tab" role="tab" aria-selected="' + (S.tab === k) + '" data-t="' + k + '">' + n + (c !== '' ? '<span class="c">' + c + '</span>' : '') + '</button>').join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; save(); render(); });
}

function chips(q) {
  return '<div class="qh"><span class="num">' + q.n + '</span><span class="chip">RAP ' + q.rap + '</span><span class="chip ' + q.nivel + '">' + q.nivel + '</span>' + (q.caso ? '<span class="chip caso">Caso</span>' : '') + '</div>';
}

// chosen: letra elegida o undefined; reveal: mostrar retroalimentación; interactive: permitir elegir
function card(q, chosen, reveal, interactive) {
  const opts = ['A', 'B', 'C', 'D'].map(l => {
    let cls = 'opt';
    if (reveal) { if (l === q.ok) cls += ' ok'; else if (l === chosen) cls += ' bad'; else cls += ' dim'; }
    else if (l === chosen) cls += ' sel';
    const dis = (reveal || !interactive) ? ' disabled' : '';
    const mark = reveal ? (l === q.ok ? ' <span class="sr" aria-label="correcta"></span>' : '') : '';
    return '<button class="' + cls + '" data-n="' + q.n + '" data-l="' + l + '"' + dis + ' aria-pressed="' + (l === chosen) + '"><span class="l">' + l + '</span><span class="t">' + q.opts[l] + mark + '</span></button>';
  }).join('');
  let fb = '';
  if (reveal) {
    const acierto = chosen === q.ok;
    fb = '<div class="fb ' + (acierto ? 'ok' : 'bad') + '"><h4>' + (chosen === undefined ? 'Respuesta correcta: ' + q.ok : acierto ? '¡Correcto!' : 'No es esa. La correcta es la ' + q.ok) + '</h4>' + q.porque + '</div>';
    const otras = ['A', 'B', 'C', 'D'].filter(l => l !== q.ok);
    fb += '<details' + (!acierto && chosen ? ' open' : '') + '><summary>Por qué fallan las otras opciones</summary><ul>' +
      otras.map(l => '<li><b>' + l + ')</b> ' + q.falla[l] + '</li>').join('') + '</ul></details>';
  }
  return '<article class="card" id="q' + q.n + '">' + chips(q) + '<p class="stem">' + q.stem + '</p><div class="opts" role="group" aria-label="Opciones de la pregunta ' + q.n + '">' + opts + '</div>' + fb + '</article>';
}

function raps() {
  const m = new Map(); Q.forEach(q => { if (!m.has(q.rap)) m.set(q.rap, q.seccion.replace(/^(Tema|Parte)\s*\d+\.\s*/, '').replace(/\s*\(RAP[^)]*\)\s*$/, '')); });
  return [...m.entries()];
}

function estudio() {
  const R = raps();
  let list = Q.filter(q => (!F.rap || q.rap === F.rap) && (!F.nivel || q.nivel === F.nivel) && (!F.caso || q.caso) && (!F.pend || !(q.n in S.ans)));
  const f = '<div class="panel filters"><label>RAP <select id="fRap"><option value="">Todos</option>' + R.map(([r, t]) => '<option value="' + r + '"' + (F.rap === r ? ' selected' : '') + '>' + r + ' · ' + esc(t.slice(0, 46)) + '</option>').join('') + '</select></label>' +
    '<label>Nivel <select id="fNivel"><option value="">Todos</option>' + ['Básica', 'Intermedia', 'Avanzada'].map(n => '<option' + (F.nivel === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
    '<label><input type="checkbox" id="fCaso"' + (F.caso ? ' checked' : '') + '> Solo casos</label>' +
    '<label><input type="checkbox" id="fPend"' + (F.pend ? ' checked' : '') + '> Solo sin responder</label>' +
    '<span style="margin-left:auto;color:var(--mut);font-size:13px">' + list.length + ' preguntas</span></div>';
  const body = list.length ? list.map(q => { const c = S.ans[q.n]; return card(q, c, c !== undefined, true) + (c !== undefined ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('') : '<div class="empty">No hay preguntas con ese filtro.</div>';
  $('#view').innerHTML = f + body;
  $('#fRap').onchange = e => { F.rap = e.target.value; render(); };
  $('#fNivel').onchange = e => { F.nivel = e.target.value; render(); };
  $('#fCaso').onchange = e => { F.caso = e.target.checked; render(); };
  $('#fPend').onchange = e => { F.pend = e.target.checked; render(); };
  bindOpts(false);
}

function errores() {
  const list = Q.filter(q => S.wrong[q.n]);
  $('#view').innerHTML = list.length ? '<p class="empty" style="padding:14px 0 0">Preguntas que fallaste en estudio o simulacro. Acierta una de nuevo y sale de esta lista.</p>' +
    list.map(q => { const c = S.ans[q.n]; const rev = c !== undefined && S.ans[q.n] !== undefined; return card(q, c, rev, true) + (rev ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('')
    : '<div class="empty"><b>Nada por repasar.</b><br>Cuando falles una pregunta, aparecerá aquí.</div>';
  bindOpts(false);
}

function bindOpts(sim) {
  document.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, l = b.dataset.l;
    if (sim) { SIM.ans[n] = l; simRender(); return; }
    S.ans[n] = l;
    if (l === BY[n].ok) delete S.wrong[n]; else S.wrong[n] = true;
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { const n = +b.dataset.retry; delete S.ans[n]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
}

/* ---------- Simulacro ---------- */
function pick(arr, k) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); }
function simStart() {
  const by = n => Q.filter(q => q.nivel === n);
  const ids = pick(by('Básica'), 4).concat(pick(by('Intermedia'), 9), pick(by('Avanzada'), 7));
  SIM = {ids: pick(ids, ids.length).map(q => q.n), ans: {}, t0: Date.now(), dur: 40 * 60 * 1000, done: false};
  clearInterval(timer); timer = setInterval(tick, 1000); simRender();
}
function left() { return Math.max(0, SIM.dur - (Date.now() - SIM.t0)); }
function fmt(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick() { if (!SIM || SIM.done) { clearInterval(timer); return; } const t = $('#tm'); if (t) t.textContent = fmt(left()); if (left() === 0) simFinish(); }
function simFinish() {
  if (!SIM || SIM.done) return; SIM.done = true; clearInterval(timer);
  let ok = 0; const porRap = {};
  SIM.ids.forEach(n => { const q = BY[n], a = SIM.ans[n]; const g = a === q.ok; if (g) ok++; porRap[q.rap] = porRap[q.rap] || [0, 0]; porRap[q.rap][1]++; if (g) porRap[q.rap][0]++; if (!g) S.wrong[n] = true; else if (!(n in S.ans) || S.ans[n] === q.ok) delete S.wrong[n]; });
  SIM.score = ok * 5; SIM.ok = ok; SIM.porRap = porRap;
  S.sims.push({score: SIM.score, fecha: new Date().toISOString().slice(0, 10)}); save(); stats(); tabs(); simRender();
}
function simRender() {
  if (!SIM) {
    $('#view').innerHTML = '<div class="panel"><h2 style="margin-top:0">Simulacro de la prueba de conocimiento</h2><p>20 preguntas al azar (4 básicas, 9 intermedias, 7 avanzadas), <b>40 minutos</b>, sin ver las respuestas hasta entregar. Se califica sobre 100 (5 puntos por pregunta) y se aprueba con <b>70</b>.</p><p style="color:var(--mut)">El reloj empieza al pulsar el botón. Si se acaba el tiempo, se entrega solo.</p><div class="row"><button class="btn primary" id="go">Empezar simulacro</button></div></div>';
    $('#go').onclick = simStart; return;
  }
  const qs = SIM.ids.map(n => BY[n]);
  if (!SIM.done) {
    const resp = Object.keys(SIM.ans).length;
    $('#view').innerHTML = '<div class="panel simbar"><span>Tiempo restante <span class="timer" id="tm">' + fmt(left()) + '</span></span><span>' + resp + ' / ' + qs.length + ' respondidas</span><button class="btn primary" id="fin">Entregar</button></div>' +
      qs.map((q, i) => card(Object.assign({}, q, {n: q.n}), SIM.ans[q.n], false, true).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
    bindOpts(true);
    $('#fin').onclick = () => { const f = qs.length - Object.keys(SIM.ans).length; if (!f || confirm('Te faltan ' + f + ' sin responder. ¿Entregar de todos modos?')) simFinish(); };
    return;
  }
  const pass = SIM.score >= 70;
  const filas = Object.entries(SIM.porRap).map(([r, [a, t]]) => '<tr><td>RAP ' + r + '</td><td>' + a + ' / ' + t + '</td></tr>').join('');
  $('#view').innerHTML = '<div class="panel"><div class="score ' + (pass ? 'pass' : 'fail') + '">' + SIM.score + ' / 100</div><p style="margin:6px 0 0"><b>' + (pass ? 'Aprobaste el simulacro.' : 'Aún no llegas a 70.') + '</b> ' + SIM.ok + ' de ' + qs.length + ' correctas.</p><table><thead><tr><th>Resultado de aprendizaje</th><th>Aciertos</th></tr></thead><tbody>' + filas + '</tbody></table><div class="row"><button class="btn primary" id="again">Hacer otro simulacro</button></div></div>' +
    qs.map((q, i) => card(q, SIM.ans[q.n], true, false).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
  $('#again').onclick = () => { SIM = null; simStart(); };
}

function render() {
  stats(); tabs();
  if (S.tab === 'estudio') estudio();
  else if (S.tab === 'errores') errores();
  else simRender();
}
head(); render();
</script>
</body>
</html>
