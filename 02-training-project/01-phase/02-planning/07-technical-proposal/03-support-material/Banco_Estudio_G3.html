<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de estudio · Guía 3 · Propuesta técnica</title>
<style>
:root{
  --bg:#f5f7f4;--card:#fff;--txt:#17201a;--mut:#5a665e;--line:#dde5de;
  --brand:#2b8200;--brand-ink:#fff;--brand-bg:#e7f3de;
  --ok:#17692f;--okbg:#e5f5e9;--bad:#b3261e;--badbg:#fdeceb;
  --warn:#7a4f00;--warnbg:#fff3d9;--ind:#34479f;--indbg:#e9edff;
  --sh:0 1px 2px rgba(18,28,20,.05),0 6px 20px rgba(18,28,20,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1410;--card:#161e18;--txt:#e9f0ea;--mut:#9aa89e;--line:#273229;
  --brand:#74d63c;--brand-ink:#0b1608;--brand-bg:#1b2d13;
  --ok:#62d684;--okbg:#12301c;--bad:#ff8f86;--badbg:#341b19;
  --warn:#f0bb59;--warnbg:#33270d;--ind:#a3b4ff;--indbg:#1c2347;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}
header.top{background:linear-gradient(135deg,#1f6300,#39a900);color:#fff;padding:34px 0 26px}
header.top .wrap{padding-bottom:0}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 6px}
h1{margin:0 0 6px;font-size:clamp(24px,4.6vw,34px);line-height:1.15;letter-spacing:-.01em}
.sub{margin:0;opacity:.92;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-top:16px}
.how{margin-top:-18px;position:relative}
.how h2{margin:0 0 6px;font-size:16px}
.how ul{margin:6px 0 0;padding-left:20px;color:var(--mut)}
.how li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab .c{font-weight:500;opacity:.8;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
select,button.btn{font:inherit}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-weight:600}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.ghost{color:var(--mut);font-weight:500}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ind);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:14px}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.num{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:8px;padding:2px 9px;font-size:14px;margin-right:2px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--mut)}
.chip.Básica{background:var(--brand-bg);color:var(--ok);border-color:transparent}
.chip.Intermedia{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.Avanzada{background:var(--indbg);color:var(--ind);border-color:transparent}
.chip.caso{border-color:var(--ind);color:var(--ind)}
.stem{margin:6px 0 12px;font-size:17px;font-weight:550}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-bg)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt .t{flex:1}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ind);background:var(--indbg)}
.opt.sel .l{background:var(--ind);border-color:var(--ind);color:var(--brand-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--brand-ink)}
.opt.dim{opacity:.62}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb h4{margin:0 0 4px;font-size:14px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
details{margin-top:10px;font-size:14.5px}
summary{cursor:pointer;color:var(--mut);font-weight:600}
details ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:7px}
details li{border-left:3px solid var(--line);padding:2px 0 2px 10px}
details li b{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.simbar{position:sticky;top:52px;z-index:4;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.score{font-size:42px;font-weight:800;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
footer{color:var(--mut);font-size:13px;margin-top:28px;text-align:center}
code{background:var(--brand-bg);padding:1px 5px;border-radius:5px;font-size:.92em}
@media (max-width:560px){.card{padding:14px}.stem{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="kicker" id="kicker"></p>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
</div></header>
<main class="wrap">
  <section class="panel how" id="how"></section>
  <section class="panel" id="statsPanel"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>
<script>
const D = {"meta": {"id": "G3", "titulo": "Propuesta técnica", "sub": "Especificaciones técnicas, propuesta técnica y validación con las partes", "norma": "220501094", "fase": "Planeación", "actividad": "Estructurar la propuesta técnica del proyecto de software", "prueba": "sábado 5 de diciembre de 2026", "entrega": "sábado 5 de diciembre de 2026, 6:00 a. m.", "raps": "593060 · 593062 · 593061"}, "preguntas": [{"n": 1, "rap": "593060", "nivel": "Básica", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una empresa compra computadores para su sala de sistemas. ¿Cuál de estas líneas de una ficha técnica puede comprobarse al recibir los equipos?", "opts": {"A": "Memoria RAM: mínimo 16 GB DDR4, comprobable en la información del sistema del equipo entregado.", "B": "Memoria RAM: la necesaria para que el grupo trabaje con fluidez en sus tareas de programación diarias.", "C": "Procesador: de última generación y de una marca reconocida por su rendimiento en el mercado.", "D": "Almacenamiento: amplio y rápido, con capacidad suficiente para guardar los proyectos del año."}, "ok": "A", "porque": "Una característica técnica es verificable cuando trae valor, unidad y una forma de comprobarla; los adjetivos no permiten comparar ofertas ni rechazar un equipo.", "falla": {"B": "«La necesaria» y «con fluidez» son juicios subjetivos: no hay cifra contra la cual medir.", "C": "«Última generación» y «marca reconocida» son apreciaciones y además orientan la compra hacia un fabricante.", "D": "«Amplio», «rápido» y «suficiente» no traen cantidad ni unidad, así que cada proveedor los interpreta a su conveniencia."}}, {"n": 2, "rap": "593060", "nivel": "Básica", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "¿Cuál es la función del referente técnico al definir las especificaciones de un software?", "opts": {"A": "Repartir las tareas entre el equipo de desarrollo según los perfiles y la disponibilidad de cada integrante.", "B": "Describir el procedimiento con el que el usuario final aprenderá a operar el sistema después de la entrega formal.", "C": "Fijar las características y el desempeño que debe cumplir el bien o servicio, con base en estándares y normas.", "D": "Registrar el precio que ofrece el proveedor preferido de la empresa para cada componente de la solución informática."}, "ok": "C", "porque": "El referente técnico es el punto de comparación objetivo (estándar, norma, nivel de desempeño) contra el cual se escribe la ficha y se evalúan las ofertas.", "falla": {"A": "La asignación de tareas pertenece al plan del proyecto, no a las especificaciones técnicas.", "B": "La capacitación al usuario es un entregable del proyecto; el referente no describe cómo se enseña el sistema.", "D": "El precio aparece en la cotización o en el presupuesto, no en el referente; mezclarlos lleva a elegir proveedor antes de definir la necesidad."}}, {"n": 3, "rap": "593060", "nivel": "Básica", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "¿Qué caracteriza a una licencia de software propietaria?", "opts": {"A": "La licencia aplica principalmente cuando el software se instala dentro de una entidad del sector público estatal de Colombia.", "B": "El usuario puede modificar el código fuente y redistribuirlo con la única condición de conservar el nombre del autor original.", "C": "El programa se entrega normalmente sin costo y con pocas condiciones, porque la licencia se limita a permitir copias gratuitas.", "D": "El titular conserva el control: el usuario recibe un derecho de uso limitado y normalmente sin acceso al código."}, "ok": "D", "porque": "En el licenciamiento propietario (EULA) el titular decide cuántas copias, usuarios y usos se permiten; el código fuente, por lo general, no se entrega.", "falla": {"A": "El tipo de licencia no depende de si el cliente es público o privado.", "B": "Modificar y redistribuir libremente es la lógica del software libre, no del propietario.", "C": "Propietario no significa gratuito: puede cobrarse y, aun siendo gratis (freeware), conserva restricciones."}}, {"n": 4, "rap": "593060", "nivel": "Básica", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "De los derechos de autor sobre un software, ¿cuáles pueden transferirse a un cliente mediante contrato?", "opts": {"A": "Los derechos morales, porque son los que permiten decidir quién puede usar el programa y cuánto se cobra por ese uso.", "B": "Los patrimoniales, de forma expresa y por escrito, con modalidades de uso, plazo y territorio definidos.", "C": "Ninguno de los dos tipos, porque la ley colombiana solo permite licenciar el software y no ceder derechos sobre él.", "D": "Ambos tipos, desde el momento en que el cliente paga la primera cuota del proyecto, aunque no se firme documento alguno."}, "ok": "B", "porque": "La Ley 23 de 1982 distingue derechos morales (reconocimiento de autoría, integridad) que acompañan al autor, y derechos patrimoniales (explotación económica), que se pueden ceder.", "falla": {"A": "Los derechos morales vinculan al autor con su obra y no se ceden; la explotación económica es la patrimonial.", "C": "Los derechos patrimoniales sí pueden cederse; afirmar lo contrario ignora la práctica contractual normal.", "D": "La cesión de derechos patrimoniales requiere pacto expreso; el pago por sí solo no transfiere titularidad."}}, {"n": 5, "rap": "593060", "nivel": "Básica", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "¿Qué norma colombiana contiene el régimen general de protección de datos personales?", "opts": {"A": "La Ley 527 de 1999, que reconoce el valor de los mensajes de datos, el comercio electrónico y las firmas digitales.", "B": "La Ley 80 de 1993, que establece el Estatuto General de Contratación de la Administración Pública.", "C": "La Ley 23 de 1982, que regula los derechos de autor sobre las obras literarias, artísticas y científicas.", "D": "La Ley 1581 de 2012, que regula la autorización, las finalidades y los deberes de quienes tratan datos personales."}, "ok": "D", "porque": "La Ley 1581 de 2012 (con su reglamentación) es la norma marco de habeas data que debe citarse en el referente técnico de cualquier software que almacene datos de personas.", "falla": {"A": "La Ley 527 valida mensajes de datos y firmas; es útil para contratos electrónicos, no para el régimen de datos personales.", "B": "Es el estatuto de contratación estatal: habla de cómo contrata el Estado, no de datos personales.", "C": "Es la ley de derechos de autor: protege el software como obra, pero no regula el tratamiento de datos."}}, {"n": 6, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una empresa tiene 45 empleados, pero nunca hay más de 14 conectados a la vez. El proveedor cobra $400.000 por licencia nominal y $900.000 por licencia concurrente (ambos precios son pagos únicos), y la empresa exige un margen del 20 % sobre el pico. ¿Qué dimensionamiento cubre la necesidad al menor costo?", "opts": {"A": "17 licencias concurrentes: 14 de pico más 20 % de margen, redondeado hacia arriba, por $15.300.000.", "B": "45 licencias concurrentes, para que todos se conecten a la vez, por un total de $40.500.000.", "C": "45 licencias nominales, una por cada empleado de la empresa, por un total de $18.000.000 pagados de una vez.", "D": "14 licencias concurrentes, iguales al pico observado, por $12.600.000 y sin ningún margen."}, "ok": "A", "porque": "Se dimensiona sobre el uso real: pico 14 × 1,2 = 16,8, que se redondea a 17; 17 × $900.000 = $15.300.000, menor que 45 × $400.000 = $18.000.000.", "falla": {"B": "Sobredimensiona: paga por conexiones simultáneas que nunca ocurren y más que triplica el costo necesario.", "C": "Cumple, pero cuesta $2.700.000 más: ignora que solo 14 personas usan el sistema a la vez.", "D": "Es la opción más barata en apariencia, pero sin margen el sistema bloquea usuarios en cuanto el pico crece, y se incumple el requisito del 20 %."}}, {"n": 7, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Un equipo distribuye un instalador de su aplicación propietaria. Dentro del programa enlazó una librería licenciada bajo GPL v3. ¿Qué obligación se activa al entregar el instalador a un cliente?", "opts": {"A": "Ofrecer a quien lo reciba el código fuente de la obra combinada bajo la misma licencia GPL v3.", "B": "Pagar al autor de la librería una regalía por cada copia del instalador que se distribuya.", "C": "Mencionar el nombre de la librería y su licencia GPL v3 en los créditos del instalador, sin ofrecer el código fuente.", "D": "Ninguna obligación adicional, porque la licencia deja de aplicar cuando el cliente paga por el programa completo."}, "ok": "A", "porque": "La GPL es una licencia de copyleft fuerte: al distribuir una obra derivada, esta debe ofrecerse con su código fuente y bajo la misma licencia. Por eso el dimensionamiento de licencias revisa las dependencias.", "falla": {"B": "La GPL permite uso comercial sin regalías; lo que exige es compartir el código bajo sus mismas condiciones.", "C": "Citar créditos es exigencia de licencias permisivas como MIT; la GPL pide algo más fuerte.", "D": "El pago del cliente no cambia la licencia de los componentes; la obligación sigue a la distribución."}}, {"n": 8, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "El contrato para desarrollar un sistema a la medida no dice quién será titular de los derechos patrimoniales. El cliente da por hecho que, al pagar, el sistema es suyo. ¿Qué debe hacer la propuesta?", "opts": {"A": "Dejar el tema en silencio: la ley presume que quien paga el desarrollo queda como titular de todos los derechos patrimoniales, sin límite de uso ni de alcance.", "B": "Registrar el software en la Cámara de Comercio, porque allí se inscribe la titularidad de los programas de computador.", "C": "Incluir una cláusula escrita de propiedad intelectual que defina titularidad o cesión, modalidades, plazo y territorio.", "D": "Entregar el código fuente al finalizar, porque la entrega del código transfiere la titularidad al cliente."}, "ok": "C", "porque": "El art. 20 de la Ley 23 de 1982 (modificado por el art. 28 de la Ley 1450 de 2011) presume, salvo pacto en contrario, que en las obras creadas por encargo los derechos patrimoniales pasan al encargante, pero solo en la medida necesaria para sus actividades habituales. Esa presunción es limitada y deja dudas sobre modalidades, plazo, territorio y derecho a modificar o revender; la cláusula escrita fija esos límites antes de firmar y no depende de la presunción. Verificar la vigencia y el texto del artículo en la fuente oficial (SUIN-Juriscol o Senado) antes de citarlo en clase.", "falla": {"A": "La presunción legal no es una titularidad total ni ilimitada: cubre solo lo necesario para las actividades habituales del encargante y admite pacto en contrario. Confiar en el silencio es la fuente de los conflictos: nadie sabe el alcance real de la cesión.", "B": "La Cámara de Comercio registra matrículas mercantiles; el registro de obras de software es ante la Dirección Nacional de Derecho de Autor.", "D": "Entregar archivos no es ceder derechos: el cliente tendría el código sin permiso claro para modificarlo o revenderlo."}}, {"n": 9, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una aplicación de citas odontológicas guardará la historia clínica de los pacientes. ¿Qué debe prever el referente técnico respecto de la Ley 1581 de 2012?", "opts": {"A": "Un aviso de privacidad visible en el pie de página del sitio, sin necesidad de pedir autorización a cada paciente.", "B": "Autorización previa, expresa e informada, finalidad declarada y seguridad reforzada por ser datos sensibles.", "C": "Cifrar la contraseña de la cuenta de cada usuario y usar HTTPS, porque con eso se cumple el principio de seguridad.", "D": "Medidas generales de seguridad, porque los datos de salud se consideran semiprivados y su uso por terceros aliados es permitido."}, "ok": "B", "porque": "Los datos de salud son sensibles: su tratamiento exige autorización explícita, finalidad clara y protección reforzada, y esto se refleja en requisitos del software (consentimiento, trazabilidad, cifrado).", "falla": {"A": "Un aviso informa, pero no sustituye la autorización previa y expresa, y menos para datos sensibles.", "C": "Proteger solo la contraseña deja expuestos los datos clínicos; la seguridad debe cubrir el dato sensible en reposo y en tránsito.", "D": "Los datos de salud son sensibles, no semiprivados: su tratamiento está restringido y exige autorización y seguridad reforzada; no se comparten con terceros aliados sin ella."}}, {"n": 10, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una empresa colombiana contrata un servicio de nube con servidores en otro país para alojar su base de clientes. El proveedor solo trata los datos siguiendo las instrucciones de la empresa. ¿Qué exige la reglamentación para esa comunicación internacional de datos?", "opts": {"A": "Pedir al titular una nueva autorización por cada envío de datos, porque los datos salen del país y eso lo exige la ley en todos los casos.", "B": "Ninguna formalidad, porque el proveedor es un tercero y la empresa deja de ser responsable de los datos al enviarlos a su servidor.", "C": "Declarar la operación como una venta de la base de datos al proveedor, porque este pasa a decidir sobre el uso que se les dará.", "D": "Un contrato de transmisión con alcance, seguridad y confidencialidad; con él no se exige consentimiento adicional del titular."}, "ok": "D", "porque": "Si el proveedor trata los datos por cuenta del responsable, se trata de una transmisión (distinta de la transferencia, que es hacia otro responsable). El Decreto 1074 de 2015 (art. 2.2.2.25.5.1) dice que las transmisiones internacionales entre responsable y encargado, con contrato de transmisión, no requieren informar al titular ni su consentimiento; el art. 2.2.2.25.5.2 fija el contenido del contrato: alcance, actividades por cuenta del responsable, tratamiento conforme a los principios, seguridad de las bases de datos y confidencialidad. Comparar con la pregunta 15 (transferencia). Nota: la SIC suele usar «transferencia» en sentido amplio en sus circulares; la distinción de esta pregunta es la del decreto.", "falla": {"A": "Cuando el proveedor actúa como encargado y existe contrato de transmisión, la reglamentación no exige informar al titular ni obtener su consentimiento adicional.", "B": "El responsable sigue respondiendo por el tratamiento que hace el encargado en su nombre; por eso se exige un contrato con deberes del encargado.", "C": "No hay venta ni cambio de responsable: el proveedor trata los datos por cuenta de la empresa y no decide sus finalidades."}}, {"n": 11, "rap": "593060", "nivel": "Intermedia", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Al diseñar el formato de ficha técnica que usará la organización, ¿qué campos debe incluir el formato aunque cada ficha los llene distinto?", "opts": {"A": "Opinión del equipo sobre la mejor marca, razones de su preferencia y calificación del servicio al cliente del proveedor.", "B": "Identificación, descripción, características con valor y unidad, cantidad, normas aplicables, garantía y verificación.", "C": "Precio del proveedor ganador, nombre del vendedor, descuento negociado, forma de pago acordada y fecha de entrega.", "D": "Cronograma de pagos, multas por incumplimiento, fecha de firma del contrato y nombre de quien supervisará su ejecución."}, "ok": "B", "porque": "El formato fija los elementos mínimos que describen un bien o servicio de manera comparable. Precio, preferencias y cláusulas pertenecen a otros documentos.", "falla": {"A": "Las preferencias subjetivas contaminan la ficha: describe lo que se necesita, no lo que gusta.", "C": "Esos datos surgen después de cotizar y adjudicar; una ficha con ellos deja de ser neutral.", "D": "Pagos, multas y supervisión son contenido del contrato, no de la ficha técnica."}}, {"n": 12, "rap": "593060", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una licencia perpetua cuesta $8.000.000 y exige soporte anual del 15 % del valor de la licencia durante 3 años. La alternativa por suscripción cuesta $270.000 al mes. Comparando el costo directo a 36 meses, ¿qué conviene y cuánto cuesta cada opción?", "opts": {"A": "Cuestan casi lo mismo: ambas opciones rondan los $9.720.000 al cabo de 36 meses de uso continuo.", "B": "La perpetua: $8.000.000 frente a $9.720.000 de la suscripción, porque el pago único suele ser más barato.", "C": "La suscripción: $9.720.000 frente a $11.600.000 de la perpetua ($8.000.000 más 3 × $1.200.000).", "D": "La perpetua: $9.200.000 frente a $9.720.000, porque el soporte se cobra una sola vez al comprar."}, "ok": "C", "porque": "Se compara el costo en el mismo horizonte: perpetua 8.000.000 + (3 × 15 % × 8.000.000 = 3.600.000) = 11.600.000; suscripción 36 × 270.000 = 9.720.000.", "falla": {"A": "Las dos cifras no coinciden: 11.600.000 contra 9.720.000. Declarar empate sin calcular es un error de método.", "B": "Ignora el soporte anual obligatorio: compara solo el precio inicial.", "D": "Cobra el soporte una sola vez ($1.200.000), cuando el enunciado lo exige cada año durante tres años."}}, {"n": 13, "rap": "593060", "nivel": "Intermedia", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "El equipo quiere proteger el nombre comercial y el logo de su aplicación, además del código. ¿Qué vía de protección corresponde a cada uno?", "opts": {"A": "El nombre y el logo, por derecho de autor, y el código, por registro de marca; ambos quedan protegidos de forma automática al crearlos.", "B": "Los tres, por patente de invención, que se otorga al crear el producto y no exige solicitud ni trámite alguno ante una entidad.", "C": "El código, por derecho de autor desde su creación; el nombre y el logo, como marca registrada ante la SIC.", "D": "El código, por registro de marca ante la SIC, y el nombre y el logo, por derecho de autor inscrito ante la Cámara de Comercio."}, "ok": "C", "porque": "El derecho de autor protege la expresión del código sin trámite (el registro ante la DNDA es declarativo). La propiedad industrial protege los signos distintivos: la marca se constituye con el registro ante la SIC. Un logo puede además ser obra gráfica, pero para exclusividad como marca se requiere registro. Cubre el saber «propiedad industrial» del programa.", "falla": {"A": "Está invertido: el código es obra protegida por derecho de autor; el nombre y el logo son signos distintivos que se protegen como marca.", "B": "La patente protege invenciones técnicas tras un examen y un trámite ante la SIC; no se obtiene automáticamente ni cubre el código fuente como tal.", "D": "La marca no protege el código, y la Cámara de Comercio no registra obras; el registro de obras es ante la Dirección Nacional de Derecho de Autor."}}, {"n": 14, "rap": "593060", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "La ficha técnica de 25 portátiles de una entidad dice «marca Alfa, modelo Z-15». Otro proveedor ofrece un equipo equivalente de distinta marca. ¿Qué ajuste corrige la ficha?", "opts": {"A": "Reemplazar marca y modelo por características mínimas medibles que cualquier fabricante pueda cumplir.", "B": "Listar tres o cuatro marcas aceptadas, con sus modelos equivalentes, en lugar de una sola, para que haya competencia.", "C": "Eliminar el modelo y dejar el valor máximo que la entidad está dispuesta a pagar por cada portátil.", "D": "Agregar «o equivalente» después de la marca y el modelo, y describir solo el uso general que tendrá el equipo."}, "ok": "A", "porque": "Una ficha con marca y modelo dirige la compra e impide que otros oferentes compitan. Las características medibles garantizan neutralidad y comparabilidad.", "falla": {"B": "Ampliar la lista de marcas no describe lo que el equipo debe cumplir: sigue orientando la compra por marca.", "C": "Un valor máximo es un tope de presupuesto, no una especificación; no dice qué debe hacer ni cumplir el equipo.", "D": "«O equivalente» sin características no dice qué es equivalente: la ficha sigue dependiendo de una marca."}}, {"n": 15, "rap": "593060", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Una empresa colombiana cede su base de datos de clientes a una empresa aliada con sede en otro país, que la usará para sus propias campañas comerciales. ¿Qué debe verificar el referente técnico?", "opts": {"A": "Que el país receptor ofrezca nivel adecuado de protección o que exista autorización expresa del titular u otra excepción legal.", "B": "Que la empresa aliada cifre los datos en tránsito, porque con eso desaparece la restricción de transferencia.", "C": "Que la empresa aliada sea de una marca reconocida, porque eso permite asumir que se cumple la ley colombiana.", "D": "Nada, porque la normatividad colombiana de datos personales no alcanza a servidores ubicados fuera del país."}, "ok": "A", "porque": "Aquí la empresa aliada decide para qué usa los datos: es una transferencia internacional (de un responsable a otro responsable). El art. 26 de la Ley 1581 de 2012 exige nivel adecuado de protección en el país receptor o una excepción válida, como la autorización expresa del titular. Es distinta de la transmisión (comunicar datos a un encargado que los trata por cuenta del responsable), que se rige por el contrato de transmisión del Decreto 1074 de 2015 (arts. 2.2.2.25.5.1 y 2.2.2.25.5.2) y se evalúa en la pregunta 10 del banco.", "falla": {"B": "El cifrado es una medida de seguridad necesaria, pero no sustituye el nivel adecuado de protección ni la autorización o excepción para transferir.", "C": "La marca no es un criterio legal; hay que revisar el nivel de protección y las condiciones contractuales.", "D": "La ley protege a los titulares de los datos y regula expresamente la salida de datos hacia otros países; el art. 26 existe justamente para ese caso."}}, {"n": 16, "rap": "593060", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "El servicio web cerrado de una empresa incluye en su servidor una librería AGPL v3 modificada. Nadie recibe copias del programa; los clientes lo usan por internet. ¿Qué implica la licencia?", "opts": {"A": "Que debe pagarse una licencia comercial al autor antes de poner el servicio en línea para los clientes.", "B": "Ninguna obligación, porque la licencia se activa cuando se entregan copias del programa en un instalador o disco físico.", "C": "Que obliga a ofrecer el código modificado a los usuarios que interactúan con el servicio a través de la red.", "D": "Que al modificar el código y retirar el aviso de derechos de autor, el resultado pasa a ser propiedad del equipo."}, "ok": "C", "porque": "La AGPL cierra el vacío del uso por red: ofrecer el programa como servicio cuenta como interacción que activa la obligación de compartir el código modificado.", "falla": {"A": "La licencia no obliga a pagar; obliga a compartir el código en sus condiciones. La licencia comercial es otra opción que ofrece el titular.", "B": "Esa es la lógica de la GPL clásica; la AGPL fue diseñada justamente para servicios en red.", "D": "Quitar avisos viola la licencia y la ley de derechos de autor; no convierte el código en propio."}}, {"n": 17, "rap": "593060", "nivel": "Avanzada", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Un aprendiz afirma que su software no está protegido porque aún no lo ha registrado. ¿Qué significa que el registro ante la Dirección Nacional de Derecho de Autor sea declarativo?", "opts": {"A": "Que el registro crea la titularidad: quien registra primero es el dueño, aunque otra persona haya creado la obra.", "B": "Que el software se protege por patente y no por derecho de autor, por lo que el registro es opcional.", "C": "Que sin registro cualquiera puede copiar y usar el software libremente, pues la obra no tiene protección legal.", "D": "Que la protección nace con la creación de la obra y el registro sirve de prueba de autoría, no de requisito."}, "ok": "D", "porque": "En derecho de autor la protección es automática desde la creación; el registro da publicidad y prueba, lo que ayuda en conflictos de titularidad y en contratos.", "falla": {"A": "El registro no crea derechos: el autor lo es desde que crea la obra, y la inscripción puede ser controvertida con pruebas.", "B": "El software se protege por derecho de autor y no se patenta como tal; el registro es voluntario y de otra naturaleza.", "C": "La protección existe desde la creación; sin registro es más difícil probar titularidad, pero la obra sigue protegida."}}, {"n": 18, "rap": "593060", "nivel": "Avanzada", "caso": false, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "¿Qué diferencia general existe entre contratar servicios de TI en una empresa privada y en una entidad estatal?", "opts": {"A": "En ambos sectores se aplica el mismo procedimiento de selección, porque la ley colombiana no distingue entre contratantes.", "B": "En lo privado no se necesita contrato escrito ni propuesta de ningún tipo; en lo estatal sí se exigen ambos documentos.", "C": "En lo privado rige sobre todo la autonomía de la voluntad; en lo estatal, un estatuto con procedimientos reglados.", "D": "En lo estatal el contratista elige libremente las condiciones del contrato, y en lo privado las fija la ley directamente."}, "ok": "C", "porque": "La contratación estatal tiene reglas de publicidad, pliegos, selección objetiva y modalidades; la privada se rige por el derecho civil y comercial y lo que las partes pacten.", "falla": {"A": "Hay regímenes distintos: el estatal está regulado por estatutos específicos y exige procedimientos que el privado no tiene.", "B": "La afirmación es falsa: aun en lo privado se recomienda contrato escrito para probar obligaciones.", "D": "Está invertido: en lo estatal la ley fija el procedimiento; en lo privado, las partes tienen mayor libertad."}}, {"n": 19, "rap": "593060", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Un cliente pide «una aplicación como la de la competencia». Antes de fijar tecnologías o marcas en las especificaciones, ¿cuál es el primer paso adecuado?", "opts": {"A": "Copiar las especificaciones públicas de la competencia y ajustarles el nombre de la empresa del cliente.", "B": "Diagnosticar la necesidad con el cliente: procesos, usuarios, restricciones, datos y normatividad aplicable.", "C": "Pedir un presupuesto al proveedor de nube más económico y definir el resto a partir de ese valor total.", "D": "Elegir el stack tecnológico que mejor conoce el equipo de desarrollo y cotizarlo de inmediato al cliente final."}, "ok": "B", "porque": "Las especificaciones deben responder a una necesidad real, no a una preferencia del equipo ni a un competidor. El diagnóstico alimenta el referente, la ficha y el dimensionamiento.", "falla": {"A": "Copiar a la competencia importa requisitos que no son del cliente y puede violar derechos de autor sobre documentos ajenos.", "C": "Partir de un presupuesto sin diagnóstico fija límites antes de saber el alcance.", "D": "Elegir por comodidad del equipo desconecta la solución de la necesidad del cliente."}}, {"n": 20, "rap": "593060", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593060 · 01 Definir especificaciones técnicas del software", "stem": "Un equipo planea usar en su oferta comercial un IDE con licencia «solo uso educativo, sin fines comerciales», que emplea en el SENA. ¿Qué decisión corresponde en el dimensionamiento de licencias?", "opts": {"A": "Mantenerlo, porque quienes lo usan siguen siendo aprendices del SENA y la licencia los cubre también en proyectos comerciales.", "B": "Mantenerlo y no mencionar su uso en la propuesta para evitar explicaciones innecesarias frente al cliente.", "C": "Usarlo durante las pruebas y borrarlo antes de la entrega, sin presupuestar un costo adicional.", "D": "Sustituirlo por una licencia comercial o alternativa libre, presupuestando el cambio, pues la educativa no basta."}, "ok": "D", "porque": "El uso comercial exige licencia comercial. Ignorarlo es un riesgo legal y económico que el dimensionamiento debe prever (costo de licencia o sustitución).", "falla": {"A": "La licencia educativa depende del uso (educativo), no de la condición de aprendiz; una oferta comercial queda fuera.", "B": "Ocultar el uso no elimina el incumplimiento y agrava el riesgo legal y reputacional.", "C": "Usarlo en el desarrollo ya es uso comercial; borrarlo al final no regulariza lo anterior."}}, {"n": 21, "rap": "593062", "nivel": "Básica", "caso": false, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Una licencia de herramienta de diseño se compra exclusivamente para un proyecto. Para el presupuesto de ese proyecto, ¿qué tipo de costo es?", "opts": {"A": "Variable, porque se compra una sola vez y no se repite mes tras mes durante el proyecto.", "B": "De oportunidad, porque el dinero podría haberse invertido en otro proyecto de la empresa.", "C": "Indirecto, porque lo paga la empresa que desarrolla y no el cliente que contrata el proyecto de software.", "D": "Directo, porque se asigna de forma exclusiva al proyecto y no existiría si este no se ejecuta."}, "ok": "D", "porque": "Un costo directo se identifica con un proyecto específico; un costo indirecto se comparte entre varios y se reparte con un criterio.", "falla": {"A": "Variable o fijo describe cómo cambia el costo con el volumen, no si se paga una vez.", "B": "El costo de oportunidad es un concepto de decisión económica y no una categoría del presupuesto del proyecto.", "C": "El indirecto se define por ser compartido entre proyectos, no por quién lo paga."}}, {"n": 22, "rap": "593062", "nivel": "Básica", "caso": false, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "¿Cuál es la secuencia general de fases de un proyecto de TI y en cuál se elabora la propuesta técnica?", "opts": {"A": "Ejecución, planeación, cierre e inicio; la propuesta técnica se elabora al cierre, con los resultados ya obtenidos del proyecto.", "B": "Inicio, planeación, ejecución, seguimiento y cierre; la propuesta técnica se elabora en la planeación, antes de comprometer recursos.", "C": "Planeación, cierre y ejecución; la propuesta técnica se redacta durante la ejecución, cuando el equipo ya conoce los problemas reales.", "D": "Inicio, ejecución y cierre, sin planeación formal; la propuesta técnica se entrega al cliente solo en el cierre del proyecto."}, "ok": "B", "porque": "Las fases generales (grupos de procesos de la dirección de proyectos) son inicio, planeación, ejecución, seguimiento y control, y cierre. La propuesta técnica pertenece a la planeación: define alcance, costos, cronograma y riesgos para que el cliente decida antes de ejecutar. Cubre el saber «Proyectos de TI: tipos, características, fases».", "falla": {"A": "El orden está alterado: no se ejecuta antes de planear, y una propuesta elaborada al cierre ya no sirve para decidir ni para comprometer recursos.", "C": "Falta el inicio y el orden es incorrecto; redactar la propuesta durante la ejecución significa construir sin haber acordado alcance, costo ni plazo.", "D": "Omite la planeación, que es donde se estiman costos, cronograma y riesgos; sin ella la propuesta no tiene sustento."}}, {"n": 23, "rap": "593062", "nivel": "Básica", "caso": false, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "¿Qué incluye el costo total de propiedad (TCO) de un servidor durante su vida útil?", "opts": {"A": "Únicamente el precio de compra y el costo del transporte hasta la sede del cliente.", "B": "Adquisición, licencias, soporte, mantenimiento, operación como la energía, y capacitación.", "C": "La utilidad que espera obtener el proveedor y los descuentos por pronto pago.", "D": "El precio de compra más el IVA que aparece facturado por el proveedor del servidor."}, "ok": "B", "porque": "El TCO suma todo lo que cuesta tener y operar un bien durante su vida útil, no solo lo que se paga al comprarlo.", "falla": {"A": "Compra y transporte son costos de adquisición; faltan licencias, soporte, energía, mantenimiento y capacitación.", "C": "La utilidad del proveedor no es un costo operativo del comprador; el TCO mira los costos del dueño del bien.", "D": "El IVA es un componente del precio, pero el TCO también incluye los costos posteriores."}}, {"n": 24, "rap": "593062", "nivel": "Básica", "caso": false, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "¿Para qué sirve la reserva de contingencia en el presupuesto de una propuesta?", "opts": {"A": "Para aumentar la utilidad del proveedor sin necesidad de explicar de dónde sale ese valor adicional.", "B": "Para pagar las funcionalidades nuevas que el cliente solicite una vez firmado el contrato de servicios.", "C": "Para cubrir riesgos e imprevistos identificados dentro del alcance acordado, sin renegociar el valor.", "D": "Para ofrecer un descuento al cliente en la negociación final sin reducir la utilidad del proveedor."}, "ok": "C", "porque": "La contingencia es una cantidad calculada con base en los riesgos del proyecto; protege el presupuesto frente a imprevistos del mismo alcance.", "falla": {"A": "Una reserva sin sustento es un sobreprecio oculto; debe justificarse con riesgos identificados.", "B": "Las funcionalidades nuevas son cambios de alcance y se cotizan aparte mediante control de cambios.", "D": "Usar la reserva como descuento deja el proyecto sin protección frente a los riesgos que sí se identificaron."}}, {"n": 25, "rap": "593062", "nivel": "Básica", "caso": false, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "¿Qué son los términos de referencia en un proceso de contratación de un servicio de TI?", "opts": {"A": "El informe con los resultados de las pruebas de aceptación que se hacen al software ya entregado al cliente.", "B": "La propuesta que presenta cada proponente describiendo su solución técnica, sus condiciones y su precio total.", "C": "El contrato definitivo que firman las dos partes una vez adjudicado el servicio, con su valor y sus plazos de entrega.", "D": "El documento del contratante que describe objeto, requisitos, condiciones y criterios de evaluación de ofertas."}, "ok": "D", "porque": "Los términos de referencia los emite el contratante para que los proponentes presenten ofertas comparables; la propuesta es la respuesta del proponente.", "falla": {"A": "Las pruebas de aceptación ocurren al entregar el software, no antes de contratar.", "B": "La propuesta es la respuesta del proponente; los términos son lo que pide el contratante.", "C": "El contrato es posterior: se firma cuando ya hay una oferta adjudicada."}}, {"n": 26, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Presupuesto de un proyecto: 4 desarrolladores × 120 horas × $35.000 por hora; licencias por $3.200.000; hosting de 12 meses a $450.000 mensuales; contingencia del 8 % sobre el subtotal (sin IVA). ¿Cuál es el valor total?", "opts": {"A": "$27.432.000", "B": "$21.600.000", "C": "$25.400.000", "D": "$26.744.000"}, "ok": "A", "porque": "Talento 16.800.000 + licencias 3.200.000 + hosting 5.400.000 = 25.400.000 de subtotal; la contingencia del 8 % es 2.032.000; total 27.432.000.", "falla": {"B": "Omite el hosting y aplica la contingencia a un subtotal incompleto.", "C": "Omite la contingencia: es el subtotal sin reserva para riesgos.", "D": "Aplica el 8 % solo al talento ($1.344.000), no al subtotal completo."}}, {"n": 27, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Una matriz pondera costo 30 %, cumplimiento técnico 40 %, soporte 20 % y plazo 10 %. Puntajes de 0 a 100. Proveedor Delta: 90, 70, 60, 80. Proveedor Sigma: 70, 90, 80, 60. Proveedor Omega: 100, 60, 50, 100. ¿Cuál es la mejor opción?", "opts": {"A": "Omega, porque lidera en costo y en plazo, que son los criterios más fáciles de medir.", "B": "Sigma, con 79 puntos ponderados; Delta obtiene 75 y Omega obtiene 74.", "C": "Delta, con 75 puntos, porque ningún criterio le queda por debajo de 60 puntos.", "D": "Omega, con 77,5 puntos, al promediar los cuatro criterios sin aplicar sus pesos."}, "ok": "B", "porque": "Ponderado: Delta = 27+28+12+8 = 75; Sigma = 21+36+16+6 = 79; Omega = 30+24+10+10 = 74. Los pesos reflejan la importancia que el cliente dio a cada criterio.", "falla": {"A": "Elegir por los criterios «fáciles» contradice los pesos acordados con el cliente.", "C": "Que ningún criterio quede bajo 60 no es una regla de la matriz; el puntaje total de Delta sigue siendo menor que el de Sigma.", "D": "Promediar sin pesos ignora que el cumplimiento técnico vale 40 % y el plazo solo 10 %."}}, {"n": 28, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Tres cotizaciones de servidores: la primera incluye garantía de 3 años en sitio e instalación; la segunda, garantía de 1 año en taller; la tercera no incluye instalación. ¿Qué debe hacer el equipo antes de comparar precios?", "opts": {"A": "Llevar las ofertas a la misma especificación de la ficha (garantía, instalación) para que sean comparables.", "B": "Promediar los tres precios y presentar ese promedio como el valor de mercado del servidor requerido.", "C": "Elegir la de menor precio de lista, porque las diferencias de garantía son detalles secundarios del servicio.", "D": "Descartar las dos cotizaciones incompletas sin consultar a los proveedores y quedarse con la primera."}, "ok": "A", "porque": "Comparar ofertas con alcances distintos lleva a decidir por precio engañoso. Se normaliza contra la ficha técnica para comparar manzanas con manzanas.", "falla": {"B": "El promedio no corresponde a ninguna oferta real y oculta las diferencias de alcance.", "C": "Las diferencias de garantía e instalación cambian el costo real y el riesgo; no son un detalle.", "D": "Descartar sin consultar pierde opciones que podrían cumplir al completarse con un ajuste o una aclaración."}}, {"n": 29, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "El cliente reclama que el «módulo de reportes» debía exportar a Excel, pero la propuesta solo decía «módulo de reportes». ¿Qué sección de la propuesta habría evitado el conflicto?", "opts": {"A": "El resumen ejecutivo, que describe la solución en pocas líneas para la gerencia del cliente.", "B": "El glosario, con la definición de cada término técnico utilizado a lo largo del documento.", "C": "El cronograma, con las fechas en que se entregará cada uno de los módulos del sistema al cliente.", "D": "El alcance, con lo que incluye y no incluye, junto con los supuestos y las exclusiones."}, "ok": "D", "porque": "Un alcance sin límites explícitos permite interpretaciones; incluir inclusiones, exclusiones y supuestos reduce las reclamaciones por funcionalidades no pactadas.", "falla": {"A": "El resumen ejecutivo sintetiza la propuesta, pero no delimita el alcance con inclusiones y exclusiones.", "B": "El glosario ayuda a entender términos, pero no dice si se incluye o no la exportación.", "C": "El cronograma dice cuándo, no qué; la discusión es sobre contenido."}}, {"n": 30, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "El diagrama de despliegue de una propuesta muestra balanceador de carga, dos instancias de aplicación y base de datos replicada, pero el presupuesto lista una sola máquina virtual. ¿Cuál es el problema?", "opts": {"A": "No hay problema, porque una sola máquina virtual puede simular balanceador, réplicas y alta disponibilidad con ajustes menores de configuración.", "B": "Falta incluir un cronograma de pruebas de carga, porque la arquitectura propuesta tiene un efecto menor en el costo de la operación posterior.", "C": "Es un problema de licencias del sistema operativo, ya que el resto de los componentes del diagrama suele ser gratuito.", "D": "Hay inconsistencia: cada componente de la arquitectura debe tener su costo en el presupuesto o quedar excluido con justificación."}, "ok": "D", "porque": "La arquitectura y el presupuesto deben coincidir: lo que se promete técnicamente se debe costear, o el equipo termina financiando el faltante.", "falla": {"A": "Una sola máquina no ofrece alta disponibilidad ni replicación real; el diagrama y el costo quedan desalineados.", "B": "La arquitectura determina los recursos, y los recursos determinan el costo.", "C": "Balanceador y réplicas también implican costos de infraestructura, no solo de sistema operativo."}}, {"n": 31, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Un equipo estima un módulo con tres valores: optimista 20 horas, más probable 32 horas y pesimista 56 horas. ¿Cuál es la estimación por tres puntos (PERT) con la fórmula (O + 4M + P) / 6?", "opts": {"A": "34 horas", "B": "56 horas", "C": "32 horas", "D": "36 horas"}, "ok": "A", "porque": "(20 + 4 × 32 + 56) / 6 = 204 / 6 = 34 horas; pondera el valor más probable y recoge la incertidumbre.", "falla": {"B": "Toma el pesimista por prudencia: se sobredimensiona y se pierde competitividad en la oferta.", "C": "Usa solo el valor más probable e ignora la incertidumbre que el equipo declaró.", "D": "Es el promedio simple de los tres valores; PERT da mayor peso al más probable."}}, {"n": 32, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Un equipo debe estimar el esfuerzo de un sistema del que ya conoce las entradas, salidas, consultas y archivos lógicos, pero aún no ha elegido el lenguaje de programación. ¿Qué método de estimación se ajusta mejor?", "opts": {"A": "Puntos de función, que miden el tamaño funcional por entradas, salidas, consultas y archivos, sin depender del lenguaje.", "B": "Líneas de código estimadas por programador, porque el tamaño depende del lenguaje elegido y se puede conocer de antemano.", "C": "Estimación por analogía con el último proyecto, aunque tenga un tamaño funcional distinto, porque el equipo ya lo conoce bien.", "D": "Dividir el presupuesto disponible del cliente entre la tarifa por hora, porque el esfuerzo debe ajustarse al dinero disponible."}, "ok": "A", "porque": "El método de puntos de función estima el tamaño a partir de funciones visibles para el usuario (entradas, salidas, consultas, archivos lógicos e interfaces), y de ahí se obtiene esfuerzo con la productividad del equipo. Otros métodos admitidos en la rúbrica: analogía, tres puntos (PERT) y horas por módulo.", "falla": {"B": "Las líneas de código dependen del lenguaje, que aún no se ha elegido; no se pueden conocer de antemano con precisión.", "C": "La analogía solo sirve si los proyectos son comparables en tamaño; aquí se dispone de datos funcionales que permiten un método más fundamentado.", "D": "Eso no estima el esfuerzo: parte del dinero y no del tamaño del trabajo; oculta la diferencia entre lo que se pide y lo que cuesta."}}, {"n": 33, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Una entidad publica términos de referencia con 25 requisitos técnicos. ¿Cómo debe documentar el proponente que su propuesta responde a ellos?", "opts": {"A": "Con un resumen ejecutivo general que afirme con claridad que la propuesta cumple lo solicitado por la entidad.", "B": "Con una carta firmada que declare que se aceptan las condiciones y que se cumplen en conjunto.", "C": "Con una matriz de cumplimiento: cada requisito marcado cumple, parcial o no cumple, y la sección que lo evidencia.", "D": "Con una copia del catálogo comercial del fabricante, con una relación general con los requisitos."}, "ok": "C", "porque": "La matriz permite al evaluador y al propio equipo verificar el cumplimiento punto por punto y detectar vacíos antes de presentar la oferta.", "falla": {"A": "Una afirmación global no evidencia nada: el evaluador no puede verificar cada requisito.", "B": "Aceptar las condiciones no prueba que la solución cumpla los requisitos técnicos.", "D": "Un catálogo no contesta requisito por requisito y no es verificable contra los términos."}}, {"n": 34, "rap": "593062", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "La empresa quiere un margen del 20 % sobre el precio de venta, y el costo total del proyecto es de $12.000.000. ¿Cuál debe ser el precio de venta?", "opts": {"A": "$10.000.000", "B": "$9.600.000", "C": "$15.000.000", "D": "$14.400.000"}, "ok": "C", "porque": "Si el margen es 20 % del precio, el costo es el 80 % del precio: 12.000.000 / 0,8 = 15.000.000.", "falla": {"A": "Divide entre 1,2 y obtiene un precio menor que el costo: el proyecto se vende con pérdida.", "B": "Resta el 20 % al costo: el precio quedaría por debajo del costo.", "D": "Aplica 20 % sobre el costo (recargo), no sobre el precio: el margen real sería 16,7 %."}}, {"n": 35, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Para dos servidores, la compra cuesta $18.000.000 cada uno, con soporte de $1.800.000 anuales por servidor y energía y administración de $300.000 mensuales en total. La nube cuesta $1.100.000 mensuales por instancia equivalente. Comparando el TCO a 36 meses, ¿qué análisis es correcto?", "opts": {"A": "Nube $79.200.000 frente a compra $57.600.000: la nube resulta más barata, porque evita la inversión inicial.", "B": "Compra $57.600.000 frente a nube $79.200.000: la compra cuesta menos, aunque deben ponderarse elasticidad y obsolescencia.", "C": "Compra $36.000.000 frente a nube $79.200.000: la compra cuesta menos de la mitad, porque lo demás son gastos menores.", "D": "Compra $46.800.000 frente a nube $79.200.000: se suma el soporte, y la energía se absorbe sin costo en la sede."}, "ok": "B", "porque": "Compra: 36.000.000 + soporte (1.800.000 × 2 × 3 = 10.800.000) + energía y administración (300.000 × 36 = 10.800.000) = 57.600.000. Nube: 1.100.000 × 2 × 36 = 79.200.000.", "falla": {"A": "Contradice sus propias cifras: 79.200.000 es mayor que 57.600.000. Evitar la inversión inicial no hace menor el costo total.", "C": "Compara solo el precio de compra: omite soporte, energía y administración, que hacen parte del TCO.", "D": "Suma el soporte pero omite energía y administración, que sí son costos de operación (10.800.000)."}}, {"n": 36, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Riesgo 1: cambio en la API de la pasarela de pagos, probabilidad 30 %, impacto de $12.000.000. Riesgo 2: salida de un desarrollador clave, probabilidad 10 %, impacto de $20.000.000. ¿Qué reserva de contingencia sustentada en el valor esperado corresponde a los dos riesgos?", "opts": {"A": "$16.000.000", "B": "$32.000.000", "C": "$5.600.000", "D": "$3.600.000"}, "ok": "C", "porque": "Valor esperado = probabilidad × impacto: 0,30 × 12.000.000 = 3.600.000 y 0,10 × 20.000.000 = 2.000.000; suma 5.600.000.", "falla": {"A": "Promedia los impactos y no pondera por probabilidad.", "B": "Suma los impactos al 100 %, como si ambos riesgos fueran a ocurrir con certeza.", "D": "Reserva solo el riesgo mayor y deja sin cubrir el otro."}}, {"n": 37, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Tareas: T1 dura 3 días; T2 (5 días) y T3 (8 días) dependen de T1; T4 (4 días) depende de T2 y de T3; T5 (2 días) depende de T4. ¿Cuál es la duración mínima del proyecto y qué holgura tiene la tarea T2?", "opts": {"A": "22 días, sumando la duración de todas las tareas sin considerar el paralelismo.", "B": "14 días, siguiendo la ruta T1, T2, T4 y T5, que es la que el equipo conoce mejor.", "C": "17 días, y T2 no tiene holgura porque toda tarea del diagrama está en la ruta crítica.", "D": "17 días, y T2 tiene 3 días de holgura porque la ruta crítica pasa por T1, T3, T4 y T5."}, "ok": "D", "porque": "Ruta T1-T3-T4-T5 = 3+8+4+2 = 17 días; T1-T2-T4-T5 = 14 días. T2 puede retrasarse 3 días sin afectar la entrega. La ruta crítica es la más larga.", "falla": {"A": "Sumar todo supone que T2 y T3 se hacen en secuencia, cuando son paralelas.", "B": "La ruta T1-T2-T4-T5 es más corta; el proyecto no puede terminar antes de que acabe T3.", "C": "No todas las tareas son críticas: T2 tiene holgura de 3 días."}}, {"n": 38, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Un proveedor cotiza una licencia anual en USD 1.200 para 25 usuarios (valor total). La propuesta se presenta en pesos, con TRM de referencia de $4.000 e IVA del 19 %. ¿Cuál es el costo que debe figurar?", "opts": {"A": "$4.800.000", "B": "$4.034.000", "C": "$120.000.000", "D": "$5.712.000"}, "ok": "D", "porque": "1.200 × 4.000 = 4.800.000; IVA 19 % = 912.000; total 5.712.000. El enunciado ya da el valor para 25 usuarios.", "falla": {"A": "Convierte bien, pero omite el IVA.", "B": "Descuenta el IVA del valor convertido en lugar de sumarlo.", "C": "Vuelve a multiplicar por 25 usuarios un valor que ya incluía a los 25."}}, {"n": 39, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "Un proponente cumple todos los requisitos técnicos, pero no presentó el certificado de experiencia exigido como requisito habilitante y no lo subsanó en el plazo fijado por los términos. ¿Qué ocurre con su oferta?", "opts": {"A": "No queda habilitado, porque el requisito habilitante es condición de participación y no suma puntaje.", "B": "Sigue en el proceso y el certificado se sustituye por una explicación verbal en la audiencia de aclaraciones.", "C": "Gana puntos extra por su solución técnica, y estos compensan el certificado que le falta presentar.", "D": "Puede presentarlo después de la adjudicación, porque lo habilitante se verifica al firmar el contrato."}, "ok": "A", "porque": "Habilitar y evaluar son pasos distintos: primero se verifica que se cumplan las condiciones mínimas; solo entonces se puntúan los criterios ponderables.", "falla": {"B": "Una explicación verbal no reemplaza un requisito documental; aceptarla rompe la igualdad entre proponentes.", "C": "El puntaje no compensa un requisito habilitante: son filtros, no puntos.", "D": "Los requisitos habilitantes se verifican antes de evaluar y adjudicar, dentro del plazo que fijan los términos."}}, {"n": 40, "rap": "593062", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593062 · 02 Elaborar la propuesta técnica del software", "stem": "El cliente exige precio fijo cerrado para un módulo de analítica cuyos requisitos aún no conoce. ¿Qué enfoque de oferta protege a ambas partes?", "opts": {"A": "Ofrecer un precio fijo bajo para ganar el negocio y cobrar después lo que falte como adicionales sin reglas claras.", "B": "Proponer una fase breve de descubrimiento a precio fijo, y luego precio cerrado o tiempo y materiales con tope.", "C": "Estimar con el escenario más favorable y mencionar pocos riesgos, para que el cliente tenga menos dudas sobre la oferta.", "D": "Rechazar la oferta, porque sin requisitos completos no es posible cotizar con seriedad el trabajo del módulo."}, "ok": "B", "porque": "Cuando el alcance es incierto se reduce primero la incertidumbre: el descubrimiento fija requisitos, y luego se cotiza con base más sólida y con topes y control de cambios.", "falla": {"A": "Un precio bajo sin reglas de cambio genera conflictos y pérdidas cuando el alcance real aparezca.", "C": "Ocultar riesgos aumenta la probabilidad de sobrecostos y rompe la confianza cuando se materialicen.", "D": "Existen enfoques por fases para cotizar con incertidumbre; rechazar sin proponer alternativas pierde el negocio."}}, {"n": 41, "rap": "593061", "nivel": "Básica", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "¿Qué es un acuerdo de niveles de servicio (ANS o SLA)?", "opts": {"A": "Una cláusula que fija el precio del contrato, el calendario de pagos y las condiciones de facturación acordadas con el cliente.", "B": "Un compromiso escrito que fija métricas medibles del servicio, como disponibilidad y tiempos, y consecuencias de incumplirlas.", "C": "Un documento interno del equipo que reparte las tareas de soporte entre sus integrantes por turnos y horarios de trabajo.", "D": "Una lista detallada de las funcionalidades que el cliente espera ver en la primera versión del software entregado."}, "ok": "B", "porque": "El ANS convierte el servicio en compromisos medibles (por ejemplo, disponibilidad y tiempo de respuesta) con compensaciones si no se cumplen.", "falla": {"A": "El precio y los pagos son condiciones económicas del contrato, no niveles de servicio.", "C": "Los turnos son organización interna; el ANS es un compromiso con el cliente.", "D": "Las funcionalidades esperadas se recogen en los requisitos o el alcance, no en el ANS."}}, {"n": 42, "rap": "593061", "nivel": "Básica", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "En la negociación por principios, la posición es lo que una parte dice que quiere. ¿Qué es el interés?", "opts": {"A": "El argumento más contundente que la parte usa para presionar a la otra.", "B": "El precio máximo que la parte está dispuesta a pagar o a aceptar en el acuerdo.", "C": "La necesidad o razón de fondo que explica por qué la parte pide lo que pide.", "D": "La alternativa que la parte tiene disponible si no se llega a ningún acuerdo."}, "ok": "C", "porque": "Detrás de una posición hay un interés; negociar por intereses abre más opciones de beneficio mutuo que defender posiciones.", "falla": {"A": "Presionar es una táctica, no un interés; no explica la necesidad real.", "B": "El precio máximo es un límite o una posición numérica, no la razón de fondo.", "D": "La alternativa sin acuerdo es el MAAN o BATNA, un concepto distinto."}}, {"n": 43, "rap": "593061", "nivel": "Básica", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "¿Qué es el contrato en una relación de servicios de software?", "opts": {"A": "Una presentación comercial que resume las ventajas del producto para convencer al cliente de comprarlo.", "B": "El acuerdo que formaliza las obligaciones de las partes: objeto, valor, plazos, entregables y garantías.", "C": "El registro técnico de las decisiones de arquitectura que se tomaron durante el desarrollo del software.", "D": "Un informe de avance que el equipo envía al cliente cada semana durante la ejecución del proyecto."}, "ok": "B", "porque": "La propuesta aceptada se convierte en contrato: de ahí la importancia de que traiga la información necesaria para redactarlo.", "falla": {"A": "La presentación comercial persuade; no crea obligaciones exigibles.", "C": "Las decisiones de arquitectura se documentan técnicamente, no se formalizan como contrato.", "D": "Un informe de avance reporta, pero no establece obligaciones entre las partes."}}, {"n": 44, "rap": "593061", "nivel": "Básica", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "¿Qué técnica de comunicación consiste en repetir con sus palabras lo que dijo el cliente para confirmar que se entendió?", "opts": {"A": "Interrumpir para completar la idea del cliente y así ahorrar tiempo en la reunión.", "B": "Contraargumentar de inmediato para demostrar que el cliente está equivocado en su apreciación.", "C": "Parafrasear, una técnica de escucha activa que reduce los malentendidos.", "D": "Resumir lo que uno quiere responder, sin tomar en cuenta lo que el cliente acaba de decir."}, "ok": "C", "porque": "Parafrasear confirma la comprensión y muestra respeto; es base de la comunicación asertiva en una negociación.", "falla": {"A": "Interrumpir impide escuchar y suele generar suposiciones erróneas.", "B": "Contraargumentar es debatir, no confirmar comprensión; endurece la discusión.", "D": "Ese resumen ignora al interlocutor y no verifica lo que él dijo."}}, {"n": 45, "rap": "593061", "nivel": "Básica", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "¿Cuál estilo de negociación busca una solución que satisfaga plenamente los intereses de ambas partes?", "opts": {"A": "El colaborativo, que explora opciones y trabaja con criterios objetivos para ganar ambas partes.", "B": "El competitivo, que procura imponer la posición propia aun a costa de la relación con el cliente.", "C": "El acomodaticio, que cede ante lo que pide la otra parte para evitar el conflicto.", "D": "El evasivo, que aplaza o esquiva la discusión con la esperanza de que el tema se resuelva solo."}, "ok": "A", "porque": "El estilo colaborativo busca beneficio mutuo; los otros estilos sacrifican los intereses de una de las partes o dejan el conflicto sin resolver.", "falla": {"B": "El competitivo gana una parte a expensas de la otra.", "C": "El acomodaticio sacrifica los intereses propios.", "D": "El evasivo no resuelve: pospone el conflicto."}}, {"n": 46, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El cliente exige disponibilidad mensual de 99,9 % y la propuesta ofrece 99,5 %. En un mes de 30 días, ¿cuánta caída tolera cada porcentaje?", "opts": {"A": "99,5 %: 7,2 horas; 99,9 %: 43,2 minutos.", "B": "99,5 %: 1,8 horas; 99,9 %: 21,6 minutos.", "C": "99,5 %: 36 minutos; 99,9 %: 4,3 minutos.", "D": "99,5 %: 3,6 horas; 99,9 %: 43,2 minutos."}, "ok": "D", "porque": "Un mes de 30 días tiene 43.200 minutos. 0,5 % = 216 minutos (3,6 h); 0,1 % = 43,2 minutos.", "falla": {"A": "Usa el valor de 99 % (7,2 horas) para el 99,5 %.", "B": "Corresponde a 99,75 % y 99,95 %, que son la mitad de los valores pedidos.", "C": "Divide entre diez ambos resultados: confunde el 0,5 % con el 0,05 %."}}, {"n": 47, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "En la validación, el cliente dice que la competencia cobra la mitad. ¿Cuál respuesta aplica criterios objetivos y busca beneficio mutuo?", "opts": {"A": "Pedir detalles de esa oferta y comparar alcance, garantías y TCO con criterios objetivos, ofreciendo opciones por fases.", "B": "Bajar el precio cerca de la mitad de inmediato para no perder el negocio, antes de revisar el alcance de esa oferta rival.", "C": "Afirmar que la competencia no puede sostener ese precio y que cobrar menos obliga a sacrificar la calidad del servicio.", "D": "Pedir que se firme hoy el contrato al precio original para evitar nuevas comparaciones con otros proveedores del mercado."}, "ok": "A", "porque": "Se negocia con criterios comparables, no con descuentos reactivos. Comparar alcance y TCO muestra si las ofertas son equivalentes y qué opciones existen.", "falla": {"B": "Ceder sin revisar alcance compromete la rentabilidad y la calidad.", "C": "Atacar a la competencia sin pruebas daña la credibilidad y no resuelve el interés del cliente.", "D": "Presionar para firmar sin responder la objeción rompe la negociación y la confianza."}}, {"n": 48, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Antes de negociar, el equipo calcula que, si no hay acuerdo, tiene otro trabajo que le deja $9.000.000 de utilidad. ¿Cómo debe usar esa información?", "opts": {"A": "Ocultándola y fijando el precio mínimo en cero para no perder al cliente bajo ninguna circunstancia posible.", "B": "Usándola como referencia de su precio mínimo: no aceptar un acuerdo que deje menos que su mejor alternativa.", "C": "Mostrándosela al cliente para presionarlo a decidir ya, porque otro equipo lo contratará de inmediato si se niega.", "D": "Descartándola, porque pensar en alternativas debilita la disposición del equipo para llegar a un acuerdo con el cliente."}, "ok": "B", "porque": "El MAAN (BATNA) fija el límite racional de la negociación: cualquier acuerdo mejor que la alternativa conviene; uno peor, no.", "falla": {"A": "Un mínimo en cero lleva a aceptar acuerdos peores que no negociar.", "C": "Revelar la alternativa como presión es una táctica competitiva que puede dañar la relación y no es el uso del MAAN.", "D": "Ignorar las alternativas deja a la parte sin referencia para decidir cuándo retirarse."}}, {"n": 49, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "En la reunión de validación el cliente dice: «quiero que el sistema sea más rápido y más bonito». ¿Cómo debe documentarse esa sugerencia?", "opts": {"A": "Prometiendo que se mejorará todo en la versión final, sin acordar de qué forma se medirá ese avance ni quién lo aprobará.", "B": "Convirtiéndola en un requisito verificable, con valor medible, prioridad, responsable y efecto en costo y plazo.", "C": "Descartándola, porque las sugerencias de apariencia y velocidad no afectan los parámetros técnicos de la propuesta.", "D": "Copiando la frase tal cual en el acta de la reunión, porque lo importante es registrar fielmente lo que dijo el cliente."}, "ok": "B", "porque": "Documentar es traducir la necesidad del negocio a algo comprobable y vinculado a costo y plazo; así se puede aceptar, negociar o rechazar con fundamento.", "falla": {"A": "Una promesa sin métrica no puede verificarse y deja un compromiso abierto.", "C": "La sugerencia puede traducirse en rendimiento y usabilidad, con impacto en arquitectura y costo.", "D": "Una frase ambigua en el acta genera discusiones al entregar: nadie sabe qué significa «más rápido»."}}, {"n": 50, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Una propuesta trae alcance, arquitectura, valor total y cronograma. ¿Qué falta para que pueda servir de base al contrato?", "opts": {"A": "La lista detallada de herramientas de desarrollo y los nombres de los repositorios que usa el equipo de trabajo.", "B": "Un resumen de las tendencias del mercado de software en el país durante los últimos años de mayor crecimiento.", "C": "Más diagramas UML, el manual de usuario completo y el código fuente del prototipo desarrollado por el equipo.", "D": "Forma e hitos de pago, criterios de aceptación de entregables, garantías, y propiedad intelectual y confidencialidad."}, "ok": "D", "porque": "El contrato necesita partes, objeto, alcance, valor, forma de pago, plazos, entregables, criterios de aceptación, garantías, propiedad intelectual y confidencialidad.", "falla": {"A": "Las herramientas internas no fijan derechos y obligaciones frente al cliente.", "B": "El contexto de mercado puede ayudar a justificar, pero no es contenido contractual.", "C": "Los diagramas, el manual y el prototipo son técnicos y no definen obligaciones ni pagos."}}, {"n": 51, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El cliente exige 99,9 % de disponibilidad. La oferta usaba un hosting de $450.000 mensuales y el de alta disponibilidad cuesta 35 % más. ¿Qué debe hacer el equipo con este ajuste?", "opts": {"A": "Subir el valor del hosting en el presupuesto y dejar el resto de la propuesta sin modificación.", "B": "Aceptar el 99,9 % durante la reunión y calcular los costos reales solo después de firmar el contrato.", "C": "Actualizar ficha, presupuesto (+$1.890.000 al año), ANS y control de cambios, y obtener la aceptación del cliente.", "D": "Absorber el costo adicional para no reabrir la negociación ni modificar el presupuesto que el cliente ya aprobó en la reunión."}, "ok": "C", "porque": "Un cambio de parámetro técnico se propaga: 450.000 × 1,35 = 607.500; la diferencia mensual de 157.500 × 12 = 1.890.000 por año debe quedar en presupuesto, ANS, ficha y control de cambios.", "falla": {"A": "Cambia un número, pero deja inconsistentes la ficha, el ANS y el control de cambios.", "B": "Comprometerse sin costear expone al equipo a perder dinero al ejecutar el contrato.", "D": "Absorber el costo sin registrarlo erosiona la rentabilidad y oculta el ajuste al cliente."}}, {"n": 52, "rap": "593061", "nivel": "Intermedia", "caso": false, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "¿Cuándo es más conveniente un contrato por tiempo y materiales que uno de precio fijo?", "opts": {"A": "Cuando el proveedor prefiere que todo el riesgo recaiga sobre el cliente sin darle visibilidad del trabajo.", "B": "Cuando el alcance es incierto o cambiante y el cliente acepta controlar horas y presupuesto con topes y revisiones.", "C": "Cuando los requisitos están completos y estables y el cliente quiere conocer el valor total desde el inicio.", "D": "Cuando el cliente no quiere recibir informes de avance ni tener que controlar el consumo de horas del equipo."}, "ok": "B", "porque": "El precio fijo supone alcance estable; con alcance cambiante, tiempo y materiales transparenta el esfuerzo y distribuye el riesgo con topes y revisiones.", "falla": {"A": "Ocultar el trabajo y trasladar todo el riesgo no es una condición justa ni sostenible de ningún contrato.", "C": "Ese escenario favorece precio fijo, que da certeza del valor total.", "D": "Tiempo y materiales exige seguimiento de horas; sin informes no hay control."}}, {"n": 53, "rap": "593061", "nivel": "Intermedia", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Una empresa pide a un equipo un sistema hecho a la medida y, además, el uso de un programa que el equipo ya tenía desarrollado. ¿Qué tipos de contrato se combinan?", "opts": {"A": "Un solo contrato de compraventa, porque el sistema y el programa existente se entregan juntos y se pagan con una misma factura.", "B": "Un contrato de mandato, porque el equipo actúa en nombre de la empresa ante terceros mientras programa el sistema y el programa.", "C": "Un contrato de desarrollo para el sistema a la medida y una licencia de uso para el programa preexistente.", "D": "Un contrato de sociedad, porque ambas partes aportan trabajo y recursos y comparten las utilidades que genere el sistema."}, "ok": "C", "porque": "El desarrollo a la medida es un contrato de servicios con entregables, precio y cláusula de titularidad o cesión; el programa preexistente se licencia (alcance de uso, plazo, soporte) sin ceder su titularidad. Identificar partes, objeto y tipo es el insumo de la lista de verificación del contrato. Cubre el saber «Contrato: concepto, tipos, partes».", "falla": {"A": "La compraventa transfiere la propiedad de un bien; aquí hay un servicio de desarrollo y un derecho de uso, con régimen de propiedad intelectual distinto.", "B": "El mandato supone actuar por cuenta de otro en actos jurídicos con terceros; programar no es representar a la empresa.", "D": "La sociedad exige un fin común de repartir utilidades; aquí una parte presta un servicio y la otra paga por él y por el derecho de uso."}}, {"n": 54, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El cliente exige un descuento del 25 % y amenaza con retirarse. El equipo, para evitar el conflicto, concede todo lo que pide sin proponer nada a cambio. ¿Qué estilo muestra y cuál es el riesgo?", "opts": {"A": "Evasivo: esquiva la discusión, con el riesgo de que el conflicto quede sin resolver y reaparezca luego.", "B": "Competitivo: impone su posición, con el riesgo de romper la relación con el cliente a largo plazo.", "C": "Colaborativo: busca beneficios mutuos, con el riesgo de alargar demasiado la reunión de negociación.", "D": "Acomodaticio: conserva la relación a costa de sus intereses y compromete la rentabilidad y el alcance."}, "ok": "D", "porque": "Ceder todo es acomodarse: se gana la relación a corto plazo y se pierde margen y claridad sobre el alcance.", "falla": {"A": "El equipo no esquiva el tema: lo atiende cediendo.", "B": "Un equipo que cede sin pedir nada no impone su posición.", "C": "El estilo colaborativo propone intercambios, no concesiones unilaterales."}}, {"n": 55, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "Una empresa contrata al equipo para alojar y procesar la base de datos de sus clientes, siguiendo sus instrucciones. ¿Qué rol tiene el equipo y qué debe fijar el contrato?", "opts": {"A": "Encargado del tratamiento: el contrato debe fijar seguridad, confidencialidad y devolución o supresión de los datos.", "B": "Titular de los datos, porque los almacena en su propia infraestructura tecnológica y los administra a diario.", "C": "Responsable del tratamiento, porque aloja la base de datos y decide libremente con qué fin se usarán en adelante.", "D": "Un tercero sin obligaciones propias, porque los datos pertenecen a la empresa que lo contrató para ese fin específico."}, "ok": "A", "porque": "En la Ley 1581 de 2012, el responsable decide sobre el tratamiento y el encargado lo realiza por cuenta de aquel; el contrato debe reflejar obligaciones de seguridad y confidencialidad.", "falla": {"B": "El titular es la persona natural dueña de los datos, no quien los aloja.", "C": "Decidir libremente para qué usar los datos es característica del responsable, no del encargado que sigue instrucciones.", "D": "Quien trata datos tiene obligaciones, aunque no sea su propietario."}}, {"n": 56, "rap": "593061", "nivel": "Avanzada", "caso": true, "seccion": "RAP 593061 · 03 Validar las condiciones de la propuesta técnica", "stem": "El cliente pide el código fuente y la titularidad total, pero la solución usa un framework interno que el equipo ya reutiliza en otros contratos. ¿Qué cláusula resuelve el conflicto?", "opts": {"A": "La cesión de la titularidad del desarrollo a la medida y la licencia de los componentes preexistentes, pactadas por escrito.", "B": "La negativa a entregar el código fuente al cliente, con el fin de proteger el framework propio del equipo en otros contratos.", "C": "La cesión de todo, incluido el framework, sin mencionarlo expresamente en el contrato para evitar discusiones con e
