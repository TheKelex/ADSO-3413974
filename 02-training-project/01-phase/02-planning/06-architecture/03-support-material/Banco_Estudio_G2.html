<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de estudio · Guía 2 · Diseño de la solución</title>
<style>
:root{
  --bg:#f5f7f4;--card:#fff;--txt:#17201a;--mut:#5a665e;--line:#dde5de;
  --brand:#2b8200;--brand-ink:#fff;--brand-bg:#e7f3de;
  --ok:#17692f;--okbg:#e5f5e9;--bad:#b3261e;--badbg:#fdeceb;
  --warn:#7a4f00;--warnbg:#fff3d9;--ind:#34479f;--indbg:#e9edff;
  --sh:0 1px 2px rgba(18,28,20,.05),0 6px 20px rgba(18,28,20,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1410;--card:#161e18;--txt:#e9f0ea;--mut:#9aa89e;--line:#273229;
  --brand:#74d63c;--brand-ink:#0b1608;--brand-bg:#1b2d13;
  --ok:#62d684;--okbg:#12301c;--bad:#ff8f86;--badbg:#341b19;
  --warn:#f0bb59;--warnbg:#33270d;--ind:#a3b4ff;--indbg:#1c2347;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}
header.top{background:linear-gradient(135deg,#1f6300,#39a900);color:#fff;padding:34px 0 26px}
header.top .wrap{padding-bottom:0}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 6px}
h1{margin:0 0 6px;font-size:clamp(24px,4.6vw,34px);line-height:1.15;letter-spacing:-.01em}
.sub{margin:0;opacity:.92;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-top:16px}
.how{margin-top:-18px;position:relative}
.how h2{margin:0 0 6px;font-size:16px}
.how ul{margin:6px 0 0;padding-left:20px;color:var(--mut)}
.how li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab .c{font-weight:500;opacity:.8;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
select,button.btn{font:inherit}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-weight:600}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.ghost{color:var(--mut);font-weight:500}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ind);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:14px}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.num{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:8px;padding:2px 9px;font-size:14px;margin-right:2px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--mut)}
.chip.Básica{background:var(--brand-bg);color:var(--ok);border-color:transparent}
.chip.Intermedia{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.Avanzada{background:var(--indbg);color:var(--ind);border-color:transparent}
.chip.caso{border-color:var(--ind);color:var(--ind)}
.stem{margin:6px 0 12px;font-size:17px;font-weight:550}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-bg)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt .t{flex:1}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ind);background:var(--indbg)}
.opt.sel .l{background:var(--ind);border-color:var(--ind);color:var(--brand-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--brand-ink)}
.opt.dim{opacity:.62}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb h4{margin:0 0 4px;font-size:14px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
details{margin-top:10px;font-size:14.5px}
summary{cursor:pointer;color:var(--mut);font-weight:600}
details ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:7px}
details li{border-left:3px solid var(--line);padding:2px 0 2px 10px}
details li b{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.simbar{position:sticky;top:52px;z-index:4;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.score{font-size:42px;font-weight:800;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
footer{color:var(--mut);font-size:13px;margin-top:28px;text-align:center}
code{background:var(--brand-bg);padding:1px 5px;border-radius:5px;font-size:.92em}
@media (max-width:560px){.card{padding:14px}.stem{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="kicker" id="kicker"></p>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
</div></header>
<main class="wrap">
  <section class="panel how" id="how"></section>
  <section class="panel" id="statsPanel"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>
<script>
const D = {"meta": {"id": "G2", "titulo": "Diseño de la solución", "sub": "Artefactos de diseño, modelo de datos y verificación del diseño", "norma": "220501095", "fase": "Planeación", "actividad": "Determinar la estructura lógica y tecnológica del software", "prueba": "sábado 28 de noviembre de 2026", "entrega": "sábado 28 de noviembre de 2026, 6:00 a. m.", "raps": "593103 · 593101 · 593102"}, "preguntas": [{"n": 1, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En diseño orientado a objetos, ¿qué mide la cohesión de una clase?", "opts": {"A": "Cuántas otras clases del sistema dependen directamente de ella y con qué frecuencia la invocan.", "B": "Cuántos atributos privados declara frente a los atributos públicos.", "C": "Qué tan relacionadas entre sí están las responsabilidades que la clase reúne.", "D": "Cuántos métodos hereda de su clase padre sin modificarlos."}, "ok": "C", "porque": "La cohesión describe la unidad de propósito de una clase; se busca alta cohesión.", "falla": {"A": "Describe el acoplamiento (dependencias entre clases), no la cohesión.", "B": "La proporción de atributos privados habla del encapsulamiento, no de la cohesión.", "D": "La cantidad de métodos heredados describe la herencia, no la cohesión."}}, {"n": 2, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "¿Qué significa encapsular un objeto?", "opts": {"A": "Agrupar varias clases relacionadas dentro de un mismo paquete o carpeta del proyecto.", "B": "Ocultar su estado interno y permitir el acceso solo mediante sus métodos públicos.", "C": "Permitir que una subclase reutilice los atributos que declaró su clase padre.", "D": "Cifrar los valores del objeto antes de guardarlos en la base de datos."}, "ok": "B", "porque": "El encapsulamiento protege el estado y expone una interfaz controlada.", "falla": {"A": "Eso es organizar en paquetes, una decisión de estructura y no de encapsulamiento.", "C": "Eso es herencia: reutilizar estructura de la superclase.", "D": "El cifrado es una medida de seguridad de datos, no una propiedad de la orientación a objetos."}}, {"n": 3, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En un diagrama de clases, la asociación entre <code>Cliente<\/code> y <code>Pedido<\/code> tiene multiplicidad <code>1<\/code> del lado de <code>Cliente<\/code> y <code>0..*<\/code> del lado de <code>Pedido<\/code>. ¿Qué significa?", "opts": {"A": "Cada cliente tiene exactamente un pedido y cada pedido puede tener cero o muchos clientes del sistema de ventas.", "B": "Un cliente debe tener al menos un pedido y cada pedido puede pertenecer a varios clientes.", "C": "Cada pedido pertenece a exactamente un cliente y un cliente puede tener cero o muchos pedidos.", "D": "Las clases solo se relacionan cuando ya existe un pedido registrado, sin otro límite."}, "ok": "C", "porque": "La multiplicidad de un extremo indica cuántos objetos de esa clase se asocian con uno del otro extremo: <code>1<\/code> cliente por pedido, <code>0..*<\/code> pedidos por cliente.", "falla": {"A": "Invierte los extremos de la multiplicidad.", "B": "<code>0..*<\/code> admite cero pedidos y el <code>1<\/code> impide varios clientes por pedido.", "D": "La multiplicidad no habla de cuándo existen las clases, sino de cuántos objetos se asocian."}}, {"n": 4, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "¿Cuál es el propósito del patrón creacional Singleton?", "opts": {"A": "Crear familias de objetos relacionados sin especificar cuáles son sus clases concretas.", "B": "Garantizar que una clase tenga una única instancia con un punto de acceso global.", "C": "Ofrecer una interfaz simplificada hacia un conjunto de clases de un subsistema.", "D": "Recorrer los elementos de una colección sin exponer su estructura interna."}, "ok": "B", "porque": "Singleton restringe la instanciación a un solo objeto.", "falla": {"A": "Eso describe la Fábrica abstracta.", "C": "Eso describe la Fachada, un patrón estructural.", "D": "Eso describe el Iterador, un patrón comportamental."}}, {"n": 5, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "¿Qué muestra un diagrama de despliegue?", "opts": {"A": "Las clases del sistema con sus atributos, métodos y relaciones de herencia.", "B": "Los nodos físicos o virtuales y los artefactos de software que se ejecutan en cada uno.", "C": "Los pasos de un proceso con sus decisiones, bifurcaciones y responsables.", "D": "Los mensajes que los objetos se intercambian ordenados a lo largo del tiempo."}, "ok": "B", "porque": "El diagrama de despliegue es la vista física: nodos, artefactos y conexiones.", "falla": {"A": "Eso es el diagrama de clases (vista estática).", "C": "Eso es un diagrama de actividades o de procesos.", "D": "Eso es un diagrama de secuencia."}}, {"n": 6, "rap": "593103", "nivel": "Básica", "caso": false, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En una arquitectura cliente/servidor de tres capas, ¿cuáles son las capas?", "opts": {"A": "Presentación, lógica de negocio y acceso a datos.", "B": "Cliente, servidor web y navegador del usuario final.", "C": "Modelo, vista y controlador, cada una con un rol propio.", "D": "Entrada, procesamiento y salida de la información."}, "ok": "A", "porque": "Las tres capas separan interfaz, reglas de negocio y persistencia.", "falla": {"B": "Esos son actores o equipos, no capas lógicas.", "C": "Eso es el patrón MVC; las capas y MVC son cosas distintas.", "D": "Eso es el esquema básico de un sistema de procesamiento, no una arquitectura por capas."}}, {"n": 7, "rap": "593103", "nivel": "Básica", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "El informe de análisis dice: «el sistema debe responder cada consulta en menos de dos segundos con 500 usuarios». ¿Qué tipo de requisito es?", "opts": {"A": "Funcional, porque describe una operación concreta que el usuario ejecuta sobre el sistema.", "B": "Funcional, porque indica una cantidad concreta de usuarios.", "C": "No funcional, porque fija una cualidad de desempeño del sistema.", "D": "De dominio, porque describe una regla propia del negocio."}, "ok": "C", "porque": "Los tiempos de respuesta y la carga son cualidades sistémicas, es decir, requisitos no funcionales.", "falla": {"A": "La operación (consultar) no es lo que se exige; se exige cómo se comporta.", "B": "Tener una cifra no vuelve funcional un requisito.", "D": "No hay una regla de negocio; hay una meta técnica de desempeño."}}, {"n": 8, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "La clase <code>Catalogo<\/code> guarda sus productos en una lista interna y varias pantallas la recorren accediendo directamente a ella. Si el catálogo cambia la lista por un árbol, hay que modificar todas las pantallas. ¿Qué patrón GoF resuelve el problema?", "opts": {"A": "Singleton: garantiza que exista un único catálogo accesible desde todas las pantallas de la aplicación móvil.", "B": "Comando: encapsula cada recorrido como un objeto para poder deshacerlo más adelante.", "C": "Iterador: el catálogo ofrece un recorrido uniforme sin exponer cuál es su estructura interna.", "D": "Fábrica abstracta: crea familias de listas y de árboles sin indicar la clase concreta."}, "ok": "C", "porque": "El Iterador separa el recorrido de la estructura: las pantallas dependen de la interfaz de recorrido y no de la lista o del árbol.", "falla": {"A": "Singleton limita las instancias, pero las pantallas seguirían acopladas a la estructura interna.", "B": "Comando sirve para encapsular y deshacer acciones, no para recorrer una colección.", "D": "La Fábrica abstracta crea objetos; no resuelve el recorrido de una colección."}}, {"n": 9, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En un sistema académico los <code>Módulos<\/code> de un <code>Curso<\/code> carecen de sentido si el curso se elimina. ¿Qué relación UML corresponde entre <code>Curso<\/code> y <code>Módulo<\/code>?", "opts": {"A": "Agregación, con el rombo vacío, porque un curso contiene módulos y basta.", "B": "Composición, con el rombo relleno del lado de <code>Curso<\/code>.", "C": "Herencia, con <code>Módulo<\/code> como subclase de <code>Curso<\/code> para reutilizar atributos.", "D": "Dependencia, con flecha punteada, porque <code>Curso<\/code> solo usa los módulos al mostrarlos."}, "ok": "B", "porque": "La parte no existe sin el todo: eso es composición.", "falla": {"A": "En la agregación las partes pueden existir de forma independiente.", "C": "Un módulo no «es un» curso; herencia sería un error de modelado.", "D": "La dependencia es un uso circunstancial y no refleja el ciclo de vida compartido."}}, {"n": 10, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "<code>Pedido<\/code> crea con <code>new<\/code> un objeto <code>PagoTarjeta<\/code> y lee sus atributos internos. Agregar PSE obliga a modificar <code>Pedido<\/code>. ¿Qué mejora reduce el acoplamiento?", "opts": {"A": "Declarar públicos los atributos de <code>PagoTarjeta<\/code> para que <code>Pedido<\/code> los lea con mayor rapidez.", "B": "Copiar el código de <code>PagoTarjeta<\/code> dentro de <code>Pedido<\/code> y así eliminar la dependencia entre ambas.", "C": "Hacer que <code>Pedido<\/code> sea subclase de <code>PagoTarjeta<\/code> para heredar sus métodos.", "D": "Depender de una interfaz <code>MedioPago<\/code> y recibir la implementación desde afuera."}, "ok": "D", "porque": "Programar contra una interfaz permite cambiar de implementación sin tocar <code>Pedido<\/code>.", "falla": {"A": "Aumenta el acoplamiento y rompe el encapsulamiento.", "B": "Duplica código y mezcla responsabilidades; el acoplamiento sigue ahí en otra forma.", "C": "Un pedido no es un pago; la herencia aquí es incorrecta y rígida."}}, {"n": 11, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un cálculo de descuentos usa una cadena de <code>if-else<\/code> para estudiantes, jubilados y temporada; cada mes aparece una regla nueva. ¿Qué patrón conviene?", "opts": {"A": "Estrategia: una interfaz de descuento con una clase por regla, intercambiables en ejecución.", "B": "Singleton: una única calculadora que contenga todas las reglas en un solo lugar.", "C": "Iterador: recorrer las reglas de descuento una tras otra dentro de un ciclo.", "D": "Fachada: una clase que oculte los <code>if-else<\/code> sin cambiar la estructura de las reglas."}, "ok": "A", "porque": "Estrategia encapsula algoritmos intercambiables; agregar una regla es agregar una clase.", "falla": {"B": "Singleton controla instancias, no variaciones de comportamiento.", "C": "Iterador recorre colecciones; no organiza reglas alternativas.", "D": "Fachada solo esconde la complejidad; los <code>if-else<\/code> seguirían creciendo detrás."}}, {"n": 12, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Una pantalla debe llamar por separado a <code>Inventario<\/code>, <code>Facturación<\/code> y <code>Notificaciones<\/code> para confirmar una venta, y el código se repite en cinco pantallas. ¿Qué patrón reduce ese acoplamiento?", "opts": {"A": "Fábrica abstracta: una clase que cree los tres servicios con la misma familia de clases.", "B": "Fachada: una clase con una operación <code>confirmarVenta()<\/code> que coordina los subsistemas.", "C": "Comando: una clase por cada operación que la pantalla pueda pedir al sistema.", "D": "Singleton: convertir los tres servicios en instancias únicas y globales."}, "ok": "B", "porque": "La Fachada ofrece un punto de entrada simple a un subsistema.", "falla": {"A": "La fábrica crea objetos; no oculta la coordinación entre ellos.", "C": "Comando encapsula solicitudes con posibilidad de deshacer; no simplifica la coordinación.", "D": "Ser únicos no evita que cada pantalla los llame y coordine por su cuenta."}}, {"n": 13, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En una aplicación MVC la vista ejecuta consultas SQL para mostrar el listado de productos. ¿Cuál es la corrección apropiada?", "opts": {"A": "Pasar el acceso a datos al modelo; la vista solo muestra lo que entrega el controlador.", "B": "Mover el SQL a un archivo aparte, pero seguir ejecutándolo desde la propia vista del sistema.", "C": "Quitar el controlador, porque la vista ya conoce los datos que necesita mostrar al usuario.", "D": "Pasar la lógica de negocio a la vista para reducir el número de capas del sistema."}, "ok": "A", "porque": "MVC separa datos y reglas (modelo), presentación (vista) y coordinación (controlador).", "falla": {"B": "Cambia el lugar del texto, no la responsabilidad: la vista sigue accediendo a datos.", "C": "Sin controlador se pierde la coordinación y se acopla vista con modelo.", "D": "Mezclar lógica en la vista empeora la cohesión y la mantenibilidad."}}, {"n": 14, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un equipo afirma: «si usamos REST ya no hacemos SOA, porque son arquitecturas rivales». ¿Cuál es la relación correcta entre ambos?", "opts": {"A": "SOA solo admite servicios con mensajes XML y REST la reemplazó por completo en el diseño actual de sistemas.", "B": "REST es un lenguaje de programación con el que se escriben los servicios que define SOA.", "C": "SOA se aplica únicamente a aplicaciones de escritorio y REST únicamente a las aplicaciones web.", "D": "SOA organiza la solución en servicios reutilizables y REST es un estilo para exponerlos sobre HTTP."}, "ok": "D", "porque": "SOA es un enfoque de arquitectura (servicios con contrato y reutilizables); REST es un estilo de interfaz basado en recursos y métodos HTTP. Un servicio REST puede ser parte de una SOA.", "falla": {"A": "SOA no obliga a usar XML ni fue reemplazada: es un enfoque, no un formato.", "B": "REST no es un lenguaje: es un estilo arquitectónico.", "C": "SOA no es exclusiva de escritorio ni REST exclusiva de la web."}}, {"n": 15, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un sistema registra pagos con exigencia de consistencia y mantiene un catálogo cuyos productos tienen atributos muy distintos. ¿Qué plataforma de datos es razonable?", "opts": {"A": "Un solo motor documental para todo, resolviendo las transacciones desde la aplicación.", "B": "Un solo motor relacional con una columna de texto libre por cada atributo posible.", "C": "Motor relacional para los pagos y un motor documental para el catálogo variable.", "D": "Dos bases relacionales idénticas, una para pagos y otra para el catálogo."}, "ok": "C", "porque": "Cada tipo de dato se ubica donde su naturaleza (transaccional o flexible) se atiende mejor.", "falla": {"A": "Mover la consistencia a la aplicación debilita la integridad de los pagos.", "B": "Columnas de texto libre destruyen tipos, validaciones y consultas del catálogo.", "D": "Duplicar el motor no responde a la diferencia de naturaleza de los datos."}}, {"n": 16, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En una vista de componentes, <code>Pagos<\/code> requiere la interfaz <code>IClientes<\/code> que ofrece el componente <code>Clientes<\/code>. ¿Cómo se dibuja la dependencia?", "opts": {"A": "Como una dependencia de <code>Clientes<\/code> hacia <code>Pagos<\/code>, porque <code>Pagos<\/code> actúa primero en el flujo.", "B": "Como una herencia de <code>Pagos<\/code> hacia <code>Clientes<\/code>, porque ambos comparten la interfaz.", "C": "Como una composición, porque ambos componentes viven en el mismo servidor.", "D": "Como una dependencia de <code>Pagos<\/code> hacia la interfaz <code>IClientes<\/code> de <code>Clientes<\/code>."}, "ok": "D", "porque": "La flecha va del que requiere hacia el que provee la interfaz.", "falla": {"A": "Invierte la dirección: quien depende es el que requiere.", "B": "Compartir una interfaz no es herencia entre componentes.", "C": "El lugar de ejecución es asunto del despliegue y no define la relación entre componentes."}}, {"n": 17, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "El análisis exige disponibilidad de 99,9 % y hoy la aplicación corre en un único servidor. ¿Qué decisión de arquitectura responde mejor?", "opts": {"A": "Desplegar dos o más instancias en nodos distintos detrás de un balanceador.", "B": "Aumentar la memoria del único servidor para que nunca llegue a saturarse.", "C": "Mover la lógica a procedimientos almacenados dentro del mismo servidor de datos.", "D": "Programar reinicios nocturnos del servidor para liberar recursos acumulados."}, "ok": "A", "porque": "La redundancia elimina el punto único de falla y sostiene la disponibilidad.", "falla": {"B": "Más memoria no evita la caída del único nodo.", "C": "Cambiar de capa la lógica no agrega redundancia.", "D": "Reiniciar interrumpe el servicio y no cubre fallas de hardware o red."}}, {"n": 18, "rap": "593103", "nivel": "Intermedia", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En el diagrama de un sistema de reportes, la interfaz <code>Exportador<\/code> tiene las implementaciones <code>ExportadorPDF<\/code> y <code>ExportadorCSV<\/code>. El servicio recibe un <code>Exportador<\/code> y llama <code>exportar(datos)<\/code> sin saber cuál es. ¿Qué concepto de la orientación a objetos se ilustra?", "opts": {"A": "Encapsulamiento: el servicio oculta los datos internos de las implementaciones que utiliza para trabajar.", "B": "Polimorfismo: la misma llamada produce el comportamiento de la implementación concreta que se reciba.", "C": "Herencia múltiple: el servicio hereda a la vez el comportamiento de las dos implementaciones.", "D": "Sobrecarga: la clase declara varios métodos <code>exportar<\/code> que difieren en sus parámetros."}, "ok": "B", "porque": "Una misma interfaz con varias implementaciones y una llamada que se resuelve según el objeto recibido es polimorfismo; permite añadir formatos sin tocar el servicio.", "falla": {"A": "El encapsulamiento oculta el estado, pero no explica que una llamada cambie según la implementación.", "C": "El servicio no hereda nada: depende de una interfaz; además no hay herencia múltiple.", "D": "La sobrecarga se resuelve por parámetros en una sola clase, no por el objeto que recibe la llamada."}}, {"n": 19, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En un diagrama de un colegio, <code>Profesor<\/code> hereda de <code>Curso<\/code> «porque el profesor dicta cursos». Al implementar, <code>Profesor<\/code> recibe el atributo <code>cupoMaximo<\/code>. ¿Qué diagnóstico y corrección son correctos?", "opts": {"A": "Herencia mal usada: un profesor no es un curso; se reemplaza por una asociación.", "B": "Herencia correcta: se debe agregar <code>Curso<\/code> a todas las clases que lo usan para unificar el modelo.", "C": "Herencia correcta: solo se debe ocultar <code>cupoMaximo<\/code> con visibilidad privada en <code>Profesor<\/code>.", "D": "Herencia mal usada: se corrige invirtiendo la flecha y haciendo que <code>Curso<\/code> herede de <code>Profesor<\/code>."}, "ok": "A", "porque": "La herencia exige «es un»; entre profesor y curso la relación es de asociación.", "falla": {"B": "Ignora que no se cumple «es un» y propaga el error a más clases.", "C": "Ocultar el atributo no repara una jerarquía conceptualmente equivocada.", "D": "Invertir tampoco cumple «es un»: un curso no es un profesor."}}, {"n": 20, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un producto debe verse con familias coherentes de componentes (botones, menús, diálogos) para web y para móvil, y nunca mezclarlas. ¿Qué patrón aplica?", "opts": {"A": "Singleton: una sola instancia de cada componente, compartida entre las dos plataformas.", "B": "Comando: un objeto por cada acción que el usuario ejecuta en la pantalla.", "C": "Iterador: recorrer la lista de componentes disponibles según la plataforma elegida.", "D": "Fábrica abstracta: una fábrica por plataforma que produce toda la familia coherente."}, "ok": "D", "porque": "La Fábrica abstracta asegura que los productos de una familia sean compatibles entre sí.", "falla": {"A": "Compartir una instancia no separa las familias por plataforma.", "B": "Comando encapsula acciones, no la creación de familias.", "C": "Iterar la lista no impide mezclar componentes de plataformas distintas."}}, {"n": 21, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un editor debe permitir deshacer y rehacer cualquier acción del usuario, y registrar el historial de acciones. ¿Qué diseño responde mejor?", "opts": {"A": "Estrategia: una interfaz de algoritmos de edición intercambiables según el documento.", "B": "Singleton: un historial global con un método que restaura el último estado completo.", "C": "Fachada: una clase que ofrezca <code>editar()<\/code> y oculte los detalles del documento.", "D": "Comando: cada acción como objeto con <code>ejecutar<\/code> y <code>deshacer<\/code>, guardado en una pila."}, "ok": "D", "porque": "Comando convierte las solicitudes en objetos, lo que habilita deshacer, rehacer y registro.", "falla": {"A": "Estrategia cambia algoritmos; no almacena acciones realizadas.", "B": "El Singleton da acceso global, pero no modela cada acción reversible.", "C": "La Fachada simplifica el acceso, sin registrar ni revertir acciones."}}, {"n": 22, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Tres aprendices construirán en un mes un sistema para cinco usuarios internos. ¿Qué arquitectura candidata se justifica mejor?", "opts": {"A": "Un monolito en capas y modularizado; microservicios costarían más de lo que aportan.", "B": "Microservicios con un servicio por tabla, para que cada uno escale por separado cuando lo necesite.", "C": "Serverless en todos los módulos, porque evita diseñar los límites entre ellos.", "D": "Cliente/servidor de dos capas con la lógica en el cliente por ser lo más simple."}, "ok": "A", "porque": "Con equipo pequeño y poca carga, la complejidad operativa de microservicios no se compensa.", "falla": {"B": "Un servicio por tabla añade complejidad y acopla por la red sin beneficio con cinco usuarios.", "C": "Serverless no elimina la necesidad de diseñar módulos y límites.", "D": "La lógica en el cliente complica el mantenimiento y expone reglas de negocio."}}, {"n": 23, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "En un diseño de n capas, el componente de presentación consulta directamente la base de datos «para ahorrar tiempo». ¿Qué corrección aplica?", "opts": {"A": "Permitirlo, porque una consulta de solo lectura no necesita pasar por la lógica.", "B": "Mover la base de datos al mismo nodo de la presentación para acortar la ruta.", "C": "Eliminar la capa de negocio y dejar solo presentación y base de datos.", "D": "Que presentación invoque la lógica de negocio y esta el acceso a datos, sin saltarse capas."}, "ok": "D", "porque": "Saltarse capas rompe el aislamiento y vuelve imposible cambiar el almacenamiento sin tocar la interfaz.", "falla": {"A": "Aun de solo lectura, rompe la separación y expone la estructura de datos.", "B": "Cambiar de nodo no corrige la violación de capas.", "C": "Quitar la lógica deja las reglas sin lugar donde vivir."}}, {"n": 24, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Un equipo aplica Singleton a <code>Configuracion<\/code> y luego también a <code>CarritoDeCompras<\/code>, porque «así hay un solo carrito para toda la tienda». ¿Cuál es la crítica de diseño correcta?", "opts": {"A": "Una instancia global sirve para la configuración, pero con el carrito mezcla los pedidos de todos los clientes.", "B": "Singleton solo se permite en clases sin atributos, y el carrito necesita atributos para guardar los productos.", "C": "Singleton obliga a que la clase sea abstracta, y el carrito no puede serlo porque se instancia para cada compra.", "D": "Singleton es un patrón de comportamiento y para crear el carrito debió usarse un patrón estructural distinto."}, "ok": "A", "porque": "Singleton garantiza una sola instancia con acceso global; ese estado compartido es adecuado para datos únicos del sistema, no para datos de cada usuario.", "falla": {"B": "Singleton sí admite atributos; la objeción real es el estado global compartido.", "C": "Singleton no exige una clase abstracta; guarda una única instancia concreta.", "D": "Singleton es un patrón creacional, y el problema no es su categoría sino el estado global."}}, {"n": 25, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "El equipo integra su código una vez al mes y cada integración trae conflictos y errores. ¿Qué práctica DevOps corrige la causa?", "opts": {"A": "Crear una rama por persona y fusionarlas todas al final del proyecto.", "B": "Integración continua: integrar a menudo y correr compilación y pruebas en cada cambio.", "C": "Designar a una persona que fusione a mano el código del equipo cada semana.", "D": "Congelar el código cuatro semanas antes de la entrega para evitar cambios."}, "ok": "B", "porque": "Integrar con frecuencia y verificar automáticamente detecta los conflictos cuando son pequeños.", "falla": {"A": "Aplaza aún más la integración y agrava los conflictos.", "C": "Centraliza el cuello de botella y sigue integrando tarde.", "D": "Congelar no previene conflictos previos y retrasa la retroalimentación."}}, {"n": 26, "rap": "593103", "nivel": "Avanzada", "caso": true, "seccion": "Parte 1. Artefactos de diseño (RAP 593103: Elaborar los artefactos de diseño del software siguiendo las prácticas de la metodología seleccionada)", "stem": "Una app móvil con red lenta muestra pantallas que combinan datos de seis entidades, y hoy hace diez llamadas por pantalla. ¿Qué estilo reduce esas llamadas?", "opts": {"A": "REST con un endpoint distinto por cada tabla de la base de datos del sistema, sin agrupar.", "B": "SOAP con contrato WSDL, porque los mensajes XML pesan menos en una red lenta.", "C": "GraphQL: una consulta del cliente con solo los campos que cada pantalla necesita.", "D": "Serverless, porque elimina las llamadas de red entre el cliente y el servidor."}, "ok": "C", "porque": "GraphQL permite componer datos de varias entidades en una única solicitud.", "falla": {"A": "Un endpoint por tabla mantiene o aumenta el número de llamadas.", "B": "Los mensajes XML son más pesados, no más livianos.", "D": "Serverless sigue necesitando llamadas por red."}}, {"n": 27, "rap": "593101", "nivel": "Básica", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "¿Qué caracteriza al modelo conceptual de datos?", "opts": {"A": "Define tablas con los tipos de dato y las llaves propias del motor elegido.", "B": "Representa entidades y relaciones del negocio sin depender de un motor de base de datos.", "C": "Contiene el script de creación de tablas y los índices de cada motor.", "D": "Describe los permisos que cada rol tiene sobre cada tabla."}, "ok": "B", "porque": "El modelo conceptual es independiente de la tecnología.", "falla": {"A": "Eso corresponde al modelo lógico/físico.", "C": "Eso corresponde al modelo físico.", "D": "Eso corresponde a las políticas de seguridad."}}, {"n": 28, "rap": "593101", "nivel": "Básica", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "¿Cuál es la función de una llave primaria en una tabla relacional?", "opts": {"A": "Relacionar cada fila con una fila de otra tabla; puede repetirse y admitir nulos.", "B": "Identificar de forma única cada fila; no admite valores nulos ni repetidos.", "C": "Garantizar que dos columnas de la misma tabla siempre tengan el mismo tipo de dato.", "D": "Ordenar físicamente las filas para acelerar todas las consultas de la tabla."}, "ok": "B", "porque": "La llave primaria asegura unicidad y obligatoriedad.", "falla": {"A": "Eso describe la llave foránea.", "C": "Los tipos de dato no se garantizan con la llave primaria.", "D": "Ordenar físicamente no es su función; los índices sirven a otros fines."}}, {"n": 29, "rap": "593101", "nivel": "Básica", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "En una relación entre entidades, ¿qué expresa la cardinalidad?", "opts": {"A": "El mínimo y el máximo de ocurrencias de una entidad asociadas con otra.", "B": "El número de columnas de la tabla que resulta de cada una de las entidades.", "C": "La cantidad de registros que la base debe soportar durante el primer año.", "D": "El número de tablas necesarias para resolver la relación en el modelo lógico."}, "ok": "A", "porque": "La cardinalidad fija cuántas ocurrencias se asocian (1:1, 1:N, N:M).", "falla": {"B": "Las columnas dependen de los atributos, no de la cardinalidad.", "C": "El volumen estimado es un dato de capacidad, no cardinalidad.", "D": "El número de tablas es consecuencia de la transformación, no su definición."}}, {"n": 30, "rap": "593101", "nivel": "Básica", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "¿Qué exige la Primera Forma Normal (1FN)?", "opts": {"A": "Que toda columna no clave dependa de la llave primaria completa de la tabla.", "B": "Que ninguna columna no clave dependa de otra columna que tampoco es clave.", "C": "Que cada tabla tenga al menos una llave foránea hacia otra tabla del modelo.", "D": "Que cada columna contenga valores atómicos y no existan grupos repetidos."}, "ok": "D", "porque": "1FN: atomicidad y ausencia de grupos repetidos.", "falla": {"A": "Eso corresponde a la 2FN.", "B": "Eso corresponde a la 3FN.", "C": "Tener llaves foráneas no es requisito de normalización."}}, {"n": 31, "rap": "593101", "nivel": "Básica", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "¿Cuál enunciado define correctamente la confidencialidad de los datos?", "opts": {"A": "Que los datos puedan modificarse únicamente dejando un registro de cambios.", "B": "Que la información esté disponible en todo momento para quien la solicite.", "C": "Que los datos conserven siempre el mismo formato y longitud.", "D": "Que solo accedan a la información las personas y procesos autorizados."}, "ok": "D", "porque": "La confidencialidad limita el acceso a quien tiene autorización.", "falla": {"A": "Eso se acerca a la integridad y a la trazabilidad.", "B": "Eso describe la disponibilidad.", "C": "El formato y la longitud pertenecen al diccionario de datos, no a la confidencialidad."}}, {"n": 32, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un estudiante cursa muchos cursos y un curso tiene muchos estudiantes. ¿Cómo se transforma esta relación al modelo lógico relacional?", "opts": {"A": "Con una llave foránea de cursos dentro de estudiantes, con códigos separados por comas.", "B": "Con una llave foránea en cada tabla apuntando a la otra, sin tabla adicional.", "C": "Con una tabla intermedia que tenga como llave primaria compuesta las dos llaves foráneas.", "D": "Fusionando ambas entidades en una sola tabla con todas las columnas."}, "ok": "C", "porque": "Toda relación N:M se resuelve con una tabla de asociación.", "falla": {"A": "Viola la atomicidad (1FN).", "B": "Dos llaves cruzadas no resuelven N:M y crean dependencia circular.", "D": "Fusionar entidades genera redundancia y pierde la identidad de cada una."}}, {"n": 33, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un cliente realiza muchos pedidos y cada pedido pertenece a un solo cliente. ¿Dónde va la llave foránea?", "opts": {"A": "En la tabla de clientes, apuntando al pedido más reciente de cada uno.", "B": "En una tabla intermedia obligatoria entre clientes y pedidos.", "C": "En la tabla de pedidos, apuntando a la llave primaria de clientes.", "D": "En ambas tablas, duplicando los datos del cliente en cada pedido."}, "ok": "C", "porque": "En una relación 1:N la llave foránea se coloca del lado «muchos».", "falla": {"A": "Solo registraría un pedido por cliente y perdería el historial.", "B": "La tabla intermedia es para N:M, no para 1:N.", "D": "Duplicar datos genera redundancia y anomalías de actualización."}}, {"n": 34, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "La tabla <code>detalle_pedido(id_pedido, id_producto, cantidad, nombre_producto)<\/code> tiene llave primaria (<code>id_pedido<\/code>, <code>id_producto<\/code>). ¿Qué problema de normalización presenta?", "opts": {"A": "Viola la 1FN, porque la llave primaria está formada por dos columnas distintas.", "B": "Viola la 2FN: <code>nombre_producto<\/code> depende solo de <code>id_producto<\/code>, parte de la llave.", "C": "Viola la 3FN, porque <code>cantidad<\/code> depende de <code>id_pedido<\/code> únicamente y no de la llave.", "D": "No viola ninguna forma normal, porque tiene llave compuesta y valores atómicos."}, "ok": "B", "porque": "Una dependencia parcial respecto a la llave compuesta incumple la 2FN.", "falla": {"A": "Una llave compuesta no contradice la 1FN.", "C": "<code>cantidad<\/code> depende de la llave completa; el problema es <code>nombre_producto<\/code>.", "D": "Que sea atómica y compuesta no basta; hay dependencia parcial."}}, {"n": 35, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "La tabla <code>empleado(id_empleado, nombre, id_depto, nombre_depto)<\/code> tiene llave <code>id_empleado<\/code>. ¿Qué corrección aplica?", "opts": {"A": "Crear <code>departamento<\/code> con <code>nombre_depto<\/code> y dejar solo <code>id_depto<\/code> en <code>empleado<\/code>.", "B": "Unir <code>nombre<\/code> y <code>nombre_depto<\/code> en una sola columna de texto libre para simplificar.", "C": "Agregar <code>id_depto<\/code> a la llave primaria de <code>empleado<\/code> para que quede compuesta.", "D": "Dejar la tabla igual, porque <code>nombre_depto<\/code> es un dato descriptivo que resulta útil."}, "ok": "A", "porque": "Existe una dependencia transitiva (<code>id_empleado<\/code> → <code>id_depto<\/code> → <code>nombre_depto<\/code>) que la 3FN elimina.", "falla": {"B": "Mezclar columnas rompe la atomicidad y no elimina la dependencia.", "C": "Una llave compuesta artificial no corrige la dependencia transitiva.", "D": "Mantenerla produce redundancia y anomalías al renombrar un departamento."}}, {"n": 36, "rap": "593101", "nivel": "Intermedia", "caso": false, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "¿Qué debe describir el diccionario de datos de cada columna?", "opts": {"A": "Nombre, consultas SQL en que aparece y tiempo promedio de ejecución de cada una.", "B": "Nombre, tipo de dato, tamaño, restricciones y dominio de valores permitidos.", "C": "Nombre, usuario que la creó y fecha de creación dentro del servidor.", "D": "Nombre, pantalla donde se muestra y color con que se presenta al usuario."}, "ok": "B", "porque": "El diccionario documenta la definición técnica de cada elemento del modelo lógico.", "falla": {"A": "Eso es información de rendimiento, no de definición.", "C": "Eso es metadato de auditoría, no el contenido del diccionario.", "D": "Eso es información de interfaz, ajena al modelo de datos."}}, {"n": 37, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un diccionario trae tablas llamadas <code>Tabla1<\/code>, <code>DatosX<\/code> y <code>Info<\/code>, y columnas <code>c1<\/code>, <code>c2<\/code>, <code>c3<\/code>. ¿Qué estándar de nombrado se debe aplicar?", "opts": {"A": "Abreviaturas cortas como <code>c1<\/code> para ahorrar espacio, explicadas aparte en un anexo.", "B": "Mayúsculas y minúsculas mezcladas, según prefiera cada integrante del equipo.", "C": "Un prefijo con el nombre del motor en cada tabla para saber dónde reside.", "D": "Nombres descriptivos y uniformes: <code>snake_case<\/code> y el mismo criterio de número."}, "ok": "D", "porque": "Un estándar de nombrado exige claridad y consistencia.", "falla": {"A": "Las abreviaturas opacas dificultan el mantenimiento aun con anexo.", "B": "Sin criterio común el modelo se vuelve ilegible e inconsistente.", "C": "El prefijo del motor no aporta significado de negocio."}}, {"n": 38, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Una tabla guardará el número de documento y el diagnóstico médico de cada usuario. ¿Qué política de seguridad es la adecuada?", "opts": {"A": "Tratar el diagnóstico como dato sensible: autorización explícita, cifrado, acceso por rol y finalidad documentada.", "B": "Aplicar hash al diagnóstico y al documento, para poder consultarlos luego por su valor original cuando se necesite.", "C": "Cifrar solo el número de documento, porque el diagnóstico por sí solo no identifica a la persona.", "D": "Dejar los datos sin cifrar y restringir el acceso con una contraseña compartida por todo el área."}, "ok": "A", "porque": "El diagnóstico es un dato sensible: requiere autorización explícita y facultativa, cifrado reversible para quien esté autorizado, acceso por rol y finalidad declarada.", "falla": {"B": "El hash no es reversible: el dato no se podría recuperar; cifrar y aplicar hash no son lo mismo.", "C": "El diagnóstico asociado al usuario es un dato sensible y debe protegerse igual que el documento.", "D": "Una contraseña compartida no distingue personas ni roles y no cifra nada."}}, {"n": 39, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Para guardar el valor monetario de una factura, ¿qué tipo de dato es el más apropiado?", "opts": {"A": "<code>DECIMAL(12,2)<\/code>, para evitar los errores de redondeo del punto flotante.", "B": "<code>FLOAT<\/code>, porque admite cualquier cantidad de decimales sin definir tamaño.", "C": "<code>VARCHAR(20)<\/code>, porque permite escribir el símbolo de la moneda.", "D": "<code>INTEGER<\/code>, porque los centavos pueden ignorarse en el cálculo."}, "ok": "A", "porque": "Los importes exigen precisión exacta; <code>DECIMAL<\/code> la ofrece.", "falla": {"B": "<code>FLOAT<\/code> es aproximado y acumula errores de redondeo.", "C": "El texto impide operar y validar el valor numérico.", "D": "Ignorar centavos produce diferencias contables."}}, {"n": 40, "rap": "593101", "nivel": "Intermedia", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un sistema tiene administradores, cajeros y auditores, cada grupo con acceso distinto a los datos. ¿Cuál es la política de niveles de acceso correcta?", "opts": {"A": "Usar una sola cuenta con todos los permisos, compartida por la aplicación y por los usuarios.", "B": "Otorgar escritura a todos y auditar los cambios después de que ya hayan ocurrido.", "C": "Asignar permisos distintos a cada persona sin agruparlos en roles.", "D": "Crear roles con el mínimo de permisos necesarios y asignarlos a los usuarios."}, "ok": "D", "porque": "Los roles con privilegio mínimo facilitan el control y la revisión.", "falla": {"A": "Una cuenta con todos los permisos elimina el control de acceso.", "B": "Auditar a posteriori no previene accesos indebidos.", "C": "Permisos persona por persona son inmanejables y propensos a error."}}, {"n": 41, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "La tabla <code>inventario(id_producto, id_bodega, cantidad, direccion_bodega, ciudad_bodega, departamento_bodega)<\/code> tiene llave (<code>id_producto<\/code>, <code>id_bodega<\/code>); cada ciudad del catálogo es única y pertenece a un solo departamento. ¿Cuál es el diagnóstico completo?", "opts": {"A": "Cumple 3FN, porque tiene llave compuesta y todos los valores son atómicos.", "B": "Viola la 1FN, porque tiene más de cuatro columnas en una sola tabla.", "C": "Viola solo la 3FN, porque la 2FN únicamente se evalúa con llaves simples.", "D": "Cumple 1FN, pero viola la 2FN (la dirección depende de la bodega) y la 3FN (el departamento depende de la ciudad)."}, "ok": "D", "porque": "Hay dependencias parciales y transitivas: se separan <code>bodega<\/code> y <code>ciudad<\/code>.", "falla": {"A": "Pasa por alto las dependencias parciales y transitivas.", "B": "El número de columnas no determina la forma normal.", "C": "La 2FN solo tiene sentido con llaves compuestas, justo este caso."}}, {"n": 42, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un reporte mensual tarda demasiado por la unión de diez tablas normalizadas. ¿Qué decisión de diseño es la más sensata?", "opts": {"A": "Desnormalizar todo el modelo, duplicando datos en cada una de las tablas.", "B": "Crear una vista normal que una las diez tablas, porque la vista ya guarda el resultado calculado de la unión.", "C": "Mantener 3FN en lo transaccional y resolver el reporte con una vista materializada o una tabla de resumen.", "D": "Quitar las llaves foráneas para que las uniones se resuelvan más rápido en el motor."}, "ok": "C", "porque": "Se protege la integridad transaccional y se optimiza solo el caso de lectura con datos precalculados (vista materializada, tabla de resumen o réplica de lectura).", "falla": {"A": "Duplicar todo introduce anomalías de actualización en las operaciones diarias.", "B": "Una vista normal no guarda datos: ejecuta la misma consulta cada vez y no acelera nada.", "D": "Quitar llaves foráneas sacrifica la integridad referencial sin garantizar mejora."}}, {"n": 43, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un empleado puede tener cero o una credencial de acceso, y cada credencial pertenece a un único empleado. ¿Cómo se transforma al modelo lógico?", "opts": {"A": "Tabla <code>credencial<\/code> con <code>id_empleado<\/code> como llave foránea única (<code>UNIQUE<\/code>) y no nula.", "B": "Columna <code>credencial<\/code> en <code>empleado<\/code>, permitiendo valores repetidos entre los empleados.", "C": "Tabla intermedia <code>empleado_credencial<\/code> sin restricciones de unicidad sobre las llaves.", "D": "Dos tablas sin llave foránea, enlazadas únicamente por el nombre del empleado."}, "ok": "A", "porque": "La restricción <code>UNIQUE<\/code> sobre la llave foránea garantiza 0..1 por empleado.", "falla": {"B": "Permitir repetidos rompe el «único empleado» de la credencial.", "C": "Sin unicidad se vuelve N:M y rompe la cardinalidad.", "D": "Enlazar por nombre no garantiza integridad ni unicidad."}}, {"n": 44, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Un equipo diseña una encuesta que recoge datos de menores de edad. ¿Qué política de tratamiento de datos personales aplica?", "opts": {"A": "Pedir la autorización al propio menor, porque es el titular de los datos y quien responde la encuesta.", "B": "Entender la autorización como implícita cuando el menor decide participar en la encuesta de forma voluntaria y libre.", "C": "Tratarlos solo si responde al interés superior del menor, con autorización de su representante legal y datos necesarios.", "D": "Recolectar todos los datos posibles y pedir la autorización al representante legal al terminar la encuesta."}, "ok": "C", "porque": "La Ley 1581 de 2012 (art. 7) protege de forma prevalente los datos de niños, niñas y adolescentes, y su reglamentación (Decreto 1377 de 2013, hoy compilado en el Decreto 1074 de 2015) exige interés superior del menor, autorización del representante legal y datos necesarios.", "falla": {"A": "La autorización la da el representante legal del menor, no el menor.", "B": "La autorización debe ser previa y expresa, no se presume por participar.", "D": "Recoger de más viola la necesidad y pedir la autorización al final viola el carácter previo."}}, {"n": 45, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Una red de sensores envía diez mil lecturas por segundo y se consultan sobre todo por rango de tiempo. ¿Qué plataforma de datos es más coherente con el volumen y la velocidad?", "opts": {"A": "Una tabla relacional con un índice por cada columna para que cualquier consulta sea rápida.", "B": "Un archivo de hoja de cálculo por día con las lecturas para facilitar el análisis posterior.", "C": "Una base relacional con una tabla por sensor y restricciones <code>CHECK<\/code> en cada columna.", "D": "Un almacén no relacional o de series de tiempo, pensado para gran volumen de escritura."}, "ok": "D", "porque": "El volumen y la velocidad son rasgos propios de Big Data que orientan a almacenes especializados.", "falla": {"A": "Un índice por columna encarece cada escritura y no escala a ese ritmo.", "B": "Una hoja de cálculo no soporta ese volumen ni la concurrencia.", "C": "Una tabla por sensor multiplica el esquema sin resolver el ritmo de escritura."}}, {"n": 46, "rap": "593101", "nivel": "Avanzada", "caso": true, "seccion": "Parte 2. Modelo de datos (RAP 593101: Estructurar el modelo de datos del software de acuerdo con las especificaciones del análisis)", "stem": "Para garantizar la disponibilidad y la recuperación de los datos de un sistema de inscripciones, ¿qué política es la más completa?", "opts": {"A": "Un respaldo manual al finalizar el semestre, guardado en el mismo servidor de la base.", "B": "Réplica en otro nodo con conmutación automática y respaldos programados con restauración probada.", "C": "Solo una réplica de la base en otro nodo y ningún respaldo, porque la réplica lo cubre todo.", "D": "Solo respaldos diarios en otro nodo, sin réplica, porque con ellos el servicio nunca se detiene ni se interrumpe."}, "ok": "B", "porque": "La disponibilidad la da la réplica con conmutación; la recuperación ante borrados o corrupción la dan los respaldos con restauración probada. Se necesitan ambos.", "falla": {"A": "Es espaciado, manual y comparte el punto de falla con el original.", "C": "La réplica copia también los borrados y corrupciones; no sustituye al respaldo.", "D": "Restaurar un respaldo toma tiempo con el servicio detenido; no sostiene la disponibilidad."}}, {"n": 47, "rap": "593102", "nivel": "Básica", "caso": false, "seccion": "Parte 3. Verificación del diseño (RAP 593102: Verificar los entregables de la fase de diseño del software de acuerdo con lo establecido en el informe de análisis)", "stem": "¿En qué consiste una inspección de un artefacto de diseño?", "opts": {"A": "En ejecutar el software con datos de prueba para encontrar fallas en funcionamiento.", "B": "En redactar el artefacto entre dos personas frente al mismo computador.", "C": "En aprobar el artefacto por parte del líder sin revisar su contenido.", "D": "En una revisión sistemática hecha por otras personas, con criterios definidos, para hallar defectos."}, "ok": "D", "porque": "La inspección es una técnica estática de evaluación con criterios previos.", "falla": {"A": "Eso es una prueba dinámica, sobre software ya construido.", "B": "Eso es programación en pareja, no inspección.", "C": "Aprobar sin revisar no es una técnica de evaluación."}}, {"n": 48, "rap": "593102", "nivel": "Básica", "caso": false, "seccion": "Parte 3. Verificación del diseño (RAP 593102: Verificar los entregables de la fase de diseño del software de acuerdo con lo establecido en el informe de análisis)", "stem": "¿Qué es una lista de chequeo para verificar un diseño?", "opts": {"A": "Un cronograma con las fechas de entrega de cada artefacto de diseño.", "B": "Un informe narrativo con la opinión general del equipo sobre el diseño.", "C": "Un instrumento con criterios de aceptación que se marcan como cumplidos o no cumplidos.", "D": "Una matriz de riesgos con la probabilidad y el impacto de cada amenaza."}, "ok": "C", "porque": "La lista de chequeo vuelve verificable la revisión mediante criterios objetivos.", "falla": {"A": "Un cronograma planifica tiempos, no verifica calidad.", "B": "Una opinión general no es verificable criterio por criterio.", "D": "Una matriz de riesgos gestiona amenazas, no verifica entregables."}}, {"n": 49, "rap": "593102", "nivel": "Básica", "caso": false, "seccion": "Parte 3. Verificación del diseño (RAP 593102: Verificar los entregables de la fase de diseño del software de acuerdo con lo establecido en el informe de análisis)", "stem": "En la verificación del diseño, ¿qué es la trazabilidad?", "opts": {"A": "Registrar quién modificó cada archivo del proyecto y en function chips(q) {

}

// chosen: letra elegida o undefined; reveal: mostrar retroalimentación; interactive: permitir elegir
function card(q, chosen, reveal, interactive) {
  const opts = ['A', 'B', 'C', 'D'].map(l => {
    let cls = 'opt';
    if (reveal) { if (l === q.ok) cls += ' ok'; else if (l === chosen) cls += ' bad'; else cls += ' dim'; }
    else if (l === chosen) cls += ' sel';
    const dis = (reveal || !interactive) ? ' disabled' : '';
    const mark = reveal ? (l === q.ok ? ' <span class="sr" aria-label="correcta"></span>' : '') : '';
    return '<button class="' + cls + '" data-n="' + q.n + '" data-l="' + l + '"' + dis + ' aria-pressed="' + (l === chosen) + '"><span class="l">' + l + '</span><span class="t">' + q.opts[l] + mark + '</span></button>';
  }).join('');
  let fb = '';
  if (reveal) {
    const acierto = chosen === q.ok;
    fb = '<div class="fb ' + (acierto ? 'ok' : 'bad') + '"><h4>' + (chosen === undefined ? 'Respuesta correcta: ' + q.ok : acierto ? '¡Correcto!' : 'No es esa. La correcta es la ' + q.ok) + '</h4>' + q.porque + '</div>';
    const otras = ['A', 'B', 'C', 'D'].filter(l => l !== q.ok);
    fb += '<details' + (!acierto && chosen ? ' open' : '') + '><summary>Por qué fallan las otras opciones</summary><ul>' +
      otras.map(l => '<li><b>' + l + ')</b> ' + q.falla[l] + '</li>').join('') + '</ul></details>';
  }
  return '<article class="card" id="q' + q.n + '">' + chips(q) + '<p class="stem">' + q.stem + '</p><div class="opts" role="group" aria-label="Opciones de la pregunta ' + q.n + '">' + opts + '</div>' + fb + '</article>';
}

function raps() {
  const m = new Map(); Q.forEach(q => { if (!m.has(q.rap)) m.set(q.rap, q.seccion.replace(/^(Tema|Parte)\s*\d+\.\s*/, '').replace(/\s*\(RAP[^)]*\)\s*$/, '')); });
  return [...m.entries()];
}

    '<label><input type="checkbox" id="fCaso"' + (F.caso ? ' checked' : '') + '> Solo casos</label>' +
    '<label><input type="checkbox" id="fPend"' + (F.pend ? ' checked' : '') + '> Solo sin responder</label>' +
    '<span style="margin-left:auto;color:var(--mut);font-size:13px">' + list.length + ' preguntas</span></div>';
  const body = list.length ? list.map(q => { const c = S.ans[q.n]; return card(q, c, c !== undefined, true) + (c !== undefined ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('') : '<div class="empty">No hay preguntas con ese filtro.</div>';

function errores() {
  const list = Q.filter(q => S.wrong[q.n]);
  $('#view').innerHTML = list.length ? '<p class="empty" style="padding:14px 0 0">Preguntas que fallaste en estudio o simulacro. Acierta una de nuevo y sale de esta lista.</p>' +
    list.map(q => { const c = S.ans[q.n]; const rev = c !== undefined && S.ans[q.n] !== undefined; return card(q, c, rev, true) + (rev ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('')
    : '<div class="empty"><b>Nada por repasar.</b><br>Cuando falles una pregunta, aparecerá aquí.</div>';
  bindOpts(false);
}

function bindOpts(sim) {
  document.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, l = b.dataset.l;
    if (sim) { SIM.ans[n] = l; simRender(); return; }
    S.ans[n] = l;
    if (l === BY[n].ok) delete S.wrong[n]; else S.wrong[n] = true;
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { const n = +b.dataset.retry; delete S.ans[n]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
}

/* ---------- Simulacro ---------- */
function pick(arr, k) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); }
function simStart() {
  const by = n => Q.filter(q => q.nivel === n);
  const ids = pick(by('Básica'), 4).concat(pick(by('Intermedia'), 9), pick(by('Avanzada'), 7));
  SIM = {ids: pick(ids, ids.length).map(q => q.n), ans: {}, t0: Date.now(), dur: 40 * 60 * 1000, done: false};
  clearInterval(timer); timer = setInterval(tick, 1000); simRender();
}
function left() { return Math.max(0, SIM.dur - (Date.now() - SIM.t0)); }
function fmt(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick() { if (!SIM || SIM.done) { clearInterval(timer); return; } const t = $('#tm'); if (t) t.textContent = fmt(left()); if (left() === 0) simFinish(); }
function simFinish() {
  if (!SIM || SIM.done) return; SIM.done = true; clearInterval(timer);
  let ok = 0; const porRap = {};
  SIM.ids.forEach(n => { const q = BY[n], a = SIM.ans[n]; const g = a === q.ok; if (g) ok++; porRap[q.rap] = porRap[q.rap] || [0, 0]; porRap[q.rap][1]++; if (g) porRap[q.rap][0]++; if (!g) S.wrong[n] = true; else if (!(n in S.ans) || S.ans[n] === q.ok) delete S.wrong[n]; });
  SIM.score = ok * 5; SIM.ok = ok; SIM.porRap = porRap;
  S.sims.push({score: SIM.score, fecha: new Date().toISOString().slice(0, 10)}); save(); stats(); tabs(); simRender();
}
function simRender() {
  if (!SIM) {
    $('#view').innerHTML = '<div class="panel"><h2 style="margin-top:0">Simulacro de la prueba de conocimiento</h2><p>20 preguntas al azar (4 básicas, 9 intermedias, 7 avanzadas), <b>40 minutos</b>, sin ver las respuestas hasta entregar. Se califica sobre 100 (5 puntos por pregunta) y se aprueba con <b>70</b>.</p><p style="color:var(--mut)">El reloj empieza al pulsar el botón. Si se acaba el tiempo, se entrega solo.</p><div class="row"><button class="btn primary" id="go">Empezar simulacro</button></div></div>';
    $('#go').onclick = simStart; return;
  }
  const qs = SIM.ids.map(n => BY[n]);
  if (!SIM.done) {
    const resp = Object.keys(SIM.ans).length;
    $('#view').innerHTML = '<div class="panel simbar"><span>Tiempo restante <span class="timer" id="tm">' + fmt(left()) + '</span></span><span>' + resp + ' / ' + qs.length + ' respondidas</span><button class="btn primary" id="fin">Entregar</button></div>' +
      qs.map((q, i) => card(Object.assign({}, q, {n: q.n}), SIM.ans[q.n], false, true).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
    bindOpts(true);
    $('#fin').onclick = () => { const f = qs.length - Object.keys(SIM.ans).length; if (!f || confirm('Te faltan ' + f + ' sin responder. ¿Entregar de todos modos?')) simFinish(); };
    return;
  }
  const pass = SIM.score >= 70;
  const filas = Object.entries(SIM.porRap).map(([r, [a, t]]) => '<tr><td>RAP ' + r + '</td><td>' + a + ' / ' + t + '</td></tr>').join('');
  $('#view').innerHTML = '<div class="panel"><div class="score ' + (pass ? 'pass' : 'fail') + '">' + SIM.score + ' / 100</div><p style="margin:6px 0 0"><b>' + (pass ? 'Aprobaste el simulacro.' : 'Aún no llegas a 70.') + '</b> ' + SIM.ok + ' de ' + qs.length + ' correctas.</p><table><thead><tr><th>Resultado de aprendizaje</th><th>Aciertos</th></tr></thead><tbody>' + filas + '</tbody></table><div class="row"><button class="btn primary" id="again">Hacer otro simulacro</button></div></div>' +
    qs.map((q, i) => card(q, SIM.ans[q.n], true, false).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
  $('#again').onclick = () => { SIM = null; simStart(); };
}

function render() {
  stats(); tabs();
  if (S.tab === 'estudio') estudio();
  else if (S.tab === 'errores') errores();
  else simRender();
}
head(); render();
</script>
</body>
</html>
