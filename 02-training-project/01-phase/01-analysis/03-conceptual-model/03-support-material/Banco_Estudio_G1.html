<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de estudio · Guía 1 · Modelo conceptual</title>
<style>
:root{
  --bg:#f5f7f4;--card:#fff;--txt:#17201a;--mut:#5a665e;--line:#dde5de;
  --brand:#2b8200;--brand-ink:#fff;--brand-bg:#e7f3de;
  --ok:#17692f;--okbg:#e5f5e9;--bad:#b3261e;--badbg:#fdeceb;
  --warn:#7a4f00;--warnbg:#fff3d9;--ind:#34479f;--indbg:#e9edff;
  --sh:0 1px 2px rgba(18,28,20,.05),0 6px 20px rgba(18,28,20,.06);--r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1410;--card:#161e18;--txt:#e9f0ea;--mut:#9aa89e;--line:#273229;
  --brand:#74d63c;--brand-ink:#0b1608;--brand-bg:#1b2d13;
  --ok:#62d684;--okbg:#12301c;--bad:#ff8f86;--badbg:#341b19;
  --warn:#f0bb59;--warnbg:#33270d;--ind:#a3b4ff;--indbg:#1c2347;--sh:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:0 18px 80px}
header.top{background:linear-gradient(135deg,#1f6300,#39a900);color:#fff;padding:34px 0 26px}
header.top .wrap{padding-bottom:0}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin:0 0 6px}
h1{margin:0 0 6px;font-size:clamp(24px,4.6vw,34px);line-height:1.15;letter-spacing:-.01em}
.sub{margin:0;opacity:.92;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 12px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-top:16px}
.how{margin-top:-18px;position:relative}
.how h2{margin:0 0 6px;font-size:16px}
.how ul{margin:6px 0 0;padding-left:20px;color:var(--mut)}
.how li{margin:3px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tab .c{font-weight:500;opacity:.8;margin-left:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
select,button.btn{font:inherit}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
button.btn{padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;font-weight:600}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.ghost{color:var(--mut);font-weight:500}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ind);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-top:14px}
.qh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.num{background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:8px;padding:2px 9px;font-size:14px;margin-right:2px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--mut)}
.chip.Básica{background:var(--brand-bg);color:var(--ok);border-color:transparent}
.chip.Intermedia{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.Avanzada{background:var(--indbg);color:var(--ind);border-color:transparent}
.chip.caso{border-color:var(--ind);color:var(--ind)}
.stem{margin:6px 0 12px;font-size:17px;font-weight:550}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--txt);font:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand);background:var(--brand-bg)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt .t{flex:1}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ind);background:var(--indbg)}
.opt.sel .l{background:var(--ind);border-color:var(--ind);color:var(--brand-ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--brand-ink)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--brand-ink)}
.opt.dim{opacity:.62}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb h4{margin:0 0 4px;font-size:14px}
.fb.ok h4{color:var(--ok)}.fb.bad h4{color:var(--bad)}
details{margin-top:10px;font-size:14.5px}
summary{cursor:pointer;color:var(--mut);font-weight:600}
details ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:7px}
details li{border-left:3px solid var(--line);padding:2px 0 2px 10px}
details li b{color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.simbar{position:sticky;top:52px;z-index:4;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.score{font-size:42px;font-weight:800;line-height:1}
.score.pass{color:var(--ok)}.score.fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
footer{color:var(--mut);font-size:13px;margin-top:28px;text-align:center}
code{background:var(--brand-bg);padding:1px 5px;border-radius:5px;font-size:.92em}
@media (max-width:560px){.card{padding:14px}.stem{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <p class="kicker" id="kicker"></p>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
</div></header>
<main class="wrap">
  <section class="panel how" id="how"></section>
  <section class="panel" id="statsPanel"></section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <footer id="foot"></footer>
</main>
<script>
const D = {"meta": {"id": "G1", "titulo": "Modelo conceptual", "sub": "Planeación del análisis, UML, modelo de dominio, MER y verificación", "norma": "220501093", "fase": "Análisis", "actividad": "Especificar el modelo conceptual del software", "prueba": "sábado 28 de noviembre de 2026", "entrega": "sábado 28 de noviembre de 2026, 6:00 a. m.", "raps": "592375 · 592373 · 592374"}, "preguntas": [{"n": 1, "rap": "592375", "nivel": "Básica", "caso": false, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "¿Cuál es el orden de las fases del Proceso Unificado Racional (RUP)?", "opts": {"A": "Inicio, elaboración, construcción y transición, en ese orden", "B": "Análisis, diseño, codificación y pruebas", "C": "Planeación, ejecución, seguimiento y cierre", "D": "Requisitos, arquitectura, implementación y despliegue"}, "ok": "A", "porque": "Esas son las cuatro fases de RUP; cada una termina en un hito de decisión.", "falla": {"B": "Confunde RUP con el modelo en cascada; son etapas lineales, no las fases de RUP.", "C": "Son los grupos de procesos de la gestión de proyectos, no las fases de RUP.", "D": "Son disciplinas (flujos de trabajo) que se repiten dentro de cada fase, no las fases."}}, {"n": 2, "rap": "592375", "nivel": "Básica", "caso": false, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "En Scrum, ¿quién ordena y mantiene el backlog del producto según el valor para el negocio?", "opts": {"A": "El Scrum Master, que lidera al equipo y sus reuniones", "B": "El equipo de desarrollo, mediante votación interna", "C": "El Product Owner, quien ordena el backlog del producto", "D": "El cliente final, directamente durante cada sprint"}, "ok": "C", "porque": "El Product Owner es quien gestiona y prioriza el backlog del producto.", "falla": {"A": "El Scrum Master facilita el proceso y retira impedimentos; no prioriza el backlog.", "B": "El equipo estima y construye, pero no decide la prioridad de negocio.", "D": "El cliente aporta necesidades; si ordenara el backlog sin intermediario se perdería la responsabilidad única."}}, {"n": 3, "rap": "592375", "nivel": "Básica", "caso": false, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "¿Qué metodología ágil propone prácticas técnicas como programación en parejas y pruebas continuas?", "opts": {"A": "Scrum, con roles y eventos pero sin prácticas técnicas", "B": "Programación extrema (XP) y sus prácticas", "C": "RUP, con fases, iteraciones y mucha documentación", "D": "El modelo en cascada, con etapas estrictamente secuenciales"}, "ok": "B", "porque": "XP define prácticas técnicas como programación en parejas, integración continua y pruebas permanentes.", "falla": {"A": "Scrum es un marco de gestión; no prescribe programación en parejas ni pruebas.", "C": "RUP es un proceso tradicional iterativo y documental; no es ágil.", "D": "La cascada es lineal y no incluye esas prácticas."}}, {"n": 4, "rap": "592375", "nivel": "Intermedia", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Una alcaldía contrata un sistema con alcance cerrado, aprobaciones por fase y requisitos que cambiarán poco, y pide reducir temprano los riesgos de arquitectura con iteraciones y documentación por hito. ¿Qué metodología se ajusta mejor?", "opts": {"A": "RUP, con fases, iteraciones y documentación por hito", "B": "Scrum, con un backlog que cambia durante todo el desarrollo del proyecto", "C": "XP, con cliente presente a diario en el equipo de trabajo", "D": "RAD, con prototipos desechables y poca documentación formal"}, "ok": "A", "porque": "Alcance cerrado, aprobaciones por fase y riesgos de arquitectura que se reducen temprano con iteraciones y documentación por hito encajan con RUP (iterativo, dirigido por riesgos, documental).", "falla": {"B": "Scrum es adaptativo; el caso exige alcance cerrado y control documental.", "C": "XP busca cambio continuo y poca documentación; la alcaldía necesita lo contrario.", "D": "RAD sacrifica documentación; el contrato pide entregables formales."}}, {"n": 5, "rap": "592375", "nivel": "Intermedia", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Un equipo de cuatro personas debe entregar una versión funcional en seis semanas. El cliente opina cada semana y sus requisitos cambian con frecuencia. ¿Qué decisión de planeación es más coherente?", "opts": {"A": "Congelar los requisitos y redactar un análisis completo antes de empezar", "B": "Omitir el análisis y comenzar a programar desde el primer día", "C": "Esperar a que el cliente entregue por escrito todos los requisitos", "D": "Planear iteraciones cortas, priorizar y modelar solo lo necesario en cada una"}, "ok": "D", "porque": "Plazo corto, cambio de requisitos y cliente disponible indican un enfoque ágil e iterativo.", "falla": {"A": "Ignora el cambio frecuente; el análisis total quedaría obsoleto.", "B": "Ágil no es ausencia de análisis; se modela lo suficiente en cada iteración.", "C": "Contradice el hecho de que los requisitos se descubren de forma incremental."}}, {"n": 6, "rap": "592375", "nivel": "Intermedia", "caso": false, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Planear las actividades de análisis consiste, en esencia, en:", "opts": {"A": "Definir y priorizar las actividades, y fijar cronograma y entregables", "B": "Elegir el lenguaje, el motor de base de datos y el servidor de despliegue", "C": "Programar primero las funciones principales y documentarlas al final del proyecto", "D": "Esperar a que termine el diseño de la solución para saber qué analizar"}, "ok": "A", "porque": "Es lo que establece el conocimiento de proceso del RAP: definir, priorizar, cronogramar y fijar entregables.", "falla": {"B": "Son decisiones de diseño o arquitectura, posteriores al análisis.", "C": "Invierte el orden; la planificación antecede a la construcción.", "D": "El análisis precede al diseño; no depende de él."}}, {"n": 7, "rap": "592375", "nivel": "Intermedia", "caso": false, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Antes de seleccionar una metodología, ¿qué se debe caracterizar de la solución de software?", "opts": {"A": "El lenguaje de programación y el motor de base de datos que elegirá el equipo", "B": "La paleta de colores y el logotipo que usará la interfaz del cliente final", "C": "El tipo de proyecto, el tamaño del equipo y la estabilidad de requisitos", "D": "El sistema operativo y la marca de los equipos de cómputo del cliente"}, "ok": "C", "porque": "La caracterización de la solución aporta los criterios con los que se compara y elige la metodología.", "falla": {"A": "Es una decisión prematura de diseño, no una característica que oriente la metodología.", "B": "Es un detalle visual que no incide en cómo se planea el análisis.", "D": "Es un dato de infraestructura, ajeno a la selección de metodología."}}, {"n": 8, "rap": "592375", "nivel": "Intermedia", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "El plan de análisis de un equipo dice solamente «usaremos Scrum». Para cumplir el criterio «seleccionar metodología», ¿qué le falta?", "opts": {"A": "El código fuente del primer sprint ya funcionando de punta a punta en pruebas", "B": "El diagrama de clases completo del sistema con todos sus atributos", "C": "La firma del cliente en cada una de las historias de usuario", "D": "Justificarla con las características del proyecto frente a otras metodologías posibles"}, "ok": "D", "porque": "Seleccionar implica comparar alternativas y argumentar con base en las características de la solución.", "falla": {"A": "El código no es insumo de la selección; la decisión se toma antes.", "B": "Es un artefacto de modelado posterior, no una justificación metodológica.", "C": "Es un trámite que no argumenta por qué Scrum es la mejor opción."}}, {"n": 9, "rap": "592375", "nivel": "Avanzada", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Una entidad financiera tiene requisitos regulatorios fijos y auditoría documental por fase, pero ignora qué interfaz prefieren sus usuarios. ¿Qué enfoque de planeación es más defendible?", "opts": {"A": "Fases documentadas tipo RUP y prototipos iterativos para la interfaz, con la mezcla justificada", "B": "XP puro y sin documentación, porque la auditoría no afecta el análisis del software", "C": "Cascada estricta, congelando la interfaz desde el inicio sin validarla con los usuarios", "D": "Cambiar de metodología cada semana según lo que prefiera el equipo de desarrollo en ese momento"}, "ok": "A", "porque": "Cada parte del problema pide su enfoque: control documental donde hay certeza y prototipado donde hay incertidumbre.", "falla": {"B": "La auditoría documental es una restricción real; suprimir documentos incumple el requisito.", "C": "Ignora la incertidumbre de la interfaz y arriesga rechazo tardío.", "D": "La metodología se selecciona con criterios y se mantiene; cambiarla sin control desordena el plan."}}, {"n": 10, "rap": "592375", "nivel": "Avanzada", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "En un sprint de tres semanas, a mitad del segundo sprint el Product Owner pide una funcionalidad grande y nueva. ¿Qué es lo más coherente con Scrum?", "opts": {"A": "Registrarla en el backlog y priorizarla para un sprint posterior", "B": "Incluirla de inmediato en el sprint y ampliar su duración para acomodarla", "C": "Rechazarla de forma definitiva porque Scrum no admite ningún tipo de cambio", "D": "Dejar que el Scrum Master la priorice y la asigne al equipo por su cuenta"}, "ok": "A", "porque": "El objetivo del sprint se protege; lo nuevo entra al backlog y se prioriza para próximos sprints.", "falla": {"B": "Alterar la duración del sprint rompe la cadencia y el compromiso del equipo.", "C": "Scrum sí admite cambios, pero a través del backlog y no dentro del sprint en curso.", "D": "Priorizar es responsabilidad del Product Owner, no del Scrum Master."}}, {"n": 11, "rap": "592375", "nivel": "Avanzada", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Una startup debe validar su idea con usuarios reales en tres semanas y elige RAD. ¿Qué riesgo debe quedar previsto en el plan de análisis?", "opts": {"A": "Que el equipo no cuente con ningún prototipo que mostrar a los usuarios en las pruebas", "B": "Que el cliente no pueda intervenir en ningún momento del desarrollo", "C": "Que la metodología imponga un cronograma de análisis de varios años", "D": "Que el prototipo pase a producción sin requisitos consolidados ni documentación"}, "ok": "D", "porque": "El riesgo típico de RAD es convertir prototipos en producto sin consolidar requisitos ni documentar.", "falla": {"A": "RAD produce prototipos por definición; ese no es su riesgo característico.", "B": "RAD exige participación constante del usuario; el riesgo es el opuesto.", "C": "RAD busca ciclos muy cortos, no cronogramas largos."}}, {"n": 12, "rap": "592375", "nivel": "Avanzada", "caso": true, "seccion": "Tema 1. Metodologías de desarrollo y planeación del análisis (RAP 592375: planear actividades de análisis)", "stem": "Un plan de análisis dice usar XP, pero su cronograma tiene doce semanas de análisis y una sola entrega final. ¿Qué incoherencia presenta?", "opts": {"A": "XP no admite ningún tipo de cronograma, por lo que este plan sobra por completo", "B": "Un cronograma lineal con una sola entrega final contradice las entregas pequeñas y frecuentes de XP", "C": "XP exige que la fase de análisis dure exactamente doce semanas antes de programar", "D": "No hay incoherencia, porque la metodología elegida no afecta el cronograma del análisis"}, "ok": "B", "porque": "XP propone entregas cortas y frecuentes; el cronograma descrito corresponde a un enfoque secuencial.", "falla": {"A": "XP sí planifica, pero por iteraciones cortas; no prohíbe el cronograma.", "C": "XP no fija una duración de análisis.", "D": "La metodología determina la cadencia de entregas; sí afecta el cronograma."}}, {"n": 13, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "¿Qué representa un actor en un diagrama de casos de uso?", "opts": {"A": "Una clase del código que existe dentro del sistema y guarda sus datos persistentes", "B": "Un rol externo al sistema que interactúa con él para lograr un objetivo", "C": "Una pantalla del sistema con la que el usuario interactúa a diario en su trabajo", "D": "El programador que construye y mantiene el caso de uso en el código fuente"}, "ok": "B", "porque": "Un actor es un rol fuera de la frontera del sistema, sea persona, sistema o dispositivo.", "falla": {"A": "Los actores están fuera de la frontera; las clases son internas.", "C": "Una pantalla es parte de la interfaz, no un rol.", "D": "El actor se define por su interacción con el sistema, no por quien lo desarrolla."}}, {"n": 14, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "¿Qué relación indica que un caso de uso siempre incluye el comportamiento de otro?", "opts": {"A": "Relación «include» entre los dos casos", "B": "Relación «extend» entre los dos casos", "C": "Generalización entre dos actores", "D": "Multiplicidad 1..* entre dos clases"}, "ok": "A", "porque": "«include» expresa comportamiento obligatorio reutilizado por el caso base.", "falla": {"B": "«extend» es comportamiento opcional o condicional, no obligatorio.", "C": "Relaciona actores entre sí, no casos con comportamiento incluido.", "D": "La multiplicidad es de asociaciones entre clases, no una relación entre casos de uso."}}, {"n": 15, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "¿Cuál es un nombre correcto para un caso de uso?", "opts": {"A": "Base de datos de préstamos", "B": "Registrar préstamo de libro", "C": "Botón guardar del formulario", "D": "El bibliotecario del turno"}, "ok": "B", "porque": "Un caso de uso es una función con valor para un actor y se nombra con verbo y objeto.", "falla": {"A": "Es un componente de almacenamiento, no una función.", "C": "Es un elemento de interfaz, no un objetivo del actor.", "D": "Es un actor, no un caso de uso."}}, {"n": 16, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "¿Cuál de los siguientes es un requisito no funcional?", "opts": {"A": "El sistema permite registrar clientes nuevos desde el módulo web", "B": "Toda consulta responde en menos de dos segundos", "C": "El administrador genera el reporte mensual de ventas", "D": "El usuario cancela una reserva antes de su fecha"}, "ok": "B", "porque": "El tiempo de respuesta es una cualidad (rendimiento), por lo tanto no funcional.", "falla": {"A": "Describe una función; es requisito funcional.", "C": "Describe una función del actor; es funcional.", "D": "Describe una función; es funcional."}}, {"n": 17, "rap": "592373", "nivel": "Intermedia", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "Un cliente puede hacer cero o muchos pedidos y cada pedido pertenece a un solo cliente. ¿Cuál es la multiplicidad correcta? (Cada valor indica cuántas instancias de esa clase se relacionan con una instancia de la otra.)", "opts": {"A": "Cliente 0..*, Pedido 1", "B": "Cliente 1..<i>, Pedido 1..<\/i>", "C": "Cliente 0..1, Pedido 1", "D": "Cliente 1, Pedido 0..*"}, "ok": "D", "porque": "Un pedido tiene exactamente un cliente (1) y un cliente tiene de cero a muchos pedidos (0..*).", "falla": {"A": "Invierte los extremos: sugiere que un pedido tiene muchos clientes.", "B": "Exige que cada pedido tenga varios clientes y que todo cliente tenga pedidos.", "C": "Permite pedidos sin cliente y limita a uno los pedidos por cliente."}}, {"n": 18, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "En una factura, cada línea de detalle no tiene existencia si se borra la factura. ¿Qué relación las une?", "opts": {"A": "Agregación, porque la factura solo agrupa líneas que son independientes de ella", "B": "Herencia, porque la línea es un tipo especial de factura", "C": "Composición, porque las líneas dependen de la vida de la factura", "D": "Dependencia, porque la factura usa las líneas por un momento"}, "ok": "C", "porque": "Si la parte no puede existir sin el todo, la relación es composición.", "falla": {"A": "La agregación admite que las partes existan por separado, lo que aquí no ocurre.", "B": "La línea no es una factura; es parte de ella.", "D": "La dependencia es un uso transitorio, no una relación de contención."}}, {"n": 19, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "En el caso «Retirar dinero» de un cajero, ¿cuál es una postcondición?", "opts": {"A": "El saldo queda reducido en el valor retirado y la transacción queda registrada en el sistema", "B": "El cliente insertó su tarjeta y digitó correctamente la clave personal", "C": "El cliente ya se autenticó en el cajero antes de pedir el retiro", "D": "El cajero dispone de conexión activa con el banco al iniciar el caso de uso"}, "ok": "A", "porque": "La postcondición es el estado en que queda el sistema al terminar con éxito.", "falla": {"B": "Es una precondición: ocurre antes de empezar el caso.", "C": "Es una precondición: el cliente ya se autenticó antes de empezar el caso, no es el estado final. (El saldo suficiente no es precondición: lo comprueba el sistema durante el caso y va como flujo alterno; ver pregunta 38.)", "D": "Es una condición de partida, no un resultado."}}, {"n": 20, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "En el caso «Pagar pedido», una pasarela de pagos externa responde al sistema. ¿Cómo se modela?", "opts": {"A": "Como un caso de uso llamado Pasarela de pagos", "B": "Como actor secundario asociado al caso de uso", "C": "Como un atributo de la clase Pedido", "D": "No se modela, por estar fuera del sistema"}, "ok": "B", "porque": "Un sistema externo con el que se interactúa se modela como actor, en este caso secundario.", "falla": {"A": "La pasarela no es una función del sistema; es un participante externo.", "C": "Un sistema externo no es un dato de la clase; se pierde la interacción.", "D": "Precisamente por estar fuera se modela como actor para mostrar la interacción."}}, {"n": 21, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "Aplicar un cupón de descuento ocurre solo si el cliente lo decide durante «Realizar compra». ¿Cómo se representa?", "opts": {"A": "«include» desde Realizar compra hacia Aplicar cupón en cada compra", "B": "Aplicar cupón como actor externo asociado al caso de uso Realizar compra", "C": "«extend» de Aplicar cupón hacia Realizar compra, con un punto de extensión", "D": "Realizar compra como especialización del caso de uso Aplicar cupón"}, "ok": "C", "porque": "Un comportamiento opcional y condicional se modela con «extend».", "falla": {"A": "«include» es obligatorio; aquí el cupón es opcional.", "B": "El cupón es una función, no un rol externo.", "D": "La compra no es un tipo de cupón; la generalización no aplica."}}, {"n": 22, "rap": "592373", "nivel": "Intermedia", "caso": false, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "En un diagrama de casos de uso, ¿qué queda dentro del rectángulo de frontera del sistema?", "opts": {"A": "Los actores y los casos de uso por igual", "B": "Solo las clases con sus atributos y métodos", "C": "Los actores; los casos de uso quedan fuera", "D": "Los casos de uso; los actores quedan fuera"}, "ok": "D", "porque": "La frontera delimita lo que el sistema hace; los actores son externos.", "falla": {"A": "Un actor dentro de la frontera sería parte del sistema, lo cual es un error.", "B": "Las clases pertenecen al diagrama de clases, no al de casos de uso.", "C": "Invierte el criterio de frontera."}}, {"n": 23, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "El SRS tiene el requisito «Gestionar clientes» y el diagrama muestra cuatro casos: Crear, Leer, Actualizar y Eliminar cliente. Ninguna operación tiene reglas, actores ni flujos distintos de las otras. ¿Cuál es el mejor ajuste?", "opts": {"A": "Agruparlos en «Gestionar clientes» y detallar las operaciones en la plantilla extendida", "B": "Mantenerlos como cuatro casos separados, porque cada operación es otro objetivo del actor", "C": "Quitar el actor del diagrama para que quede más compacto y fácil de leer", "D": "Convertir los cuatro casos en cuatro clases del modelo de dominio del sistema"}, "ok": "A", "porque": "Un caso de uso es un objetivo del actor; como el enunciado aclara que ninguna operación tiene reglas ni actores distintos, se agrupan (ver arbitraje en las rúbricas).", "falla": {"B": "Fragmenta el diagrama en acciones técnicas y no en objetivos con valor para el actor.", "C": "Sin actor no hay caso de uso; se pierde quién obtiene el valor.", "D": "Mezcla artefactos: los casos son funciones, las clases son conceptos del negocio."}}, {"n": 24, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "Cada noche el sistema envía recordatorios de matrícula sin intervención humana. ¿Cómo se modela ese caso de uso?", "opts": {"A": "Con un actor reloj que dispara cada noche el caso de uso", "B": "No se modela, porque los procesos automáticos carecen de caso de uso", "C": "Con el administrador como actor, aunque nunca interviene en el envío", "D": "Como «include» de otro caso, sin que exista caso base"}, "ok": "A", "porque": "Los procesos automáticos también tienen un iniciador; el tiempo se modela como actor.", "falla": {"B": "Es una función del sistema con valor; omitirla deja un requisito sin cubrir.", "C": "Asigna a un actor que no participa; la asociación sería falsa.", "D": "Un «include» necesita un caso base que lo invoque."}}, {"n": 25, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "El coordinador puede hacer todo lo que hace el docente y además aprobar notas. ¿Cómo se refleja en el diagrama?", "opts": {"A": "«include» dibujado desde el actor Docente hacia el actor Coordinador del sistema", "B": "Agregación entre Docente y Coordinador, con el Coordinador como el todo", "C": "Generalización de actores: Coordinador especializa a Docente y agrega Aprobar notas", "D": "«extend» entre los dos actores con un punto de extensión en el Docente"}, "ok": "C", "porque": "La generalización entre actores expresa que un rol hereda las funciones de otro.", "falla": {"A": "«include» solo relaciona casos de uso, no actores.", "B": "La agregación es de clases por contención; no expresa herencia de funciones.", "D": "«extend» es entre casos de uso, no entre actores."}}, {"n": 26, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 2. Análisis orientado a objetos y casos de uso (RAP 592373: modelar las funciones del software)", "stem": "Un diagrama muestra Realizar pedido «include» Verificar stock y, a la vez, Verificar stock «include» Realizar pedido. ¿Qué defecto tiene?", "opts": {"A": "Falta el actor, porque todo «include» debe asociarse a un actor propio dentro del diagrama", "B": "Ninguno, porque «include» admite relaciones en ambos sentidos a la vez", "C": "El nombre «Verificar stock» debería escribirse como un sustantivo", "D": "Dependencia circular entre los casos incluidos: sin punto de inicio"}, "ok": "D", "porque": "Dos casos que se incluyen mutuamente forman un ciclo; el flujo no tiene punto de partida.", "falla": {"A": "Los «include» se dan entre casos; el actor se asocia al caso base.", "B": "«include» es dirigido y no admite ciclos.", "C": "Los casos de uso se nombran con verbo; el nombre es correcto."}}, {"n": 27, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "¿Qué muestra un diagrama de actividades asociado a un caso de uso?", "opts": {"A": "El flujo de acciones, decisiones y condiciones que sigue el caso", "B": "La estructura de tablas, claves y relaciones de la base de datos", "C": "Los servidores y nodos donde se despliega la aplicación", "D": "Los mensajes entre objetos ordenados en el tiempo"}, "ok": "A", "porque": "Detalla el flujo del caso: acciones, decisiones, caminos alternos y finales.", "falla": {"B": "Eso corresponde al modelo entidad-relación o al esquema físico.", "C": "Eso corresponde a un diagrama de despliegue.", "D": "Eso corresponde a un diagrama de secuencia."}}, {"n": 28, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En un diagrama de actividades, ¿qué representa un rombo con una entrada y dos salidas rotuladas [sí] y [no]?", "opts": {"A": "Un nodo inicial", "B": "Una bifurcación en paralelo", "C": "Una acción final", "D": "Un nodo de decisión"}, "ok": "D", "porque": "El rombo con condiciones de guarda en cada salida es una decisión.", "falla": {"A": "El nodo inicial es un círculo sólido sin entradas.", "B": "La bifurcación se dibuja como barra y activa flujos simultáneos.", "C": "La acción final es un círculo con borde y no tiene salidas."}}, {"n": 29, "rap": "592373", "nivel": "Básica", "caso": false, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "¿Qué contiene la plantilla extendida que no aparece en una descripción breve de caso de uso?", "opts": {"A": "El código fuente de las clases que implementan cada paso del caso de uso", "B": "El diagrama de despliegue con los servidores y nodos de la solución", "C": "El costo estimado y el cronograma de ejecución de cada caso de uso", "D": "Precondiciones, flujos alternos, excepciones y postcondiciones propios del caso"}, "ok": "D", "porque": "La plantilla extendida detalla las condiciones y los caminos alternos del caso.", "falla": {"A": "El código no hace parte del análisis.", "B": "Es un artefacto de arquitectura.", "C": "Es información de gestión; no forma parte de la plantilla."}}, {"n": 30, "rap": "592373", "nivel": "Intermedia", "caso": false, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "¿Qué caracteriza a un modelo de dominio?", "opts": {"A": "Define métodos, visibilidad y tipos de datos del lenguaje de programación", "B": "Detalla tablas, índices y claves foráneas del motor de base de datos elegido", "C": "Representa conceptos del negocio y sus relaciones, sin detalles técnicos", "D": "Muestra las pantallas y el orden de navegación entre ellas para el usuario"}, "ok": "C", "porque": "El dominio modela el negocio en clases conceptuales con atributos relevantes y asociaciones.", "falla": {"A": "Eso corresponde a un diagrama de clases de diseño.", "B": "Eso corresponde al modelo de datos físico.", "D": "Eso corresponde al prototipo o mapa de navegación."}}, {"n": 31, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En un sistema de biblioteca, ¿cuál es una buena clase conceptual para el modelo de dominio?", "opts": {"A": "Botón Prestar de la ventana principal del sistema", "B": "Servidor MySQL en el que se aloja la biblioteca", "C": "Método calcularMulta() que se ejecuta sobre el préstamo", "D": "Préstamo, con fecha de salida y fecha de devolución"}, "ok": "D", "porque": "Préstamo es un concepto del negocio con atributos propios.", "falla": {"A": "Es un elemento de interfaz, no un concepto del negocio.", "B": "Es infraestructura, no un concepto del dominio.", "C": "Es un comportamiento de diseño, no una clase conceptual."}}, {"n": 32, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "Un diagrama de actividades de «Pagar pedido» tiene una decisión con una sola salida, [pago aprobado]. ¿Qué le falta?", "opts": {"A": "Un segundo actor que apruebe el pago antes de continuar con el flujo del caso", "B": "Una clase conceptual para cada salida de la decisión del flujo", "C": "La salida contraria, por ejemplo [pago rechazado], con su propio flujo", "D": "Un nodo de unión sin ninguna condición de guarda en sus flujos"}, "ok": "C", "porque": "Toda decisión necesita guardas que cubran todos los caminos posibles.", "falla": {"A": "El defecto es de flujo, no de actores.", "B": "Las salidas son caminos del flujo, no clases.", "D": "Una unión no resuelve que falte un camino de la decisión."}}, {"n": 33, "rap": "592373", "nivel": "Intermedia", "caso": false, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "¿Para qué sirven las calles o carriles (swimlanes) en un diagrama de actividades?", "opts": {"A": "Para indicar el orden de las tablas de la base de datos", "B": "Para marcar cuáles acciones son opcionales para el usuario", "C": "Para asignar cada acción al actor o sistema que la ejecuta", "D": "Para medir el tiempo que toma cada acción del proceso"}, "ok": "C", "porque": "Las calles organizan las acciones por responsable.", "falla": {"A": "No tienen relación con el modelo de datos.", "B": "Lo opcional se expresa con decisiones, no con carriles.", "D": "UML no usa carriles para medir tiempos."}}, {"n": 34, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En una plantilla extendida, el flujo principal dice: «El sistema ejecuta INSERT INTO prestamo en MySQL». ¿Cuál es el defecto?", "opts": {"A": "El flujo principal no debe estar numerado ni dividido en pasos cortos y claros", "B": "Falta indicar el lenguaje de programación con que se implementará", "C": "El INSERT debería detallar todas las columnas de la tabla afectada", "D": "Mezcla tecnología con análisis: el flujo debe expresar intención y respuesta del sistema"}, "ok": "D", "porque": "La plantilla describe la intención de las acciones, no la tecnología con la que se implementan.", "falla": {"A": "Numerar los pasos es buena práctica.", "B": "Añadiría más detalle técnico, el mismo error.", "C": "Profundiza el error: introduce estructura de datos en el análisis."}}, {"n": 35, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "La plantilla de «Registrar préstamo» menciona una Multa, pero el modelo de dominio no tiene esa clase. ¿Qué hallazgo corresponde?", "opts": {"A": "No hay hallazgo, porque el dominio solo contiene clases con sus métodos ya definidos y completos", "B": "Eliminar la Multa del requisito para que coincida con el modelo de dominio", "C": "Registrar la Multa como un actor externo asociado al caso de uso", "D": "Inconsistencia entre artefactos: incorporar Multa al dominio o justificar su retiro"}, "ok": "D", "porque": "Los artefactos deben ser coherentes entre sí; la discrepancia se resuelve con el requisito como referencia.", "falla": {"A": "El dominio no lleva métodos; no explica la ausencia de un concepto usado.", "B": "Ajusta el requisito al modelo y no al revés, sin consultar al cliente.", "C": "La multa es un concepto del negocio, no un rol externo."}}, {"n": 36, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En un hospital, una cita une a un paciente con un médico y tiene fecha y motivo propios. ¿Cómo se modela mejor en el dominio?", "opts": {"A": "Como un atributo «cita» guardado dentro de la clase Paciente del sistema de la clínica", "B": "Como clase Cita asociada a Paciente y Médico, por tener atributos propios", "C": "Como un actor externo que agenda el médico en el sistema de la clínica", "D": "Como una subclase de Persona, junto con Paciente y Médico en el dominio"}, "ok": "B", "porque": "Un concepto con atributos y vida propia es una clase, no un simple atributo.", "falla": {"A": "No permite fecha y motivo propios ni varias citas con distintos médicos.", "C": "La cita es un concepto del negocio, no un rol.", "D": "La cita no es un tipo de persona."}}, {"n": 37, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En «Procesar pedido» el sistema debe cobrar y reservar stock al mismo tiempo, y solo cuando ambos terminan genera la factura. ¿Qué nodos se usan?", "opts": {"A": "Dos decisiones consecutivas y una acción final tras facturar", "B": "Una bifurcación (fork) al inicio y una unión (join) antes de facturar", "C": "Una bifurcación sin unión, para facturar apenas termine una", "D": "Un solo flujo secuencial: primero cobrar, luego reservar el stock y facturar"}, "ok": "B", "porque": "La bifurcación abre flujos concurrentes y la unión espera que todos terminen.", "falla": {"A": "Las decisiones eligen un camino, no ejecutan flujos simultáneos.", "C": "No cumple la regla de esperar a que ambas ramas terminen.", "D": "No expresa la ejecución simultánea que pide el caso."}}, {"n": 38, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 3. Diagramas de actividades, plantillas extendidas y modelo de dominio (RAP 592373: modelar las funciones del software)", "stem": "En «Retirar dinero», el sistema debe rechazar la operación si el saldo es insuficiente. ¿Dónde se documenta mejor?", "opts": {"A": "Como un actor nuevo llamado Saldo, que interactúa con el cajero del banco", "B": "Solo como  "D": "Relacionaría la entidad consigo misma, no dos entidades distintas."}}, {"n": 41, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "Los estudiantes se matriculan en varios cursos, cada curso tiene varios estudiantes y la matrícula guarda fecha y nota. ¿Cómo se representa en el MER?", "opts": {"A": "Con la clave del curso repetida como columna dentro de Estudiante", "B": "Con una sola entidad que guarda los cursos separados por comas", "C": "Como relación N:M con una entidad asociativa Matrícula que guarda fecha y nota", "D": "No se representa, porque el MER no admite relaciones N:M"}, "ok": "C", "porque": "Cuando la relación N:M lleva atributos propios (fecha y nota), se representa con una entidad asociativa que une a ambas partes.", "falla": {"A": "Fuerza un solo curso por estudiante y duplica datos.", "B": "Viola la atomicidad de los atributos.", "D": "El MER sí admite relaciones N:M; cuando llevan atributos propios, se modelan con una entidad asociativa."}}, {"n": 42, "rap": "592373", "nivel": "Intermedia", "caso": false, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "¿Cuál es el mejor identificador para la entidad Persona?", "opts": {"A": "El nombre completo, que identifica de manera única a cada persona", "B": "El número de documento, único y estable en el tiempo", "C": "El número de teléfono, que cada quien conoce", "D": "La edad, que distingue a unas personas de otras"}, "ok": "B", "porque": "Un buen identificador es único, obligatorio y estable.", "falla": {"A": "Los nombres se repiten.", "C": "Cambia y puede compartirse.", "D": "Cambia cada año y se repite."}}, {"n": 43, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "Un cliente puede tener varios teléfonos. ¿Cómo se trata ese atributo multivalor?", "opts": {"A": "Como un único atributo con teléfonos separados por comas", "B": "Duplicando el cliente por cada teléfono que tenga", "C": "Como una entidad Teléfono ligada 1:N a Cliente", "D": "Eliminando el teléfono porque es un dato opcional"}, "ok": "C", "porque": "Un atributo multivalor se convierte en entidad para evitar repeticiones.", "falla": {"A": "Viola la atomicidad y complica las consultas.", "B": "Genera redundancia e inconsistencias.", "D": "Descarta un dato que el negocio requiere."}}, {"n": 44, "rap": "592373", "nivel": "Intermedia", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "Cada pedido debe tener un cliente; un cliente puede existir sin pedidos. ¿Qué participación corresponde?", "opts": {"A": "Total para Pedido y parcial para Cliente, según el enunciado", "B": "Parcial para Pedido y total para Cliente, sin excepción", "C": "Total para ambos, pues los dos extremos son obligatorios en el modelo", "D": "Parcial para ambos, pues los dos extremos son opcionales"}, "ok": "A", "porque": "Pedido no existe sin cliente (total); cliente sí existe sin pedidos (parcial).", "falla": {"B": "Invierte la obligatoriedad.", "C": "Obligaría a todo cliente a tener al menos un pedido.", "D": "Permitiría pedidos sin cliente."}}, {"n": 45, "rap": "592373", "nivel": "Avanzada", "caso": false, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "¿Cuál afirmación distingue correctamente el modelo de dominio del modelo entidad-relación?", "opts": {"A": "Son el mismo artefacto, y solo cambia la notación con la que se dibuja cada uno", "B": "El MER incluye los métodos de cada entidad y el dominio no los incluye", "C": "El dominio describe el negocio; el MER, los datos que se almacenan", "D": "El dominio se elabora después de construir el esquema físico de datos"}, "ok": "C", "porque": "Responden a necesidades distintas: entender el negocio frente a estructurar datos persistentes.", "falla": {"A": "Tienen propósito y nivel de detalle distintos.", "B": "Ninguno de los dos modela métodos.", "D": "El dominio se hace en análisis, antes que el esquema físico."}}, {"n": 46, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "El requisito dice «un docente dirige varias fichas y cada ficha tiene un solo docente líder», pero el MER muestra una relación 1:1. ¿Qué corresponde?", "opts": {"A": "Cambiarla a N:M, para permitir más de un docente líder por cada ficha existente", "B": "Dejarla en 1:1, porque es la relación más sencilla de implementar luego", "C": "Corregir a 1:N de Docente a Ficha, porque el 1:1 limita al docente a una sola ficha", "D": "Eliminar la entidad Docente del modelo y dejar solo la entidad Ficha"}, "ok": "C", "porque": "El MER debe responder al requisito; el 1:1 contradice la cardinalidad pedida.", "falla": {"A": "Contradice el «un solo docente líder».", "B": "La sencillez no justifica incumplir el requisito.", "D": "Pierde información que el requisito sí exige."}}, {"n": 47, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "Una línea de factura solo existe con su factura y se identifica por número de factura más número de línea. ¿Qué tipo de entidad es?", "opts": {"A": "Entidad fuerte, con clave propia e independiente de Factura", "B": "Entidad débil, con identificador parcial que depende de Factura", "C": "Atributo compuesto de la entidad Cliente de la factura", "D": "Relación reflexiva que une la entidad Factura consigo misma en el modelo"}, "ok": "B", "porque": "Su identificación depende de otra entidad: es una entidad débil.", "falla": {"A": "Si fuera fuerte, no dependería de la factura.", "C": "No es un dato del cliente.", "D": "La relación es entre dos entidades distintas."}}, {"n": 48, "rap": "592373", "nivel": "Avanzada", "caso": true, "seccion": "Tema 4. Modelo entidad-relación (RAP 592373: modelar las funciones del software)", "stem": "Todo empleado, salvo el gerente general, tiene un jefe que también es empleado. ¿Cómo se modela?", "opts": {"A": "Con dos entidades idénticas, Jefe y Empleado, relacionadas N:M entre sí", "B": "Como relación recursiva 1:N sobre Empleado: un jefe supervisa varios", "C": "Con un atributo «jefe» de texto libre dentro de la entidad Empleado", "D": "Con una relación 1:1 recursiva: cada jefe supervisa a un solo empleado"}, "ok": "B", "porque": "Una relación entre instancias de la misma entidad es recursiva.", "falla": {"A": "Duplica la entidad y genera redundancia.", "C": "Pierde la integridad referencial.", "D": "Limitaría a cada jefe a un solo subordinado."}}, {"n": 49, "rap": "592374", "nivel": "Básica", "caso": false, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "¿Qué es una lista de chequeo para la validación del análisis?", "opts": {"A": "Un instrumento con criterios y el registro de si se cumplen", "B": "Un diagrama que muestra el flujo de acciones de un caso de uso", "C": "Un informe final con el costo total y los plazos del proyecto", "D": "Un prototipo de pantalla con funcionalidad real para el usuario"}, "ok": "A", "porque": "Permite verificar de forma sistemática y dejar evidencia de cada criterio.", "falla": {"B": "Eso es un diagrama de actividades.", "C": "Es un documento de gestión, no un instrumento de verificación.", "D": "El prototipo es otro artefacto."}}, {"n": 50, "rap": "592374", "nivel": "Básica", "caso": false, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "¿Qué es la trazabilidad en el análisis?", "opts": {"A": "El registro de las horas trabajadas por cada integrante del equipo", "B": "El vínculo entre cada requisito y los artefactos que lo atienden", "C": "El historial de commits del repositorio del equipo de análisis", "D": "La copia de seguridad de todos los diagramas y documentos"}, "ok": "B", "porque": "Permite saber qué artefactos cubren cada requisito y viceversa.", "falla": {"A": "Es control de esfuerzo, no trazabilidad.", "C": "Registra cambios de archivos, no la cobertura de requisitos.", "D": "Es respaldo, no relación entre artefactos y requisitos."}}, {"n": 51, "rap": "592374", "nivel": "Básica", "caso": false, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "¿Para qué se elabora un prototipo inicial (mockup) en el análisis?", "opts": {"A": "Para entregar la versión final programada del sistema al cliente", "B": "Para definir el esquema físico de la base de datos del sistema", "C": "Para sustituir el manual de usuario del producto terminado", "D": "Para validar un requisito con el usuario mediante un bosquejo"}, "ok": "D", "porque": "El mockup permite confirmar el entendimiento de un requisito antes de construir.", "falla": {"A": "Un mockup no es software funcional.", "B": "Es una tarea de diseño de datos.", "C": "El manual es posterior y de otra naturaleza."}}, {"n": 52, "rap": "592374", "nivel": "Intermedia", "caso": false, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "¿Qué debe incluir un informe de análisis?", "opts": {"A": "Únicamente el código fuente y los scripts de la base de datos", "B": "Requisitos interpretados, modelos elaborados y su verificación", "C": "Únicamente las capturas de pantalla del prototipo inicial", "D": "El plan de despliegue y la configuración del servidor final de producción"}, "ok": "B", "porque": "Recoge lo analizado, los modelos y el resultado de verificarlos contra los requisitos.", "falla": {"A": "Es producto de construcción.", "C": "Insuficiente: omite requisitos y modelos.", "D": "Pertenece a fases posteriores."}}, {"n": 53, "rap": "592374", "nivel": "Intermedia", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "¿Cuál de estos criterios de una lista de chequeo es verificable?", "opts": {"A": "El diagrama de casos de uso tiene una presentación profesional y ordenada", "B": "Cada requisito funcional del SRS aparece en algún caso de uso (sí/no)", "C": "Los casos de uso están bien elaborados en términos generales", "D": "El equipo trabajó con dedicación y puntualidad durante todo el análisis"}, "ok": "B", "porque": "Un criterio verificable se puede responder con sí o no y se comprueba con evidencia.", "falla": {"A": "Es subjetivo; no tiene evidencia objetiva.", "C": "Es ambiguo; no permite una respuesta objetiva.", "D": "Mide esfuerzo, no calidad del artefacto."}}, {"n": 54, "rap": "592374", "nivel": "Intermedia", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "La matriz de trazabilidad muestra que RF-07 no tiene ningún caso de uso asociado. ¿Qué corresponde hacer?", "opts": {"A": "Aceptarlo tal cual: no todos los requisitos necesitan ser modelados", "B": "Borrar RF-07 del SRS para que la matriz quede completa y sin vacíos ni dudas", "C": "Asociarlo a un caso de uso ajeno para dejar la matriz sin huecos", "D": "Tratarlo como requisito sin cubrir: modelarlo o justificar su exclusión"}, "ok": "D", "porque": "Un requisito sin artefacto es un hallazgo; se cubre o se justifica formalmente.", "falla": {"A": "Sin justificación se pierde cobertura.", "B": "Modifica el requisito sin autorización.", "C": "Falsea la trazabilidad."}}, {"n": 55, "rap": "592374", "nivel": "Intermedia", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "Al aplicar la lista de chequeo se hallan seis incumplimientos. ¿Cuál es el paso siguiente?", "opts": {"A": "Marcarlos como cumplidos para cerrar la fase dentro del plazo previsto", "B": "Entregar sin cambios y dejarlos anotados para la fase de diseño", "C": "Registrar los hallazgos con su evidencia, ajustar los artefactos y verificar de nuevo", "D": "Reemplazar la lista por una más corta que el equipo sí cumpla"}, "ok": "C", "porque": "Verificar implica registrar, corregir y comprobar que la corrección funcionó.", "falla": {"A": "Falsea la verificación.", "B": "Traslada defectos de análisis a la siguiente fase.", "D": "Manipula el instrumento para no corregir."}}, {"n": 56, "rap": "592374", "nivel": "Intermedia", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "En el prototipo aparece una pantalla «Reportes» que no corresponde a ningún caso de uso. ¿Cuál es la interpretación correcta?", "opts": {"A": "Es correcto: un mockup puede mostrar cualquier pantalla del producto final", "B": "Solo falta una clase en el modelo de dominio para esa pantalla", "C": "El defecto es que el mockup no es de alta fidelidad visual", "D": "Hay funcionalidad sin requisito o falta un caso de uso por documentar"}, "ok": "D", "porque": "Una pantalla sin caso de uso rompe la trazabilidad y debe revisarse.", "falla": {"A": "El prototipo debe responder a los casos de uso.", "B": "El problema es la ausencia del caso de uso.", "C": "La fidelidad no es la causa del hallazgo."}}, {"n": 57, "rap": "592374", "nivel": "Avanzada", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "Una lista de chequeo declaró «cumple» el criterio de cobertura porque el análisis tenía 12 casos de uso, pero el requisito «notificar al instructor» no aparece en ningún artefacto. ¿Qué falla?", "opts": {"A": "El criterio cuenta artefactos y no mide la cobertura de cada requisito", "B": "Nada: contar con 12 casos de uso basta para dar el criterio por cumplido", "C": "Falta que el instructor aparezca como un actor en el diagrama de casos", "D": "Falta aumentar el número de casos de uso hasta llegar a quince o más"}, "ok": "A", "porque": "Un criterio de cobertura debe contrastar requisito por requisito, no contar artefactos.", "falla": {"B": "La cantidad no demuestra cobertura.", "C": "Aun así, el requisito seguiría sin flujo y sin dato que lo soporten.", "D": "Agregar casos al azar no garantiza cubrir el requisito."}}, {"n": 58, "rap": "592374", "nivel": "Avanzada", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "Dos informes de análisis: el A tiene diagramas muy vistosos que cubren el 60 % de los requisitos; el B, diagramas sencillos y consistentes que cubren el 95 %. ¿Cuál es mejor evaluado?", "opts": {"A": "El A, porque su calidad visual es superior a la del otro informe", "B": "El B, porque se evalúa la calidad de los artefactos y su cobertura", "C": "Ninguno, porque sin código fuente no es posible evaluar el análisis", "D": "Empatan, porque ambos informes contienen diagramas de análisis"}, "ok": "B", "porque": "El criterio de evaluación pide calidad de los artefactos y respuesta al cumplimiento de requisitos.", "falla": {"A": "La presentación no compensa la baja cobertura.", "C": "El análisis se evalúa por sus artefactos, sin código.", "D": "Cumplir en forma no equivale a cumplir en fondo."}}, {"n": 59, "rap": "592374", "nivel": "Avanzada", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "Después de verificar, el cliente modifica el requisito RF-03. ¿Cómo ayuda la trazabilidad?", "opts": {"A": "Permite identificar los artefactos afectados y actualizarlos de forma consistente y ordenada", "B": "Evita que el cliente vuelva a modificar los requisitos en fases posteriores", "C": "Elimina la necesidad de volver a verificar los modelos una vez que fueron ajustados", "D": "Solo sirve para contar cuántos artefactos existen en el informe de análisis"}, "ok": "A", "porque": "Con los vínculos requisito-artefacto se mide el impacto y se ajusta lo necesario.", "falla": {"B": "La trazabilidad no controla al cliente.", "C": "Tras ajustar hay que verificar de nuevo.", "D": "Su valor es relacionar, no contar."}}, {"n": 60, "rap": "592374", "nivel": "Avanzada", "caso": true, "seccion": "Tema 5. Verificación, informe de análisis, trazabilidad y prototipo (RAP 592374: verificar los modelos del análisis)", "stem": "El diagrama de actividades de un caso tiene tres decisiones, pero su plantilla extendida solo registra un flujo alterno. ¿Qué hallazgo corresponde?", "opts": {"A": "Es aceptable, porque la plantilla puede omitir ramas del diagrama sin problema", "B": "Quitar dos de las decisiones del diagrama para igualar la plantilla", "C": "Inconsistencia: cada rama del diagrama debe quedar en la plantilla", "D": "Agregar más atributos a la clase correspondiente del modelo de dominio"}, "ok": "C", "porque": "Diagrama y plantilla describen el mismo caso y deben coincidir en sus caminos.", "falla": {"A": "Omitir ramas deja flujos sin documentar.", "B": "Empobrece el diagrama para ocultar la inconsistencia.", "D": "No resuelve la discrepancia entre los dos artefactos."}}]};
const M = D.meta, Q = D.preguntas, BY = Object.fromEntries(Q.map(q => [q.n, q]));
const KEY = 'banco-3413974-' + M.id;
const $ = s => document.querySelector(s);
let S = {ans: {}, wrong: {}, sims: [], tab: 'estudio'};
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = {rap: '', nivel: '', caso: false, pend: false};
let SIM = null, timer = null;

function head() {
  $('#kicker').textContent = 'Ficha 3413974 · Análisis y Desarrollo de Software · Guía ' + M.id.slice(1);
  $('#h1').textContent = M.titulo;
  $('#sub').textContent = M.sub;
  $('#meta').innerHTML = ['Competencia ' + M.norma, 'Prueba de conocimiento: ' + M.prueba, 'Entrega de productos: ' + M.entrega, 'Aprueba con 70 o más']
    .map(t => '<span class="pill">' + esc(t) + '</span>').join('');
  $('#how').innerHTML = '<h2>Cómo usar este banco</h2><ul>' +
    '<li><b>Estudio:</b> responde, mira si acertaste y lee por qué la correcta lo es y por qué fallan las otras. Intenta cada pregunta por tu cuenta antes de ver la explicación.</li>' +
    '<li><b>Simulacro:</b> 20 preguntas al azar en 40 minutos, sin ayudas, calificadas sobre 100 como la prueba real. Aprueba con 70.</li>' +
    '<li>La prueba del <b>' + esc(M.prueba) + '</b> se presenta en Moodle (Zajuna) con nota automática: algunas preguntas salen de este banco y otras son nuevas, del mismo nivel. Memorizar letras no sirve: las opciones se barajan.</li>' +
    '<li>Tu avance se guarda solo en este navegador.</li></ul>';
  $('#foot').textContent = 'SENA · Centro de la Industria, la Empresa y los Servicios · Banco de estudio de la Guía ' + M.id.slice(1) + ' · uso académico';
}

function stats() {
  const tot = Q.length, a = Object.keys(S.ans).length;
  const ok = Object.entries(S.ans).filter(([n, l]) => BY[n].ok === l).length;
  const best = S.sims.length ? Math.max(...S.sims.map(s => s.score)) : null;
  $('#statsPanel').innerHTML = '<div class="stats">' +
    '<div class="stat"><b>' + a + ' / ' + tot + '</b><span>Respondidas</span></div>' +
    '<div class="stat"><b>' + (a ? Math.round(ok * 100 / a) + ' %' : '—') + '</b><span>Aciertos en estudio</span></div>' +
    '<div class="stat"><b>' + Object.keys(S.wrong).length + '</b><span>Por repasar</span></div>' +
    '<div class="stat"><b>' + (best === null ? '—' : best + ' / 100') + '</b><span>Mejor simulacro</span></div></div>' +
    '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + tot + '" aria-valuenow="' + a + '"><i style="width:' + (a * 100 / tot) + '%"></i></div>' +
    '<div class="row"><button class="btn ghost" id="reset">Reiniciar mi avance</button></div>';
  $('#reset').onclick = () => { if (confirm('¿Borrar tus respuestas y tu avance en este navegador?')) { S = {ans: {}, wrong: {}, sims: [], tab: S.tab}; save(); render(); } };
}

function tabs() {
  const T = [['estudio', 'Estudio', Q.length], ['simulacro', 'Simulacro', ''], ['errores', 'Mis errores', Object.keys(S.wrong).length]];
  $('#tabs').innerHTML = T.map(([k, n, c]) => '<button class="tab" role="tab" aria-selected="' + (S.tab === k) + '" data-t="' + k + '">' + n + (c !== '' ? '<span class="c">' + c + '</span>' : '') + '</button>').join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; save(); render(); });
}

function chips(q) {
  return '<div class="qh"><span class="num">' + q.n + '</span><span class="chip">RAP ' + q.rap + '</span><span class="chip ' + q.nivel + '">' + q.nivel + '</span>' + (q.caso ? '<span class="chip caso">Caso</span>' : '') + '</div>';
}

// chosen: letra elegida o undefined; reveal: mostrar retroalimentación; interactive: permitir elegir
function card(q, chosen, reveal, interactive) {
  const opts = ['A', 'B', 'C', 'D'].map(l => {
    let cls = 'opt';
    if (reveal) { if (l === q.ok) cls += ' ok'; else if (l === chosen) cls += ' bad'; else cls += ' dim'; }
    else if (l === chosen) cls += ' sel';
    const dis = (reveal || !interactive) ? ' disabled' : '';
    const mark = reveal ? (l === q.ok ? ' <span class="sr" aria-label="correcta"></span>' : '') : '';
    return '<button class="' + cls + '" data-n="' + q.n + '" data-l="' + l + '"' + dis + ' aria-pressed="' + (l === chosen) + '"><span class="l">' + l + '</span><span class="t">' + q.opts[l] + mark + '</span></button>';
  }).join('');
  let fb = '';
  if (reveal) {
    const acierto = chosen === q.ok;
    fb = '<div class="fb ' + (acierto ? 'ok' : 'bad') + '"><h4>' + (chosen === undefined ? 'Respuesta correcta: ' + q.ok : acierto ? '¡Correcto!' : 'No es esa. La correcta es la ' + q.ok) + '</h4>' + q.porque + '</div>';
    const otras = ['A', 'B', 'C', 'D'].filter(l => l !== q.ok);
    fb += '<details' + (!acierto && chosen ? ' open' : '') + '><summary>Por qué fallan las otras opciones</summary><ul>' +
      otras.map(l => '<li><b>' + l + ')</b> ' + q.falla[l] + '</li>').join('') + '</ul></details>';
  }
  return '<article class="card" id="q' + q.n + '">' + chips(q) + '<p class="stem">' + q.stem + '</p><div class="opts" role="group" aria-label="Opciones de la pregunta ' + q.n + '">' + opts + '</div>' + fb + '</article>';
}

function raps() {
  const m = new Map(); Q.forEach(q => { if (!m.has(q.rap)) m.set(q.rap, q.seccion.replace(/^(Tema|Parte)\s*\d+\.\s*/, '').replace(/\s*\(RAP[^)]*\)\s*$/, '')); });
  return [...m.entries()];
}

function estudio() {
  const R = raps();
  let list = Q.filter(q => (!F.rap || q.rap === F.rap) && (!F.nivel || q.nivel === F.nivel) && (!F.caso || q.caso) && (!F.pend || !(q.n in S.ans)));
  const f = '<div class="panel filters"><label>RAP <select id="fRap"><option value="">Todos</option>' + R.map(([r, t]) => '<option value="' + r + '"' + (F.rap === r ? ' selected' : '') + '>' + r + ' · ' + esc(t.slice(0, 46)) + '</option>').join('') + '</select></label>' +
    '<label>Nivel <select id="fNivel"><option value="">Todos</option>' + ['Básica', 'Intermedia', 'Avanzada'].map(n => '<option' + (F.nivel === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select></label>' +
    '<label><input type="checkbox" id="fCaso"' + (F.caso ? ' checked' : '') + '> Solo casos</label>' +
    '<label><input type="checkbox" id="fPend"' + (F.pend ? ' checked' : '') + '> Solo sin responder</label>' +
    '<span style="margin-left:auto;color:var(--mut);font-size:13px">' + list.length + ' preguntas</span></div>';
  const body = list.length ? list.map(q => { const c = S.ans[q.n]; return card(q, c, c !== undefined, true) + (c !== undefined ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('') : '<div class="empty">No hay preguntas con ese filtro.</div>';
  $('#view').innerHTML = f + body;
  $('#fRap').onchange = e => { F.rap = e.target.value; render(); };
  $('#fNivel').onchange = e => { F.nivel = e.target.value; render(); };
  $('#fCaso').onchange = e => { F.caso = e.target.checked; render(); };
  $('#fPend').onchange = e => { F.pend = e.target.checked; render(); };
  bindOpts(false);
}

function errores() {
  const list = Q.filter(q => S.wrong[q.n]);
  $('#view').innerHTML = list.length ? '<p class="empty" style="padding:14px 0 0">Preguntas que fallaste en estudio o simulacro. Acierta una de nuevo y sale de esta lista.</p>' +
    list.map(q => { const c = S.ans[q.n]; const rev = c !== undefined && S.ans[q.n] !== undefined; return card(q, c, rev, true) + (rev ? '<div class="row"><button class="btn" data-retry="' + q.n + '">Reintentar</button></div>' : ''); }).join('')
    : '<div class="empty"><b>Nada por repasar.</b><br>Cuando falles una pregunta, aparecerá aquí.</div>';
  bindOpts(false);
}

function bindOpts(sim) {
  document.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
    const n = +b.dataset.n, l = b.dataset.l;
    if (sim) { SIM.ans[n] = l; simRender(); return; }
    S.ans[n] = l;
    if (l === BY[n].ok) delete S.wrong[n]; else S.wrong[n] = true;
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  });
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = () => { const n = +b.dataset.retry; delete S.ans[n]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
}

/* ---------- Simulacro ---------- */
function pick(arr, k) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); }
function simStart() {
  const by = n => Q.filter(q => q.nivel === n);
  const ids = pick(by('Básica'), 4).concat(pick(by('Intermedia'), 9), pick(by('Avanzada'), 7));
  SIM = {ids: pick(ids, ids.length).map(q => q.n), ans: {}, t0: Date.now(), dur: 40 * 60 * 1000, done: false};
  clearInterval(timer); timer = setInterval(tick, 1000); simRender();
}
function left() { return Math.max(0, SIM.dur - (Date.now() - SIM.t0)); }
function fmt(ms) { const s = Math.ceil(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tick() { if (!SIM || SIM.done) { clearInterval(timer); return; } const t = $('#tm'); if (t) t.textContent = fmt(left()); if (left() === 0) simFinish(); }
function simFinish() {
  if (!SIM || SIM.done) return; SIM.done = true; clearInterval(timer);
  let ok = 0; const porRap = {};
  SIM.ids.forEach(n => { const q = BY[n], a = SIM.ans[n]; const g = a === q.ok; if (g) ok++; porRap[q.rap] = porRap[q.rap] || [0, 0]; porRap[q.rap][1]++; if (g) porRap[q.rap][0]++; if (!g) S.wrong[n] = true; else if (!(n in S.ans) || S.ans[n] === q.ok) delete S.wrong[n]; });
  SIM.score = ok * 5; SIM.ok = ok; SIM.porRap = porRap;
  S.sims.push({score: SIM.score, fecha: new Date().toISOString().slice(0, 10)}); save(); stats(); tabs(); simRender();
}
function simRender() {
  if (!SIM) {
    $('#view').innerHTML = '<div class="panel"><h2 style="margin-top:0">Simulacro de la prueba de conocimiento</h2><p>20 preguntas al azar (4 básicas, 9 intermedias, 7 avanzadas), <b>40 minutos</b>, sin ver las respuestas hasta entregar. Se califica sobre 100 (5 puntos por pregunta) y se aprueba con <b>70</b>.</p><p style="color:var(--mut)">El reloj empieza al pulsar el botón. Si se acaba el tiempo, se entrega solo.</p><div class="row"><button class="btn primary" id="go">Empezar simulacro</button></div></div>';
    $('#go').onclick = simStart; return;
  }
  const qs = SIM.ids.map(n => BY[n]);
  if (!SIM.done) {
    const resp = Object.keys(SIM.ans).length;
    $('#view').innerHTML = '<div class="panel simbar"><span>Tiempo restante <span class="timer" id="tm">' + fmt(left()) + '</span></span><span>' + resp + ' / ' + qs.length + ' respondidas</span><button class="btn primary" id="fin">Entregar</button></div>' +
      qs.map((q, i) => card(Object.assign({}, q, {n: q.n}), SIM.ans[q.n], false, true).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
    bindOpts(true);
    $('#fin').onclick = () => { const f = qs.length - Object.keys(SIM.ans).length; if (!f || confirm('Te faltan ' + f + ' sin responder. ¿Entregar de todos modos?')) simFinish(); };
    return;
  }
  const pass = SIM.score >= 70;
  const filas = Object.entries(SIM.porRap).map(([r, [a, t]]) => '<tr><td>RAP ' + r + '</td><td>' + a + ' / ' + t + '</td></tr>').join('');
  $('#view').innerHTML = '<div class="panel"><div class="score ' + (pass ? 'pass' : 'fail') + '">' + SIM.score + ' / 100</div><p style="margin:6px 0 0"><b>' + (pass ? 'Aprobaste el simulacro.' : 'Aún no llegas a 70.') + '</b> ' + SIM.ok + ' de ' + qs.length + ' correctas.</p><table><thead><tr><th>Resultado de aprendizaje</th><th>Aciertos</th></tr></thead><tbody>' + filas + '</tbody></table><div class="row"><button class="btn primary" id="again">Hacer otro simulacro</button></div></div>' +
    qs.map((q, i) => card(q, SIM.ans[q.n], true, false).replace('<span class="num">' + q.n + '</span>', '<span class="num">' + (i + 1) + '</span>')).join('');
  $('#again').onclick = () => { SIM = null; simStart(); };
}

function render() {
  stats(); tabs();
  if (S.tab === 'estudio') estudio();
  else if (S.tab === 'errores') errores();
  else simRender();
}
head(); render();
</script>
</body>
</html>
