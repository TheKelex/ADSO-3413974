server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single page application: every unknown path serves the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy so the browser talks to one origin and the relative /api
  # base of the API client keeps working in production.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
