:root {

    --heat-lo: #172321; --heat-hi: #45cdbd; --t-lo: #e3eeec; --t-hi: #05211e; --zero: #476360; --bad-soft: #3d1813; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1312; --panel: #121b1a; --ink: #e3eeec; --muted: #8fa19e; --line: #233230; --line-soft: #1a2624;
  --accent: #47cfc0; --accent-soft: #143a36; --warn: #f0b24a; --warn-soft: #3a2b0b; --bad: #ff8a7d;
  --heat-lo: #172321; --heat-hi: #45cdbd; --t-lo: #e3eeec; --t-hi: #05211e; --zero: #476360; --bad-soft: #3d1813; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; padding-inline: 16px; padding-block: 20px 48px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
.wrap { max-width: 1480px; margin-inline: auto; display: grid; gap: 18px; min-width: 0; }
h1, h2, h3, p { margin: 0; text-wrap: balance; }
h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
.sub { color: var(--muted); }
.head { display: grid; gap: 6px; }
.head .meta { color: var(--muted); font-size: 13px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* pestañas */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs button { font: 600 14px var(--f-ui); color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.vista { display: grid; gap: 18px; min-width: 0; }

/* resumen */
.resumen { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.resumen .it { display: grid; }
.resumen .it b { font: 600 22px var(--f-num); font-variant-numeric: tabular-nums; }
.resumen .it span { color: var(--muted); font-size: 12px; }
.resumen .it b small { font-size: 13px; color: var(--warn); font-weight: 500; }

/* controles */
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px var(--f-ui); color: var(--muted); background: var(--panel); border: 0; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }

.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
select { font: 500 13px var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.leyenda { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.leyenda i { display: block; width: 120px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--heat-lo), var(--heat-hi)); border: 1px solid var(--line); }

.lista { display: grid; gap: 8px; }

      h("tbody", null, inf.componentes.map((c) => h("tr", null, h("td", null, c.nombre), h("td", { class: "n" }, c.max), h("td", null, textos[c.id]))))));
    const t1 = {
      cobertura: "30 × (repositorios con al menos un commit válido ÷ 6).",
      puntualidad: "15 × (repositorios cuyo último push fue hasta las 15:00 ÷ 6).",
      granularidad: "8 × (promedio de commits por repositorio − 1), entre 0 y 1. Un commit por repositorio da 0; dos o más dan el máximo.",
      constancia: "7 × (minutos entre el primer y el último commit ÷ 180), con tope en 1.",
      mensajes: "20 × calidad promedio del mensaje × min(1, commits válidos ÷ 6). Convención feat/fix/docs… con tres palabras o más vale 1; descriptivo de cuatro palabras o más vale 0,6; genérico («Add files via upload», «p2») vale 0; mencionar T-xx, HU-xx o CA-xx suma 0,15.",
      higiene: "20 × (repositorios con commits ÷ 6), menos 8 por node_modules, 6 por vendor/, 10 por un .env subido y 2 por dist/build. Nunca baja de 0.",
    };
    const t2 = {
      participacion: "20 si hay un commit en -docs entre 9:15 y 15:00 con cambios propios y el último push fue hasta las 15:00; 10 si el último push fue después; 0 si no hay trabajo.",
      amplitud: "25 × (documentos distintos del spec modificados + documentos nuevos, máximo 8) ÷ 10, con tope en 1.",
      profundidad: "20 × ln(1 + líneas propias) ÷ ln(1 + 2500). Líneas propias: agregadas en documentos modificados y en documentos de texto nuevos; no cuentan las copias del spec.",
      trazabilidad: "25 × (referencias distintas al spec en lo que escribió ÷ 60), con tope en 1. Referencias: HU-xx, CA-xx.x, T-xx, ADR-xxx, FK-x, RN-x, RNF-x, D-xx y «Artículo N».",
      adaptacion: "10 × (menciones de Laravel, React, Vite, PHP o Artisan en lo que escribió ÷ 150), con tope en 1. El reto pide llevar el spec a ese stack.",
    };
    const t3 = {
      api: "Laravel (3), 21 endpoints del contrato (10), prefijo /api/v1 (2), 6 tablas en singular (4; en plural valen la mitad), 16 columnas clave (5), 4 restricciones en la base (4), semilla de 5 categorías (2), 14 códigos de error (4), 4 reglas: 14 días, máximo 3, roles y token de 8 h (4), capas hexagonales (2).",
      app: "React (2), las 7 pantallas: login, catálogo, socios, préstamo, devolución, vencidos y reporte (9), consume /api/v1 (3), token Bearer (2), usa el cuerpo de error (2), distingue roles (2).",
      infra: "docker-compose (3), PostgreSQL 16 (3), servicios db, api y app (3), sin CREATE TABLE en infra según ADR-001 (3), variables DATABASE_URL, JWT_SECRET, ADMIN_* y CORS_ORIGIN (3).",
      tool: "Hay un sembrador (3), siembra por la API (5), sin SQL directo (3), las cantidades de T-21: 40 libros, 10 socios, 15 préstamos y 3 vencidos (4).",
      page: "index.html (3), no llama a la API (4), meta viewport (3). La calidad del sitio se mide aparte en el informe 4.",
    };
    const t4 = {
      existe: "Hay un index.html a las 15:00.",
      estatico: "No hay llamadas fetch, axios o XMLHttpRequest a la API. Mencionar «/api/v1» en un texto no cuenta como llamada.",
      responsive: "Meta viewport (5), reglas @media o clases responsive (5) y sin desborde horizontal a 375 px (5).",
      producto: "Nombra Manager Library (5) y presenta los 9 conceptos del producto: catálogo, socios, préstamos, devoluciones, vencidos, más prestados, categorías, reglas del préstamo y roles (25).",
      lenguaje: "10 si el texto visible menciona términos de la prueba (T-xx, HU-xx, spec, SDD, ficha, SENA, aprendiz) dos veces o menos; 5 hasta ocho veces; 0 si son más.",
      seguro: "No muestra usuario y contraseña de demostración ni tokens.",
      tecnica: "Idioma declarado, título, un solo h1, imágenes con alt y recursos locales completos (4 cada uno).",
    };
    const t5 = { api: "20 × promedio de T-01 a T-19.", app: "20 × pantallas de T-22 encontradas ÷ 7.", infra: "20 × (compose, PostgreSQL 16, servicio api, servicio app) ÷ 4, según T-20.",
      tool: "20 × (hay sembrador + usa la API + cantidades de T-21) ÷ 3.", page: "20 × (index + estático + responsive) ÷ 3, según T-23." };
    const t6 = { base: "100 × repositorios con producto a las 15:00 ÷ 5. Luego se restan las penalizaciones.", endpoints: "Rutas que no están en el contrato de la API.",
      tablas: "Tablas que no están entre las seis del modelo.", tablas_fw: "Tablas que agrega el framework (sesiones, colas, tokens).",
      columnas: "Columnas que no están en el modelo de su tabla.", auditoria: "created_at/updated_at: §8 decide no llevarlas. Se resta una sola vez.",
      conceptos: "Funciones excluidas por spec.md §2, en el código o en el texto del sitio.", tecnologia: "Otra base de datos, otro framework de frontend o un backend sin PHP.",
      servicios: "Servicios que el spec no pide en compose (redis, nginx, adminer, pgadmin…)." };
    const t7 = { cobertura: "100 × repositorios con código (api, app, tool, page) ÷ 4. Luego se aplican las penalizaciones en proporción.",
      identificadores: "Hasta −70: 70 × (identificadores en español ÷ total) ÷ 5 %. Desde un 5 % se aplica completa.",
      comentarios: "Hasta −30: 30 × (comentarios en español ÷ total) ÷ 50 %." };
    const TEXTOS = { i1: t1, i2: t2, i3: t3, i4: t4, i5: t5, i6: t6, i7: t7 };
    const DIM = Object.fromEntries(M.dimensiones.map((d) => [d.id, d.nombre]));
    return [
      h("section", { class: "panel" }, h("h2", null, "Cómo se calcula"),
        h("p", { class: "nota" }, "Cada informe puntúa de 0 a 100 y el acumulado es la suma (hoy máximo " + nf.format(maxAcum) + "). Los pesos son una propuesta: se pueden cambiar en construir.py y todo se recalcula. Los informes 1 y 2 miden actividad y rastro en el spec; del 3 al 7 se busca en el código y en el sitio, en su estado de las 15:00: hechos del spec (3), calidad del sitio (4), tareas de tasks.md (5), lo que sobra (6) y el idioma del código (7). Ninguno ejecuta el sistema."),
        M.informes.map((i) => [h("h3", null, "Informe " + i.num + " · " + i.corto + " (" + DIM[i.dimension] + ")"), tablaPesos(i, TEXTOS[i.id] || {})])),
      h("section", { class: "panel" }, h("h2", null, "Datos y límites"),
        h("ul", { class: "nota", style: "margin:0; padding-left:18px; display:grid; gap:6px" },
          h("li", null, "Fuente: los forks públicos de los seis repositorios (docs, api, app, page, infra, tool), leídos de GitHub a las " + M.generadoTxt + ". Ventana válida: 10 de octubre de 2026, de 9:15 a. m. a 3:00 p. m., hora de Colombia."),
          h("li", null, nf.format(T.forks_historia_reescrita) + " de " + nf.format(T.forks_con_commits) + " forks con trabajo ya no descienden del commit original: el aprendiz subió un historial nuevo, normalmente de un solo commit por repositorio. Por eso la secuencia se apoya en la hora, el tamaño y el mensaje de cada commit, y por eso la granularidad vale poco en este grupo."),
          h("li", null, "Un commit es «válido» si la hora del autor está entre las 9:15 y las 15:00. Hay " + nf.format(T.commits_tardios) + " con hora posterior. Un push es «tarde» si el último push del fork fue después de las 15:00; en ese caso no se puede confirmar qué estaba subido a la hora de cierre."),
          h("li", null, "La hora de un commit la fija el reloj del equipo del aprendiz. No es la hora del push, que sí viene de GitHub."),
          h("li", null, "Cuenta solo lo que está hoy en GitHub: si alguien reescribió su historial, el trabajo anterior no aparece."),
          h("li", null, "Informes 3 y 4: cada repositorio se evalúa en su último commit hasta las 15:00. Los chequeos buscan texto en el código (rutas, migraciones, nombres de error, variables); una ruta definida de una forma poco común puede no detectarse. Las coincidencias entre aprendices comparan archivos idénticos (api, app) o el contenido línea a línea (page, infra, tool) y se marcan desde el 85 %; no dicen quién copió a quién."),
          h("li", null, "Las capturas del informe 4 se tomaron con Chrome sin ventana, con un perfil temporal, a 1366 y 390 px de ancho."),
          h("li", null, "Coincidencias entre aprendices: un repositorio que coincide en 98 % o más con el de otro aprendiz pierde todos sus puntos en los informes 3, 4 y 5; desde 85 %, la mitad. Se aplica a los dos, porque el dato no dice quién copió a quién."),
          h("li", null, M.anonimo ? "Versión pública: cada aprendiz aparece con un código (A01, A02…) que no sigue el orden alfabético ni el del puntaje. El instructor le informa a cada uno el suyo. No incluye capturas, rutas de archivos ni fragmentos de texto de los repositorios." : "Contiene nombres de aprendices y puntajes individuales. La versión pública usa los códigos que aparecen junto a cada nombre."))),
      h("section", { class: "panel" }, h("h2", null, "Cómo crece este artifact"),
        h("p", { class: "nota" }, "Cada informe nuevo se agrega como una pestaña y como una columna en la panorámica, con su propio puntaje y su dimensión (Conocimiento, Desempeño o Producto). El acumulado y el porcentaje se recalculan solos."))
    ];
  }

  // ---------- pestañas ----------
  const RENDER = { pano: renderPano, i1: renderI1, i2: renderI2, i3: renderI3, i4: renderI4, i5: renderI5, i6: renderI6, i7: renderI7, metodo: renderMetodo };
  const TABS = [{ id: "pano", t: "Panorámica" }].concat(M.informes.map((i) => ({ id: i.id, t: "Informe " + i.num + " · " + i.corto }))).concat([{ id: "metodo", t: "Método" }]);
  const cache = {};
  const vista = document.getElementById("vista"), tabs = document.getElementById("tabs");
  function mostrar(id, guardar) {
    if (!RENDER[id]) id = "pano";
    [...tabs.children].forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === id)));
    if (!cache[id]) cache[id] = [].concat(RENDER[id]()).filter(Boolean);
    vista.replaceChildren(...cache[id]);
    if (guardar) { try { history.replaceState(null, "", "#" + id); } catch (e) { /* sin historial */ } }
  }
  TABS.forEach((t) => tabs.append(h("button", { type: "button", role: "tab", "data-id": t.id, "aria-selected": "false", onclick: () => mostrar(t.id, true) }, t.t)));
  document.getElementById("titulo").textContent = "Informes · Ficha " + M.ficha;
  document.getElementById("meta").textContent = "Prueba técnica " + M.prueba + " · " + M.fecha + " · " + M.inicio + " a " + M.fin + " (hora Colombia) · datos de GitHub a las " + M.generadoTxt;
  document.getElementById("pie").textContent = M.anonimo
    ? "Versión pública anonimizada: cada aprendiz tiene un código que le informa el instructor. Los informes se ordenan siempre de mayor a menor puntaje."
    : "Documento privado con nombres de aprendices. Los informes se ordenan siempre de mayor a menor puntaje.";
  mostrar((location.hash || "").slice(1) || "pano", false);
})();
</script>
